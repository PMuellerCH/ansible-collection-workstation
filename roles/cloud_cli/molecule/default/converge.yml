---
- name: Converge
  hosts: all
  gather_facts: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
    HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
    HTTPS_PROXY: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
  vars:
    # Non-empty test data so the templated-config deploy path (not just the
    # empty-list skip path) is exercised for real. Fake account IDs / ARNs /
    # a placeholder base64 CA — none of this is real data.
    cloud_cli_aws_profiles:
      - name: default
        sso_start_url: "https://molecule-test.awsapps.com/start#/"
        sso_region: eu-central-1
        output: json
      - name: molecule-test
        sso_start_url: "https://molecule-test.awsapps.com/start#/"
        sso_role_name: AdministratorAccess
        sso_account_id: "123456789012"
        sso_region: eu-central-1
        region: eu-central-1
        output: json
  roles:
    # ansible_dev (ansible component only) provides the ansible-core pipx venv
    # that cloud_cli injects boto3 into; Docker/act aren't needed here.
    - role: pmuellerch.workstation.ansible_dev
      vars:
        ansible_dev_docker_enabled: false
        ansible_dev_act_enabled: false
    - role: pmuellerch.workstation.cloud_cli
