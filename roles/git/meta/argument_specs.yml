---
argument_specs:
  main:
    short_description: Install git and configure global identity, editor, and commit-signing preferences
    options:
      git_version:
        type: str
        required: false
        default: "1:2.43.0-1ubuntu7.3"
        description: Exact apt package version of git to install (held after install).
      git_user_name:
        type: str
        required: true
        description: >-
          Value for git's global user.name. No sensible generic default exists —
          must be supplied by the consumer.
      git_user_email:
        type: str
        required: true
        description: >-
          Value for git's global user.email. No sensible generic default exists —
          must be supplied by the consumer.
      git_default_branch:
        type: str
        required: false
        default: main
        description: Value for git's global init.defaultBranch.
      git_pull_rebase:
        type: bool
        required: false
        default: true
        description: Whether git pull rebases instead of merges (pull.rebase).
      git_push_default:
        type: str
        required: false
        default: simple
        description: Value for git's global push.default.
      git_editor:
        type: str
        required: false
        default: vim
        description: >-
          Value for git's global core.editor. Defaults to vim (always present on
          Debian/Ubuntu); override to your preferred editor.
      git_signing_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Whether to configure SSH-based commit/tag signing (gpg.format=ssh,
          user.signingkey, commit.gpgsign, tag.gpgSign). Disable if you don't sign
          commits.
      git_signing_key:
        type: str
        required: false
        default: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519.pub"
        description: >-
          Path to the SSH public key used as git's user.signingkey. Only applied
          when git_signing_enabled is true.
