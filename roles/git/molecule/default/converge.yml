---
- name: Converge
  hosts: all
  gather_facts: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'http_proxy') }}"
    HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
    HTTPS_PROXY: "{{ lookup('env', 'http_proxy') }}"
  roles:
    - role: swisstopo.workstation.git
      vars:
        git_user_name: Molecule Test
        git_user_email: molecule@example.com
