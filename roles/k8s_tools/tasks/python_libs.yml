---

- name: Install Python Kubernetes libraries via apt (Ubuntu)
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-jsonpatch
      - python3-hvac
      - python3-pyhcl
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts['distribution'] == 'Ubuntu'

# On non-Ubuntu targets the equivalent pip packages go into the ansible-core
# pipx venv owned by the ansible_dev role (which already injects hvac, so it is
# not repeated here). If that venv doesn't exist yet the inject is skipped
# rather than failing — `pipx inject` requires the target app to already exist.
# Run ansible_dev first, then re-run this role.

- name: Check whether the ansible-core pipx venv exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/pipx/venvs/ansible-core"
  register: k8s_tools_ansible_core_stat
  become: false
  when: ansible_facts['distribution'] != 'Ubuntu'

- name: Warn that the Python library inject is skipped without the ansible-core venv
  ansible.builtin.debug:
    msg: "ansible-core pipx venv not found - skipping the Python Kubernetes library inject. Run the ansible_dev role first, then re-run k8s_tools."
  when: ansible_facts['distribution'] != 'Ubuntu' and not k8s_tools_ansible_core_stat.stat.exists

- name: Inject Python Kubernetes libraries into ansible-core pipx venv (non-Ubuntu)
  community.general.pipx:
    name: ansible-core
    state: inject
    inject_packages:
      - "kubernetes=={{ k8s_tools_pip_kubernetes_version }}"
      - "jsonpatch=={{ k8s_tools_pip_jsonpatch_version }}"
      - "pyhcl=={{ k8s_tools_pip_pyhcl_version }}"
  become: false
  when: >-
    not ansible_check_mode and ansible_facts['distribution'] != 'Ubuntu' and
    k8s_tools_ansible_core_stat.stat.exists
