---
- name: Verify
  hosts: all
  gather_facts: true
  # Load the role's own defaults so pinned-version assertions track
  # defaults/main.yml as their single source of truth, rather than a second
  # hardcoded literal that would silently go stale whenever Renovate bumps it.
  vars_files:
    - ../../defaults/main.yml
  vars:
    _cli_tools_local_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt


    - name: Assert all tools are installed
      ansible.builtin.assert:
        that:
          - "'bat' in ansible_facts.packages"
          - "'btop' in ansible_facts.packages"
          - "'eza' in ansible_facts.packages"
          - "'fd-find' in ansible_facts.packages"
          - "'htop' in ansible_facts.packages"
          - "'ripgrep' in ansible_facts.packages"
          - "'zoxide' in ansible_facts.packages"
          - "'sd' in ansible_facts.packages"
          - "'duf' in ansible_facts.packages"
          - "'gping' in ansible_facts.packages"
          - "'hexyl' in ansible_facts.packages"
          - "'du-dust' in ansible_facts.packages"
          - "'yazi' in ansible_facts.packages"


    - name: Stat fd symlink
      ansible.builtin.stat:
        path: /usr/local/bin/fd
      register: _cli_tools_fd_symlink


    - name: Assert fd symlink exists
      ansible.builtin.assert:
        that: _cli_tools_fd_symlink.stat.exists


    - name: Stat bat Catppuccin theme
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/bat/themes/Catppuccin Mocha.tmTheme"
      register: _cli_tools_bat_theme


    - name: Assert bat theme was downloaded
      ansible.builtin.assert:
        that: _cli_tools_bat_theme.stat.exists


    - name: Stat btop Catppuccin theme
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/btop/themes/catppuccin_mocha.theme"
      register: _cli_tools_btop_theme


    - name: Assert btop theme was downloaded
      ansible.builtin.assert:
        that: _cli_tools_btop_theme.stat.exists


    - name: Stat zsh alias snippet
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/cli_tools.zsh"
      register: _cli_tools_zsh_snippet


    - name: Assert zsh alias snippet was deployed
      ansible.builtin.assert:
        that: _cli_tools_zsh_snippet.stat.exists


    - name: Check fzf runs
      ansible.builtin.command: fzf --version
      register: _cli_tools_fzf_version
      changed_when: false


    - name: Assert fzf reports the pinned version
      ansible.builtin.assert:
        that: "cli_tools_fzf_version in _cli_tools_fzf_version.stdout"


    - name: Check pipx bootstrap produced pipx >= 1.7.0
      ansible.builtin.command: "{{ _cli_tools_local_bin }}/pipx --version"
      register: _cli_tools_pipx_version
      changed_when: false


    - name: Assert bootstrapped pipx satisfies community.general.pipx's minimum
      ansible.builtin.assert:
        that: _cli_tools_pipx_version.stdout is version('1.7.0', '>=')


    - name: Check emoji-fzf is importable via its pipx-installed binary
      ansible.builtin.command: "{{ _cli_tools_local_bin }}/emoji-fzf --version"
      register: _cli_tools_emoji_fzf_version
      changed_when: false


    - name: Assert emoji-fzf reports the pinned version
      ansible.builtin.assert:
        that: "cli_tools_emoji_fzf_version in _cli_tools_emoji_fzf_version.stdout"


    - name: Check GitHub-release binaries run and report their pinned version
      ansible.builtin.command: "{{ item.bin }} --version"
      register: _cli_tools_gh_release_versions
      changed_when: false
      loop:
        - { bin: procs, version: "{{ cli_tools_procs_version }}" }
        - { bin: dust, version: "{{ cli_tools_dust_version }}" }
        - { bin: viddy, version: "{{ cli_tools_viddy_version }}" }
        - { bin: xcp, version: "{{ cli_tools_xcp_version }}" }
        - { bin: doggo, version: "{{ cli_tools_doggo_version }}" }
        - { bin: jaq, version: "{{ cli_tools_jaq_version }}" }
        - { bin: moor, version: "{{ cli_tools_moor_version }}" }
        - { bin: ctty, version: "{{ cli_tools_ctty_version }}" }
      loop_control:
        label: "{{ item.bin }}"


    - name: Assert GitHub-release binaries report their pinned version
      ansible.builtin.assert:
        that: "item.item.version in item.stdout"
      loop: "{{ _cli_tools_gh_release_versions.results }}"
      loop_control:
        label: "{{ item.item.bin }}"


    - name: Check yazi and ya run and report the pinned version
      ansible.builtin.command: "{{ item }} --version"
      register: _cli_tools_yazi_versions
      changed_when: false
      loop:
        - yazi
        - ya
      loop_control:
        label: "{{ item }}"


    - name: Assert yazi and ya report the pinned version
      ansible.builtin.assert:
        that: "cli_tools_yazi_version in item.stdout"
      loop: "{{ _cli_tools_yazi_versions.results }}"
      loop_control:
        label: "{{ item.item }}"


    - name: Stat yazi Catppuccin theme
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/yazi/theme.toml"
      register: _cli_tools_yazi_theme


    - name: Assert yazi theme was downloaded
      ansible.builtin.assert:
        that: _cli_tools_yazi_theme.stat.exists
