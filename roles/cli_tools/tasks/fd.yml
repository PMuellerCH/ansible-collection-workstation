---
# fd
- name: Install fd-find
  ansible.builtin.apt:
    name: fd-find
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: cli_tools_fd_enabled
  tags: [fd, cli_tools]

- name: Create /usr/local/bin/fd symlink (fd-find installs as fdfind on Debian/Ubuntu)
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
    force: true
  become: true
  when: cli_tools_fd_enabled
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [fd, cli_tools]
