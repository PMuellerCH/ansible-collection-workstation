---
# btop
- name: Install btop
  ansible.builtin.apt:
    name: btop
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: cli_tools_btop_enabled
  tags: [btop, cli_tools]

- name: Create btop themes directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/btop/themes"
    state: directory
    mode: "0755"
  become: false
  when: cli_tools_btop_enabled
  tags: [btop, cli_tools]

- name: Check if Catppuccin Mocha btop theme is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/btop/themes/catppuccin_mocha.theme"
  register: cli_tools_btop_theme_stat
  become: false
  when: cli_tools_btop_enabled
  tags: [btop, cli_tools]

- name: Download Catppuccin btop themes archive
  ansible.builtin.get_url:
    url: "https://github.com/catppuccin/btop/releases/download/{{ cli_tools_btop_catppuccin_version }}/themes.tar.gz"
    dest: "/tmp/catppuccin-btop-themes.tar.gz"
    checksum: "{{ cli_tools_btop_catppuccin_checksum }}"
    mode: "0644"
  register: cli_tools_btop_theme_archive
  when: cli_tools_btop_enabled
  tags: [btop, cli_tools]

- name: Extract Catppuccin Mocha btop theme
  ansible.builtin.unarchive:
    src: "/tmp/catppuccin-btop-themes.tar.gz"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/btop/themes"
    include:
      - themes/catppuccin_mocha.theme
    extra_opts:
      - --strip-components=1
    remote_src: true
  become: false
  when: >-
    cli_tools_btop_enabled and
    (cli_tools_btop_theme_archive.changed or not cli_tools_btop_theme_stat.stat.exists)
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [btop, cli_tools]

- name: Configure btop to use Catppuccin Mocha theme
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/btop/btop.conf"
    content: |
      color_theme = "catppuccin_mocha"
    mode: "0644"
    force: false
  become: false
  when: cli_tools_btop_enabled
  tags: [btop, cli_tools]
