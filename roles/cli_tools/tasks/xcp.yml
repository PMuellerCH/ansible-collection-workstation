---
# xcp (github release tar.gz; tarka/xcp publishes no checksum file, so the
# checksum is derived at run time from GitHub's per-asset digest — see README.
# Note the xcp-v<version> tag prefix.)
- name: Get installed xcp version
  ansible.builtin.command: xcp --version
  register: cli_tools_xcp_current_version
  changed_when: false
  failed_when: false
  when: cli_tools_xcp_enabled
  tags: [xcp, cli_tools]

- name: Fetch xcp release metadata for the GitHub asset digest
  ansible.builtin.get_url:
    url: "https://api.github.com/repos/tarka/xcp/releases/tags/xcp-v{{ cli_tools_xcp_version }}"
    dest: "{{ cli_tools_dl_tmp.path }}/xcp-{{ cli_tools_xcp_version }}_release.json"
    force: true
    headers: >-
      {{ {'Accept': 'application/vnd.github+json'}
         | combine({'Authorization': 'Bearer ' + cli_tools_github_api_token}
                   if cli_tools_github_api_token else {}) }}
    mode: "0644"
  no_log: "{{ cli_tools_github_api_token | length > 0 }}"
  when: >-
    not ansible_check_mode and
    cli_tools_xcp_enabled and
    (cli_tools_xcp_current_version.rc != 0 or
     cli_tools_xcp_version not in cli_tools_xcp_current_version.stdout)
  tags: [xcp, cli_tools]

- name: Read xcp release metadata
  ansible.builtin.slurp:
    path: "{{ cli_tools_dl_tmp.path }}/xcp-{{ cli_tools_xcp_version }}_release.json"
  register: cli_tools_xcp_release_raw
  when: >-
    not ansible_check_mode and
    cli_tools_xcp_enabled and
    (cli_tools_xcp_current_version.rc != 0 or
     cli_tools_xcp_version not in cli_tools_xcp_current_version.stdout)
  tags: [xcp, cli_tools]

- name: Resolve xcp archive checksum from the release metadata
  ansible.builtin.set_fact:
    cli_tools_xcp_checksum: >-
      {{ (cli_tools_xcp_release_raw.content | b64decode | from_json).assets
         | selectattr('name', 'equalto', 'xcp-v' + cli_tools_xcp_version + '-x86_64-unknown-linux-gnu.tar.gz')
         | map(attribute='digest') | select('string') | first | default('') }}
  when: >-
    not ansible_check_mode and
    cli_tools_xcp_enabled and
    (cli_tools_xcp_current_version.rc != 0 or
     cli_tools_xcp_version not in cli_tools_xcp_current_version.stdout)
  tags: [xcp, cli_tools]

- name: Assert GitHub published a sha256 digest for the xcp archive
  ansible.builtin.assert:
    that: cli_tools_xcp_checksum.startswith('sha256:')
    fail_msg: >-
      GitHub published no sha256 digest for xcp-v{{ cli_tools_xcp_version }}-x86_64-unknown-linux-gnu.tar.gz;
      cannot verify the download.
  when: >-
    not ansible_check_mode and
    cli_tools_xcp_enabled and
    (cli_tools_xcp_current_version.rc != 0 or
     cli_tools_xcp_version not in cli_tools_xcp_current_version.stdout)
  tags: [xcp, cli_tools]

- name: Download xcp archive
  ansible.builtin.get_url:
    url: "https://github.com/tarka/xcp/releases/download/xcp-v{{ cli_tools_xcp_version }}/xcp-v{{ cli_tools_xcp_version }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ cli_tools_dl_tmp.path }}/xcp-{{ cli_tools_xcp_version }}.tar.gz"
    checksum: "{{ cli_tools_xcp_checksum }}"
    mode: "0644"
  when: >-
    not ansible_check_mode and
    cli_tools_xcp_enabled and
    (cli_tools_xcp_current_version.rc != 0 or
     cli_tools_xcp_version not in cli_tools_xcp_current_version.stdout)
  tags: [xcp, cli_tools]

- name: Install xcp binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "{{ cli_tools_dl_tmp.path }}/xcp-{{ cli_tools_xcp_version }}.tar.gz"
    dest: /usr/local/bin/
    include:
      - "xcp-v{{ cli_tools_xcp_version }}-x86_64-unknown-linux-gnu/bin/xcp"
    extra_opts:
      - --strip-components=2
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and
    cli_tools_xcp_enabled and
    (cli_tools_xcp_current_version.rc != 0 or
     cli_tools_xcp_version not in cli_tools_xcp_current_version.stdout)
  tags: [xcp, cli_tools]
