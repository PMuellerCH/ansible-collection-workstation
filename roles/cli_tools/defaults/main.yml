---
# cli_tools: modern replacements for the classic CLI tools

cli_tools_bat_enabled: true
cli_tools_btop_enabled: true
cli_tools_emoji_fzf_enabled: true
cli_tools_eza_enabled: true
cli_tools_fd_enabled: true
cli_tools_fzf_enabled: true
cli_tools_htop_enabled: true
cli_tools_ripgrep_enabled: true
cli_tools_zoxide_enabled: true
cli_tools_sd_enabled: true
cli_tools_duf_enabled: true
cli_tools_gping_enabled: true
cli_tools_hexyl_enabled: true
cli_tools_procs_enabled: true
cli_tools_dust_enabled: true
cli_tools_viddy_enabled: true
cli_tools_xcp_enabled: true
cli_tools_doggo_enabled: true
cli_tools_jaq_enabled: true
cli_tools_moor_enabled: true
cli_tools_yazi_enabled: true
cli_tools_ctty_enabled: true

# Optional GitHub API token used only to raise the rate limit when resolving
# release-asset digests for tools that publish no checksum file (dust, jaq,
# moor, procs, xcp, yazi — see tasks/main.yml). Defaults to GH_TOKEN/GITHUB_TOKEN
# from the environment; unauthenticated (empty) still works but is subject to
# GitHub's 60 requests/hour per-IP limit. The shared molecule
# workflow does not currently pass a token, so CI runs unauthenticated and
# relies on the metadata-fetch retries (3 retries, 15 s apart); a consumer can
# override this with their own token.
cli_tools_github_api_token: "{{ lookup('ansible.builtin.env', 'GH_TOKEN') or lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"

# Pinned commit of catppuccin/bat (theme is fetched from an immutable ref, not the mutable "main" branch)
cli_tools_bat_theme_ref: "6810349b28055dce54076712fc05fc68da4b8ec0"  # pragma: allowlist secret
cli_tools_bat_theme_checksum: "sha256:395566f08ceb301b936b91c077690ef94f7aeb651b121553f201c99c2bd4aa77"

# renovate: datasource=github-releases depName=catppuccin/btop
cli_tools_btop_catppuccin_version: "1.0.0"
cli_tools_btop_catppuccin_checksum: "sha256:5331e055f239d2b42a15496905c6f357493940e1213cc91acfcba67b3fd7a281"

# renovate: datasource=github-releases depName=junegunn/fzf extractVersion=^v(?<version>.*)$
cli_tools_fzf_version: "0.75.0"

# renovate: datasource=pypi depName=emoji-fzf
cli_tools_emoji_fzf_version: "0.12.0"

# Minimum pipx version community.general.pipx requires (Ubuntu 24.04's apt-provided
# pipx is only 1.4.3 — see README "pipx bootstrap" section). Same pattern as
# code_quality_tools_pipx_min_version; cli_tools bootstraps its own pipx
# since it cannot assume another role already upgraded it (role independence).
# renovate: datasource=pypi depName=pipx
cli_tools_pipx_min_version: "1.19.2"

# renovate: datasource=github-releases depName=dalance/procs extractVersion=^v(?<version>.*)$
cli_tools_procs_version: "0.14.12"

# dalance/procs publishes no checksum file; the archive checksum is derived at
# run time from GitHub's per-asset digest (see tasks/main.yml).

# renovate: datasource=github-releases depName=bootandy/dust extractVersion=^v(?<version>.*)$
cli_tools_dust_version: "1.2.8"

# bootandy/dust publishes no checksum file; the .deb checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml), so there is no static
# checksum to keep in sync when Renovate bumps the version.

# renovate: datasource=github-releases depName=sachaos/viddy extractVersion=^v(?<version>.*)$
cli_tools_viddy_version: "1.3.1"

# renovate: datasource=github-releases depName=tarka/xcp extractVersion=^xcp-v(?<version>.*)$
cli_tools_xcp_version: "0.24.9"

# tarka/xcp publishes no checksum file; the archive checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml).

# renovate: datasource=github-releases depName=mr-karan/doggo extractVersion=^v(?<version>.*)$
cli_tools_doggo_version: "1.4.2"

# renovate: datasource=github-releases depName=zsuroy/ctty extractVersion=^v(?<version>.*)$
cli_tools_ctty_version: "1.4.1"

# renovate: datasource=github-releases depName=01mf02/jaq extractVersion=^v(?<version>.*)$
cli_tools_jaq_version: "3.2.0"

# 01mf02/jaq publishes no checksum file; the binary checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml).

# The upstream project (repo walles/moar) renamed the tool itself to "moor"
# to resolve a name clash — release assets and the installed binary are
# named "moor", not "moar", even though the GitHub repo path is unchanged.
# renovate: datasource=github-releases depName=walles/moar extractVersion=^v(?<version>.*)$
cli_tools_moor_version: "2.19.8"

# walles/moar publishes no checksum file; the binary checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml), so there is no static
# checksum to keep in sync when Renovate bumps the version.

# renovate: datasource=github-releases depName=sxyazi/yazi extractVersion=^v(?<version>.*)$
cli_tools_yazi_version: "26.9.1"

# sxyazi/yazi publishes no checksum file; the .deb checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml), so there is no static
# checksum to keep in sync when Renovate bumps the version.

# Pinned commit of catppuccin/yazi (no releases/tags published upstream —
# theme is fetched from an immutable ref, not the mutable "main" branch).
# "mauve" is Catppuccin's default accent color.
cli_tools_yazi_theme_ref: "d62802be39210ea10e54b3e3b09735c6cb9e57c1"  # pragma: allowlist secret
cli_tools_yazi_theme_checksum: "sha256:79d14028498ecf7da42fe3dc53b4436b43a24c723a0dea93020bffd23d235436"
cli_tools_deploy_shell_aliases: true
