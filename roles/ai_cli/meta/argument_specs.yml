---
argument_specs:
  main:
    short_description: 'Install the AI coding agent CLIs: Claude Code (npm, needs Node.js from the base role), Kiro CLI and OpenCode — each independently
      toggleable.'
    options:
      ai_cli_claude_code_enabled:
        default: true
        description: Whether to install the Claude Code CLI, and configure its MCP servers (needs Node.js/npm from the base role).
        required: false
        type: bool
      ai_cli_kiro_enabled:
        default: true
        description: Whether to install the Kiro CLI (kiro-cli), set its default behaviour (v3 agent engine, tool auto-search, autonomous mode), and deploy
          its shell aliases.
        required: false
        type: bool
      ai_cli_claude_code_version:
        description: '@anthropic-ai/claude-code npm package version (npm datasource).'
        required: false
        type: str
      ai_cli_mcp_ansible_version:
        description: Pinned version of the @ansible/ansible-mcp-server MCP server package (npm datasource, Renovate-managed).
        required: false
        type: str
      ai_cli_mcp_aws_documentation_version:
        description: Pinned version of the awslabs.aws-documentation-mcp-server MCP server package (PyPI datasource, Renovate-managed).
        required: false
        type: str
      ai_cli_mcp_aws_core_version:
        description: Pinned version of the awslabs.core-mcp-server MCP server package (PyPI datasource, Renovate-managed).
        required: false
        type: str
      ai_cli_mcp_terraform_version:
        description: Pinned version of the terraform-mcp-server MCP server package (npm datasource, Renovate-managed).
        required: false
        type: str
      ai_cli_mcp_github_version:
        description: Pinned version of the github/github-mcp-server release binary (github-releases datasource, Renovate-managed).
        required: false
        type: str
      ai_cli_mcp_github_asset:
        description: Linux release asset name of github-mcp-server; its sha256 digest is fetched from the release API at run time.
        required: false
        type: str
      ai_cli_mcp_github_bin:
        description: Absolute install path of the github-mcp-server binary (also used as the MCP server command).
        required: false
        type: str
      ai_cli_mcp_github_api_token:
        default: '{{ ai_cli_github_api_token }}'
        description: Optional GitHub API token used only to raise the rate limit when resolving the release-asset digest.
        required: false
        type: str
      ai_cli_mcp_renovate_version:
        description: Pinned version of the renovate-mcp MCP server package (npm datasource, Renovate-managed).
        required: false
        type: str
      ai_cli_claude_code_aws_profile:
        default: default
        description: AWS_PROFILE passed to the awslabs.core MCP server.
        required: false
        type: str
      ai_cli_claude_code_aws_region:
        default: eu-central-1
        description: AWS_REGION passed to the awslabs.core MCP server.
        required: false
        type: str
      ai_cli_claude_code_github_token:
        default: ''
        description: GitHub PAT passed as GITHUB_PERSONAL_ACCESS_TOKEN to the github MCP server (from the consumer's own secret store, e.g. Ansible Vault).
          Empty by default.
        required: false
        type: str
      ai_cli_kiro_bin:
        default: '{{ ansible_facts[''env''][''HOME''] }}/.local/bin/kiro-cli'
        description: Absolute path to the kiro-cli binary. Used to detect an existing install and to invoke the binary by full path, since ~/.local/bin
          is not guaranteed to be on $PATH for a non-interactive Ansible run.
        required: false
        type: str
      ai_cli_kiro_install_url:
        default: https://cli.kiro.dev/install
        description: URL of the official kiro-cli install script, downloaded and run when the binary is absent. Unpinned by necessity — kiro-cli is a
          self-updating binary with no versioned release asset to pin; see README.
        required: false
        type: str
      ai_cli_kiro_update:
        default: true
        description: When the binary is already present, run `kiro-cli update --non-interactive` to converge to the latest release. Set false to leave an
          existing install untouched.
        required: false
        type: bool
      ai_cli_kiro_agent_engine:
        default: v3
        description: Value for the global `chat.agentEngine` setting ("v3 cli"). Applied via `kiro-cli settings`.
        required: false
        type: str
      ai_cli_kiro_tool_search_enabled:
        default: true
        description: Value for the global `toolSearch.enabled` setting ("autosearch for tools"). Applied via `kiro-cli settings`.
        required: false
        type: bool
      ai_cli_kiro_disable_trust_all_confirmation:
        default: true
        description: Value for the global `chat.disableTrustAllConfirmation` setting. When true, the `ki` alias (which passes `--trust-all-tools`) starts
          autonomous chat without a per-launch confirmation prompt.
        required: false
        type: bool
      ai_cli_kiro_sandbox_enabled:
        default: true
        description: Whether to set up the Kiro local command sandbox (needs kiro-cli >= 2.31) — install bubblewrap and socat and create
          ~/.kiro/settings/sandbox.json if it does not exist. An existing sandbox.json is never overwritten.
        required: false
        type: bool
      ai_cli_kiro_sandbox_network_access:
        default: DEFAULT_BLOCKED
        description: Value of `networkAccess` written to a newly created ~/.kiro/settings/sandbox.json. Allowed hosts are sandbox_network permission rules
          of the team configuration, not set here.
        required: false
        type: str
      ai_cli_kiro_team_config_repo:
        default: ''
        description: Git URL of the shared Kiro team configuration (steering, skills, hooks, permissions) with an idempotent install.sh. Empty disables
          the feature. Set per consumer; the repository may need the user's own git credentials.
        required: false
        type: str
      ai_cli_kiro_team_config_dest:
        default: '{{ ansible_facts[''env''][''HOME''] }}/Repos/infra-ai-skills'
        description: Directory the team configuration repository is cloned to.
        required: false
        type: str
      ai_cli_kiro_team_config_version:
        default: main
        description: Branch or tag of the team configuration repository to check out. A tag is preferable to a branch. install.sh is re-run when the checkout
          changes.
        required: false
        type: str
      ai_cli_kiro_deploy_shell_aliases:
        default: true
        description: Whether to deploy ~/.config/zsh/conf.d/kiro.zsh with the chat and login aliases.
        required: false
        type: bool
      ai_cli_kiro_alias_chat:
        default: ki
        description: Alias name for `kiro-cli chat --trust-all-tools` (autonomous mode).
        required: false
        type: str
      ai_cli_kiro_alias_login:
        default: kil
        description: Alias name for `kiro-cli login`.
        required: false
        type: str
      ai_cli_opencode_enabled:
        default: true
        description: Whether to install OpenCode (model-agnostic AI coding agent), deploy its default-model config, and deploy its shell aliases.
        required: false
        type: bool
      ai_cli_opencode_bin:
        default: '{{ ansible_facts[''env''][''HOME''] }}/.local/bin/opencode'
        description: Absolute path to the opencode binary. Used to detect an existing install, read the installed version, and invoke the binary by full
          path, since ~/.local/bin is not guaranteed to be on $PATH for a non-interactive Ansible run.
        required: false
        type: str
      ai_cli_opencode_version:
        description: OpenCode version (github-releases anomalyco/opencode), installed from a release tarball verified against GitHub's per-asset digest.
        required: false
        type: str
      ai_cli_opencode_download_base:
        default: https://github.com/anomalyco/opencode/releases/download/v{{ ai_cli_opencode_version }}
        description: Base URL the opencode release asset is downloaded from, before the filename.
        required: false
        type: str
      ai_cli_opencode_asset:
        default: opencode-linux-x64.tar.gz
        description: Linux x64 release asset filename. Contains a single flat `opencode` binary and is verified against GitHub's per-asset sha256 digest
          (OpenCode publishes no checksum file).
        required: false
        type: str
      ai_cli_opencode_github_api_token:
        default: '{{ ai_cli_github_api_token }}'
        description: Optional GitHub API token used only to raise the rate limit when resolving the opencode release-asset digest. Defaults to the same
          GH_TOKEN/GITHUB_TOKEN env lookup as ai_cli_github_api_token.
        required: false
        type: str
      ai_cli_opencode_model:
        default: mistral/mistral-medium-2604
        description: Default model OpenCode talks to ("provider/model-id"), written into the deployed opencode.json. Defaults to Mistral AI's agentic coding
          model; mistral/codestral-2508 is a completion-focused alternative. The MISTRAL_API_KEY and `opencode` login are left to the user.
        required: false
        type: str
      ai_cli_opencode_deploy_config:
        default: true
        description: Whether to deploy ~/.config/opencode/opencode.json. The role owns only the top-level `model` key, rewriting the file only when it differs
          (user-added keys are preserved).
        required: false
        type: bool
      ai_cli_opencode_deploy_shell_aliases:
        default: true
        description: Whether to deploy ~/.config/zsh/conf.d/opencode.zsh with the TUI and headless-run aliases.
        required: false
        type: bool
      ai_cli_opencode_alias_tui:
        default: oc
        description: Alias name for `opencode` (interactive TUI).
        required: false
        type: str
      ai_cli_opencode_alias_run:
        default: ocr
        description: Alias name for `opencode run` (headless prompt, no TUI).
        required: false
        type: str
      ai_cli_github_api_token:
        default: '{{ lookup(''ansible.builtin.env'', ''GH_TOKEN'') or lookup(''ansible.builtin.env'', ''GITHUB_TOKEN'') }}'
        description: Optional GitHub API token, used only to raise the rate limit when resolving the opencode release-asset digest.
        required: false
        type: str
