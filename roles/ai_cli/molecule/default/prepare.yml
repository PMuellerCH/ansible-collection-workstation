---
- name: Prepare
  hosts: all
  gather_facts: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
  tasks:
    - name: Install curl and unzip (provided by the base role on a real workstation)
      # curl + unzip: the upstream kiro-cli install script aborts in its
      # check_dependencies() unless a downloader (curl or wget), unzip and
      # sha256sum are all present; the bare test image ships none of
      # curl/wget/unzip (sha256sum comes from coreutils). On a real workstation
      # all of these come from the base role.
      ansible.builtin.apt:
        name:
          - curl
          - unzip
        state: present
        update_cache: true
      become: true

    - name: Install Node.js and npm (provided by the base role on a real workstation)
      # Claude Code is an npm package; the ai_cli role asserts npm is present
      # instead of installing Node.js itself.
      ansible.builtin.include_role:
        name: pmuellerch.workstation.base
        tasks_from: nodejs
      vars:
        base_nodejs_enabled: true
        base_nodejs_major_version: "24"

    - name: Create ~/.claude directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.claude"
        state: directory
        mode: "0755"
      become: false

    - name: Seed ~/.claude.json with a manually-registered MCP server
      # Simulates a server added outside this role (e.g. `claude mcp add`,
      # or `aws configure agent-toolkit`'s aws-mcp) — verify.yml asserts
      # this survives converge, proving the role merges onto mcpServers
      # rather than replacing it wholesale.
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
        mode: "0600"
        content: |
          {
            "mcpServers": {
              "aws-mcp": {
                "type": "stdio",
                "command": "uvx",
                "args": ["mcp-proxy-for-aws@latest"]
              }
            }
          }
      become: false

    - name: Seed a legacy kiro_cli.zsh snippet from the removed standalone role
      # Simulates a machine provisioned by an older collection version whose
      # standalone kiro_cli role deployed ~/.config/zsh/conf.d/kiro_cli.zsh.
      # verify.yml asserts the merged role's cleanup task removed it, so the
      # orphan can't keep overriding the new kiro.zsh aliases.
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
        state: directory
        mode: "0755"
      become: false

    - name: Write the legacy kiro_cli.zsh content
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro_cli.zsh"
        mode: "0644"
        content: |
          # Kiro CLI aliases — managed by Ansible (kiro_cli role)
          alias ki='kiro-cli chat --trust-all-tools'
          alias kil='kiro-cli login'
      become: false

    - name: Create ~/.config/opencode directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode"
        state: directory
        mode: "0755"
      become: false

    - name: Seed ~/.config/opencode/opencode.json with a stale model and a user-added key
      # Simulates an already-provisioned machine whose opencode.json has a
      # different model than the role default, plus a key the user added by
      # hand. verify.yml asserts converge rewrites `model` to the role default
      # (proving a model change is picked up, not silently ignored) while the
      # user-added `theme` key survives (proving the merge preserves foreign
      # keys instead of overwriting the file wholesale).
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
        mode: "0644"
        content: |
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "mistral/codestral-2508",
            "theme": "catppuccin"
          }
      become: false
