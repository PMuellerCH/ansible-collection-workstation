---
- name: Verify
  hosts: all
  gather_facts: true
  # Load the role's own defaults so pinned-version assertions track
  # defaults/main.yml as their single source of truth, rather than a second
  # hardcoded literal that would silently go stale whenever Renovate bumps it.
  vars_files:
    - ../../defaults/main.yml
  vars:
    # Claude Code is installed into the user's own npm prefix (~/.local),
    # not a system-wide location on PATH by default for non-interactive
    # exec — same convention as code_quality_tools' pipx-installed tools.
    _ai_cli_claude_code_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  tasks:
    # claude-code

    - name: Check Claude Code CLI runs
      ansible.builtin.command: "{{ _ai_cli_claude_code_bin }} --version"
      register: _ai_cli_claude_code_version
      changed_when: false


    - name: Assert Claude Code CLI reports the pinned version
      ansible.builtin.assert:
        that: "ai_cli_claude_code_version in _ai_cli_claude_code_version.stdout"


    - name: Read npm prefix environment.d config
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/environment.d/npm-prefix.conf"
      register: _ai_cli_npm_prefix_conf_raw


    - name: Assert npm prefix environment.d config points at ~/.local (not a ~/.npmrc prefix= line)
      ansible.builtin.assert:
        that: >-
          ('NPM_CONFIG_PREFIX=' + ansible_facts['env']['HOME'] + '/.local')
          in (_ai_cli_npm_prefix_conf_raw.content | b64decode)


    - name: Read Claude Code global config
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
      register: _ai_cli_claude_code_global_raw


    - name: Assert MCP servers were configured in ~/.claude.json
      vars:
        _ai_cli_claude_code_global: "{{ _ai_cli_claude_code_global_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - "'ansible' in _ai_cli_claude_code_global.mcpServers"
          - "'awslabs.aws-documentation' in _ai_cli_claude_code_global.mcpServers"
          - "'awslabs.core' in _ai_cli_claude_code_global.mcpServers"
          - "'terraform' in _ai_cli_claude_code_global.mcpServers"
          - "'github' in _ai_cli_claude_code_global.mcpServers"
          - "'renovate' in _ai_cli_claude_code_global.mcpServers"


    - name: Assert every role-managed MCP server is pinned to the version in defaults (no floating tag)
      vars:
        _ai_cli_claude_code_global: "{{ _ai_cli_claude_code_global_raw.content | b64decode | from_json }}"
        _ai_cli_mcp: "{{ _ai_cli_claude_code_global.mcpServers }}"
      ansible.builtin.assert:
        that:
          - "('@ansible/ansible-mcp-server@' ~ ai_cli_mcp_ansible_version) in _ai_cli_mcp['ansible'].args"
          - "('awslabs.aws-documentation-mcp-server@' ~ ai_cli_mcp_aws_documentation_version) in _ai_cli_mcp['awslabs.aws-documentation'].args"
          - "('awslabs.core-mcp-server@' ~ ai_cli_mcp_aws_core_version) in _ai_cli_mcp['awslabs.core'].args"
          - "('terraform-mcp-server@' ~ ai_cli_mcp_terraform_version) in _ai_cli_mcp['terraform'].args"
          - "_ai_cli_mcp['github'].command == ai_cli_mcp_github_bin"
          - "('renovate-mcp@' ~ ai_cli_mcp_renovate_version) in _ai_cli_mcp['renovate'].args"
          # Only role-managed servers: the seeded `aws-mcp` (prepare.yml) is
          # deliberately external, keeps its own `@latest`, and must survive.
          - >-
            _ai_cli_mcp | dict2items | rejectattr('key', 'equalto', 'aws-mcp')
            | map(attribute='value.args') | flatten | select('search', '@latest$') | list | length == 0


    - name: Check github-mcp-server runs and reports the pinned version
      ansible.builtin.command: "{{ ai_cli_mcp_github_bin }} --version"
      register: _ai_cli_mcp_github_version_out
      changed_when: false

    - name: Assert github-mcp-server version matches the pin
      ansible.builtin.assert:
        that: ai_cli_mcp_github_version in _ai_cli_mcp_github_version_out.stdout

    - name: Assert a manually-registered MCP server (seeded in prepare.yml) survived converge
      # Proves the role merges onto mcpServers instead of replacing it
      # wholesale — a server added outside this role (e.g. `claude mcp add`)
      # must not be silently wiped by a re-run.
      vars:
        _ai_cli_claude_code_global: "{{ _ai_cli_claude_code_global_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - "'aws-mcp' in _ai_cli_claude_code_global.mcpServers"
          - _ai_cli_claude_code_global.mcpServers['aws-mcp'].command == 'uvx'


    # kiro-cli

    # Verifies what can be checked in a headless container: the binary was

    # installed, the three default-behaviour settings were persisted with the

    # correct JSON types, and the zsh alias snippet was deployed with the

    # expected content. Autonomous mode itself (the --trust-all-tools runtime

    # flag) is exercised only at `kiro-cli chat` time, which needs an

    # authenticated session and a TTY, so it is verified indirectly through the

    # alias definition rather than by launching a chat.

    - name: Stat the kiro-cli binary
      ansible.builtin.stat:
        path: "{{ ai_cli_kiro_bin }}"
      register: _ai_cli_kiro_bin_stat


    - name: Assert kiro-cli was installed
      ansible.builtin.assert:
        that: _ai_cli_kiro_bin_stat.stat.exists
        fail_msg: "kiro-cli binary was not installed at {{ ai_cli_kiro_bin }}."


    - name: Read the persisted kiro-cli settings file
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.kiro/settings/cli.json"
      register: _ai_cli_kiro_settings_file


    - name: Parse the persisted kiro-cli settings
      ansible.builtin.set_fact:
        _ai_cli_kiro_settings: "{{ _ai_cli_kiro_settings_file.content | b64decode | from_json }}"


    - name: Assert kiro-cli default-behaviour settings were persisted with the correct types
      ansible.builtin.assert:
        that:
          - _ai_cli_kiro_settings['chat.agentEngine'] == ai_cli_kiro_agent_engine
          - _ai_cli_kiro_settings['toolSearch.enabled'] == ai_cli_kiro_tool_search_enabled
          - _ai_cli_kiro_settings['chat.disableTrustAllConfirmation'] == ai_cli_kiro_disable_trust_all_confirmation
        fail_msg: One or more kiro-cli settings were not persisted as expected.


    - name: Stat kiro-cli zsh alias snippet
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro.zsh"
      register: _ai_cli_kiro_zsh_snippet


    - name: Assert kiro-cli zsh alias snippet was deployed
      ansible.builtin.assert:
        that: _ai_cli_kiro_zsh_snippet.stat.exists


    - name: Read kiro-cli zsh alias snippet content
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro.zsh"
      register: _ai_cli_kiro_zsh_snippet_content


    - name: Assert kiro-cli alias snippet defines the autonomous chat and login aliases
      ansible.builtin.assert:
        that:
          - "\"alias \" + ai_cli_kiro_alias_chat + \"='kiro-cli chat --trust-all-tools'\" in (_ai_cli_kiro_zsh_snippet_content.content | b64decode)"
          - "\"alias \" + ai_cli_kiro_alias_login + \"='kiro-cli login'\" in (_ai_cli_kiro_zsh_snippet_content.content | b64decode)"


    - name: Stat the legacy kiro_cli.zsh snippet (seeded in prepare.yml)
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro_cli.zsh"
      register: _ai_cli_kiro_legacy_snippet


    - name: Assert the legacy kiro_cli.zsh orphan was removed on upgrade
      # Proves the cleanup task removes the snippet the removed standalone
      # kiro_cli role used to deploy, so it can't keep overriding kiro.zsh.
      ansible.builtin.assert:
        that: not _ai_cli_kiro_legacy_snippet.stat.exists
        fail_msg: "Legacy kiro_cli.zsh was not removed; it would override the merged role's kiro.zsh aliases."


    # opencode

    # Verifies what a headless container can check: the pinned binary was

    # installed from the checksum-verified tarball, the default-model config

    # was deployed, and the alias snippet was deployed with the expected

    # content. The Mistral backend and `opencode` login need an API key and an

    # authenticated session, so they are out of scope here, exactly as Claude

    # Code's and kiro-cli's own auth are.

    - name: Check opencode runs
      ansible.builtin.command: "{{ ai_cli_opencode_bin }} --version"
      register: _ai_cli_opencode_version
      changed_when: false


    - name: Assert opencode reports the pinned version
      ansible.builtin.assert:
        that: "ai_cli_opencode_version in _ai_cli_opencode_version.stdout"


    - name: Stat opencode config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
      register: _ai_cli_opencode_config


    - name: Assert opencode config was deployed
      ansible.builtin.assert:
        that: _ai_cli_opencode_config.stat.exists


    - name: Read opencode config
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
      register: _ai_cli_opencode_config_raw


    - name: Assert opencode config pins the default Mistral model
      ansible.builtin.assert:
        that: >-
          (_ai_cli_opencode_config_raw.content | b64decode | from_json).model
          == ai_cli_opencode_model


    - name: Assert the seeded stale model differs from the role default (test precondition)
      # prepare.yml seeds model=mistral/codestral-2508. If the role default ever
      # becomes that same value, the converge test silently becomes a no-op —
      # assert they differ so the "model was converged" check below is
      # meaningful. Avoids hardcoding the default string here (verify.yml sources
      # ai_cli_opencode_model from defaults via vars_files on purpose).
      ansible.builtin.assert:
        that: ai_cli_opencode_model != "mistral/codestral-2508"
        fail_msg: >-
          prepare.yml's seeded model equals the role default; the converge
          test would be a no-op.


    - name: Assert the seeded stale model was converged to the role default
      # prepare.yml seeded a different model; this asserts converge rewrote it
      # to ai_cli_opencode_model, proving a changed model is picked up on
      # a re-apply rather than silently ignored.
      ansible.builtin.assert:
        that: >-
          (_ai_cli_opencode_config_raw.content | b64decode | from_json).model
          == ai_cli_opencode_model
        fail_msg: The seeded stale model was not rewritten to the role default.


    - name: Assert a user-added key (seeded in prepare.yml) survived the model converge
      # prepare.yml seeded a "theme" key alongside the stale model. Proves the
      # deploy merges onto the existing file instead of overwriting it, so keys
      # the role does not own are preserved.
      ansible.builtin.assert:
        that: >-
          (_ai_cli_opencode_config_raw.content | b64decode | from_json).theme
          | default('') == "catppuccin"
        fail_msg: The user-added opencode.json key was wiped by the model converge.


    - name: Stat opencode zsh alias snippet
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/opencode.zsh"
      register: _ai_cli_opencode_zsh_snippet


    - name: Assert opencode zsh alias snippet was deployed
      ansible.builtin.assert:
        that: _ai_cli_opencode_zsh_snippet.stat.exists


    - name: Read opencode zsh alias snippet content
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/opencode.zsh"
      register: _ai_cli_opencode_zsh_snippet_content


    - name: Assert opencode alias snippet defines the TUI and headless-run aliases
      ansible.builtin.assert:
        that:
          - "\"alias \" + ai_cli_opencode_alias_tui + \"='opencode'\" in (_ai_cli_opencode_zsh_snippet_content.content | b64decode)"
          - "\"alias \" + ai_cli_opencode_alias_run + \"='opencode run'\" in (_ai_cli_opencode_zsh_snippet_content.content | b64decode)"
