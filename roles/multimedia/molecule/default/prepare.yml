---
- name: Prepare
  hosts: all
  gather_facts: false

  vars:
    prepare_http_proxy: "{{ lookup('env', 'http_proxy') or lookup('env', 'HTTP_PROXY') }}"

  tasks:
    - name: Bootstrap Python, pip, and sudo
      ansible.builtin.raw: >-
        export http_proxy="{{ prepare_http_proxy }}" https_proxy="{{ prepare_http_proxy }}";
        apt-get update && apt-get install -y python3 python3-pip python3-venv sudo
      changed_when: true

    - name: Check for a local CA trust bundle on the controller
      ansible.builtin.stat:
        path: /etc/ssl/certs/ca-certificates.crt
      delegate_to: localhost
      become: false
      register: multimedia_prepare_local_ca_bundle

    # Behind a TLS-inspecting corporate proxy, the controller trusts the proxy's CA
    # (installed by IT) but this fresh container doesn't. Syncing the controller's
    # bundle in is a no-op on unproxied CI (where the bundle is just the standard set
    # the container would trust anyway).
    - name: Sync the controller's CA trust bundle into the container
      ansible.builtin.copy:
        src: /etc/ssl/certs/ca-certificates.crt
        dest: /etc/ssl/certs/ca-certificates.crt
        mode: "0644"
      when: multimedia_prepare_local_ca_bundle.stat.exists

    # beets assumes pipx is already installed, matching computer-setup's own site.yml
    # pre_tasks (a playbook-level, not role-level, concern shared across every
    # pipx-based role). community.general.pipx needs pipx >= 1.7.0; Ubuntu Noble's
    # apt package is 1.4.3, so install via pip like computer-setup does. Installed
    # system-wide (no --user) since this container only ever runs as root — puts the
    # pipx binary itself in /usr/local/bin, already on the default PATH.
    - name: Install pipx >= 1.7.0 via pip3
      ansible.builtin.pip:
        name: "pipx==1.7.1"
        extra_args: "--break-system-packages"
        executable: pip3
      environment:
        http_proxy: "{{ prepare_http_proxy }}"
        https_proxy: "{{ prepare_http_proxy }}"
