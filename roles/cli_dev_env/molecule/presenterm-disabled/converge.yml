---
- name: Converge
  hosts: all
  gather_facts: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
    HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
    HTTPS_PROXY: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
  roles:
    - role: pmuellerch.workstation.cli_dev_env
      vars:
        cli_dev_env_neovim_presenterm_plugin_enabled: false
        # This scenario exists only to test the presenterm.nvim toggle. Kiro is
        # out of scope here and its installer needs curl/unzip that this
        # scenario's prepare.yml does not provide, so disable it rather than
        # pull in installer prerequisites unrelated to what this scenario tests.
        cli_dev_env_kiro_enabled: false
