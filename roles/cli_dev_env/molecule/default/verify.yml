---
- name: Verify
  hosts: all
  gather_facts: true
  # Load the role's own defaults so pinned-version assertions below track
  # cli_dev_env_claude_code_version as their single source of truth, rather
  # than a second hardcoded literal that would silently go stale whenever
  # Renovate bumps defaults/main.yml.
  vars_files:
    - ../../defaults/main.yml
  vars:
    # Claude Code is installed into the user's own npm prefix (~/.local),
    # not a system-wide location on PATH by default for non-interactive
    # exec — same convention as code_quality_tools' pipx-installed tools.
    _cli_dev_env_claude_code_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  tasks:
    # lazygit
    - name: Check lazygit runs
      ansible.builtin.command: lazygit --version
      register: _cli_dev_env_lazygit_version
      changed_when: false

    - name: Assert lazygit reports the pinned version
      ansible.builtin.assert:
        that: "cli_dev_env_lazygit_version in _cli_dev_env_lazygit_version.stdout"

    - name: Stat lazygit config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/lazygit/config.yml"
      register: _cli_dev_env_lazygit_config

    - name: Assert lazygit config was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_lazygit_config.stat.exists

    # neovim
    - name: Check neovim runs
      ansible.builtin.command: nvim --version
      register: _cli_dev_env_neovim_version
      changed_when: false

    - name: Assert neovim reports the pinned version
      ansible.builtin.assert:
        that: "'NVIM v' + cli_dev_env_neovim_version in _cli_dev_env_neovim_version.stdout"

    - name: Stat neovim symlink
      ansible.builtin.stat:
        path: /usr/local/bin/nvim
      register: _cli_dev_env_neovim_symlink

    - name: Assert neovim symlink exists and is a symlink
      ansible.builtin.assert:
        that:
          - _cli_dev_env_neovim_symlink.stat.exists
          - _cli_dev_env_neovim_symlink.stat.islnk

    - name: Stat LazyVim init.lua
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/init.lua"
      register: _cli_dev_env_lazyvim_init

    - name: Assert LazyVim starter was cloned
      ansible.builtin.assert:
        that: _cli_dev_env_lazyvim_init.stat.exists

    - name: Stat LazyVim starter .git directory
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/.git"
      register: _cli_dev_env_lazyvim_git

    - name: Assert LazyVim starter .git directory was removed
      ansible.builtin.assert:
        that: not _cli_dev_env_lazyvim_git.stat.exists

    - name: Stat lazyvim.json extras config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazyvim.json"
      register: _cli_dev_env_lazyvim_json

    - name: Assert lazyvim.json was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_lazyvim_json.stat.exists

    - name: Stat catppuccin colorscheme plugin config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/colorscheme.lua"
      register: _cli_dev_env_colorscheme

    - name: Assert colorscheme plugin config was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_colorscheme.stat.exists

    - name: Stat vim-tmux-navigator plugin config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/tmux-navigator.lua"
      register: _cli_dev_env_tmux_navigator

    - name: Assert tmux-navigator plugin config was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_tmux_navigator.stat.exists

    - name: Stat keymaps config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/config/keymaps.lua"
      register: _cli_dev_env_keymaps

    - name: Assert keymaps config was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_keymaps.stat.exists

    - name: Stat neovim zsh snippet
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/neovim.zsh"
      register: _cli_dev_env_zsh_snippet

    - name: Assert neovim zsh snippet was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_zsh_snippet.stat.exists

    # presenterm.nvim plugin config (toggle default-enabled in this scenario)
    - name: Stat presenterm.nvim plugin config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/presenterm.lua"
      register: _cli_dev_env_presenterm_plugin

    - name: Assert presenterm.nvim plugin config was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_presenterm_plugin.stat.exists

    - name: Stat lazy-lock.json
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazy-lock.json"
      register: _cli_dev_env_lazylock

    - name: Assert the headless lazy.nvim sync ran and produced a lock file
      ansible.builtin.assert:
        that: _cli_dev_env_lazylock.stat.exists

    - name: Stat plugin install directories synced by lazy.nvim
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/nvim/lazy/{{ item }}"
      register: _cli_dev_env_lazy_plugin_dirs
      loop:
        - vim-tmux-navigator
        - presenterm.nvim
      loop_control:
        label: "{{ item }}"

    - name: Assert declared plugins were actually installed by the headless sync
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isdir
      loop: "{{ _cli_dev_env_lazy_plugin_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    # claude-code
    - name: Check Node.js version
      ansible.builtin.command: node --version
      register: _cli_dev_env_claude_code_node_version
      changed_when: false

    - name: Assert Node.js major version matches the configured NodeSource LTS
      ansible.builtin.assert:
        that: "_cli_dev_env_claude_code_node_version.stdout.startswith('v24.')"

    - name: Check Claude Code CLI runs
      ansible.builtin.command: "{{ _cli_dev_env_claude_code_bin }} --version"
      register: _cli_dev_env_claude_code_version
      changed_when: false

    - name: Assert Claude Code CLI reports the pinned version
      ansible.builtin.assert:
        that: "cli_dev_env_claude_code_version in _cli_dev_env_claude_code_version.stdout"

    - name: Read npm prefix environment.d config
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/environment.d/npm-prefix.conf"
      register: _cli_dev_env_npm_prefix_conf_raw

    - name: Assert npm prefix environment.d config points at ~/.local (not a ~/.npmrc prefix= line)
      ansible.builtin.assert:
        that: >-
          ('NPM_CONFIG_PREFIX=' + ansible_facts['env']['HOME'] + '/.local')
          in (_cli_dev_env_npm_prefix_conf_raw.content | b64decode)

    - name: Read Claude Code global config
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
      register: _cli_dev_env_claude_code_global_raw

    - name: Assert MCP servers were configured in ~/.claude.json
      vars:
        _cli_dev_env_claude_code_global: "{{ _cli_dev_env_claude_code_global_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - "'ansible' in _cli_dev_env_claude_code_global.mcpServers"
          - "'awslabs.aws-documentation' in _cli_dev_env_claude_code_global.mcpServers"
          - "'awslabs.core' in _cli_dev_env_claude_code_global.mcpServers"
          - "'terraform' in _cli_dev_env_claude_code_global.mcpServers"
          - "'github' in _cli_dev_env_claude_code_global.mcpServers"
          - "'renovate' in _cli_dev_env_claude_code_global.mcpServers"

    - name: Assert a manually-registered MCP server (seeded in prepare.yml) survived converge
      # Proves the role merges onto mcpServers instead of replacing it
      # wholesale — a server added outside this role (e.g. `claude mcp add`)
      # must not be silently wiped by a re-run.
      vars:
        _cli_dev_env_claude_code_global: "{{ _cli_dev_env_claude_code_global_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - "'aws-mcp' in _cli_dev_env_claude_code_global.mcpServers"
          - _cli_dev_env_claude_code_global.mcpServers['aws-mcp'].command == 'uvx'

    # kiro-cli
    # Verifies what can be checked in a headless container: the binary was
    # installed, the three default-behaviour settings were persisted with the
    # correct JSON types, and the zsh alias snippet was deployed with the
    # expected content. Autonomous mode itself (the --trust-all-tools runtime
    # flag) is exercised only at `kiro-cli chat` time, which needs an
    # authenticated session and a TTY, so it is verified indirectly through the
    # alias definition rather than by launching a chat.
    - name: Stat the kiro-cli binary
      ansible.builtin.stat:
        path: "{{ cli_dev_env_kiro_bin }}"
      register: _cli_dev_env_kiro_bin_stat

    - name: Assert kiro-cli was installed
      ansible.builtin.assert:
        that: _cli_dev_env_kiro_bin_stat.stat.exists
        fail_msg: "kiro-cli binary was not installed at {{ cli_dev_env_kiro_bin }}."

    - name: Read the persisted kiro-cli settings file
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.kiro/settings/cli.json"
      register: _cli_dev_env_kiro_settings_file

    - name: Parse the persisted kiro-cli settings
      ansible.builtin.set_fact:
        _cli_dev_env_kiro_settings: "{{ _cli_dev_env_kiro_settings_file.content | b64decode | from_json }}"

    - name: Assert kiro-cli default-behaviour settings were persisted with the correct types
      ansible.builtin.assert:
        that:
          - _cli_dev_env_kiro_settings['chat.agentEngine'] == cli_dev_env_kiro_agent_engine
          - _cli_dev_env_kiro_settings['toolSearch.enabled'] == cli_dev_env_kiro_tool_search_enabled
          - _cli_dev_env_kiro_settings['chat.disableTrustAllConfirmation'] == cli_dev_env_kiro_disable_trust_all_confirmation
        fail_msg: One or more kiro-cli settings were not persisted as expected.

    - name: Stat kiro-cli zsh alias snippet
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro.zsh"
      register: _cli_dev_env_kiro_zsh_snippet

    - name: Assert kiro-cli zsh alias snippet was deployed
      ansible.builtin.assert:
        that: _cli_dev_env_kiro_zsh_snippet.stat.exists

    - name: Read kiro-cli zsh alias snippet content
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro.zsh"
      register: _cli_dev_env_kiro_zsh_snippet_content

    - name: Assert kiro-cli alias snippet defines the autonomous chat and login aliases
      ansible.builtin.assert:
        that:
          - "\"alias \" + cli_dev_env_kiro_alias_chat + \"='kiro-cli chat --trust-all-tools'\" in (_cli_dev_env_kiro_zsh_snippet_content.content | b64decode)"
          - "\"alias \" + cli_dev_env_kiro_alias_login + \"='kiro-cli login'\" in (_cli_dev_env_kiro_zsh_snippet_content.content | b64decode)"

    - name: Stat the legacy kiro_cli.zsh snippet (seeded in prepare.yml)
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro_cli.zsh"
      register: _cli_dev_env_kiro_legacy_snippet

    - name: Assert the legacy kiro_cli.zsh orphan was removed on upgrade
      # Proves the cleanup task removes the snippet the removed standalone
      # kiro_cli role used to deploy, so it can't keep overriding kiro.zsh.
      ansible.builtin.assert:
        that: not _cli_dev_env_kiro_legacy_snippet.stat.exists
        fail_msg: "Legacy kiro_cli.zsh was not removed; it would override the merged role's kiro.zsh aliases."
