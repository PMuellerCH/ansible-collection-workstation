---
# ---- lazygit ----
- name: Create lazygit config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/lazygit"
    state: directory
    mode: "0755"
  become: false
  when: cli_dev_env_lazygit_enabled
  tags: [lazygit, cli_dev_env]

- name: Deploy lazygit config with Catppuccin Mocha theme
  ansible.builtin.copy:
    src: config.yml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/lazygit/config.yml"
    mode: "0644"
    force: false
  become: false
  when: cli_dev_env_lazygit_enabled
  tags: [lazygit, cli_dev_env]

- name: Get installed lazygit version
  ansible.builtin.command: lazygit --version
  register: cli_dev_env_lazygit_current_version
  changed_when: false
  failed_when: false
  when: cli_dev_env_lazygit_enabled
  tags: [lazygit, cli_dev_env]

- name: Download lazygit archive
  ansible.builtin.get_url:
    url: "{{ cli_dev_env_lazygit_download_base }}/lazygit_{{ cli_dev_env_lazygit_version }}_linux_x86_64.tar.gz"
    dest: "/tmp/lazygit_{{ cli_dev_env_lazygit_version }}_linux_x86_64.tar.gz"
    # jesseduffield/lazygit publishes an aggregate checksums.txt per release —
    # get_url fetches it and matches the entry by the destination's basename,
    # so there's no static checksum to keep in sync by hand when Renovate
    # bumps cli_dev_env_lazygit_version.
    checksum: "sha256:{{ cli_dev_env_lazygit_download_base }}/checksums.txt"
    mode: "0644"
  when: >-
    cli_dev_env_lazygit_enabled and
    (cli_dev_env_lazygit_current_version.rc != 0 or
     cli_dev_env_lazygit_version not in cli_dev_env_lazygit_current_version.stdout)
  tags: [lazygit, cli_dev_env]

- name: Install lazygit binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/lazygit_{{ cli_dev_env_lazygit_version }}_linux_x86_64.tar.gz"
    dest: /usr/local/bin/
    include:
      - lazygit
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_lazygit_enabled and
    (cli_dev_env_lazygit_current_version.rc != 0 or
     cli_dev_env_lazygit_version not in cli_dev_env_lazygit_current_version.stdout)
  tags: [lazygit, cli_dev_env]

# ---- neovim ----
- name: Get installed neovim version
  ansible.builtin.command: nvim --version
  register: cli_dev_env_neovim_current_version
  changed_when: false
  failed_when: false
  when: cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Download neovim archive
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/v{{ cli_dev_env_neovim_version }}/nvim-linux-x86_64.tar.gz"
    dest: "/tmp/nvim-linux-x86_64-{{ cli_dev_env_neovim_version }}.tar.gz"
    checksum: "{{ cli_dev_env_neovim_checksum }}"
    mode: "0644"
  when: >-
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Extract neovim to /opt
  ansible.builtin.unarchive:
    src: "/tmp/nvim-linux-x86_64-{{ cli_dev_env_neovim_version }}.tar.gz"
    dest: /opt/
    remote_src: true
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Create neovim symlink
  ansible.builtin.file:
    src: /opt/nvim-linux-x86_64/bin/nvim
    dest: /usr/local/bin/nvim
    state: link
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Check if LazyVim config is already present
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/init.lua"
  register: cli_dev_env_neovim_lazyvim_stat
  become: false
  when: cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Clone LazyVim starter
  # LazyVim/starter has no release tags — it is a template meant to be
  # cloned once and immediately customized/committed by the user, not a
  # versioned artifact tracked for updates, so cloning the default branch is
  # deliberate here (unlike get_url downloads elsewhere in this collection,
  # which always pin to an immutable ref). This only ever runs once per
  # machine, guarded by the init.lua stat check above.
  ansible.builtin.git:
    repo: https://github.com/LazyVim/starter.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
    version: main
    update: false
  become: false
  when: >-
    cli_dev_env_neovim_enabled and
    not cli_dev_env_neovim_lazyvim_stat.stat.exists
  tags: [neovim, cli_dev_env]

- name: Remove LazyVim starter .git directory (fresh config)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/.git"
    state: absent
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    not cli_dev_env_neovim_lazyvim_stat.stat.exists
  tags: [neovim, cli_dev_env]

- name: Ensure plugins directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy lazyvim.json extras config
  ansible.builtin.copy:
    src: lazyvim.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazyvim.json"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy catppuccin colorscheme plugin config
  ansible.builtin.copy:
    src: plugins/colorscheme.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/colorscheme.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy vim-tmux-navigator plugin config
  ansible.builtin.copy:
    src: plugins/tmux-navigator.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/tmux-navigator.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Ensure nvim config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/config"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy keymaps config (jk escape, buffer navigation)
  ansible.builtin.copy:
    src: config/keymaps.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/config/keymaps.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy neovim shell integration snippet
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/neovim.zsh"
    mode: "0644"
    content: |
      # Preferred editor
      export EDITOR='nvim'
      export VISUAL='nvim'
      alias vi='nvim'
      alias vim='nvim'
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

# ---- presenterm (neovim plugin config only — the presenterm binary,
# mermaid-cli and zsh snippet live in the modern_cli role instead) ----
- name: Ensure nvim plugins directory exists (presenterm.nvim)
  # Deliberately kept self-contained (duplicates the neovim "Ensure plugins
  # directory exists" task above) so `--tags presenterm` alone is
  # self-sufficient and does not implicitly depend on the neovim tag having
  # also run in the same invocation — same redundancy the source
  # computer-setup roles already had, for the same reason.
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    cli_dev_env_neovim_presenterm_plugin_enabled
  tags: [presenterm, cli_dev_env]

- name: Deploy presenterm.nvim plugin config
  # Gated on cli_dev_env_neovim_presenterm_plugin_enabled: the presenterm
  # binary this plugin needs now lives in a different, independently
  # installable role (modern_cli). See README for why this toggle exists and
  # how it must be kept in sync with modern_cli_presenterm_enabled.
  ansible.builtin.copy:
    src: plugins/presenterm.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/presenterm.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    cli_dev_env_neovim_presenterm_plugin_enabled
  tags: [presenterm, cli_dev_env]

# ---- claude-code (Claude Code CLI via npm, Node.js sourced from
# NodeSource — this role's own Node.js install, independent of modern_cli's
# mermaid-cli one; see README "Node.js management" for why the two don't
# share logic in this PR) ----
- name: Install prerequisites for NodeSource apt setup
  # python3-debian is required by the ansible.builtin.deb822_repository
  # module used below (it is not present by default on a minimal Ubuntu
  # image) — added to this same prerequisites task rather than a separate
  # one, alongside the other NodeSource-setup prerequisites.
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Remove legacy NodeSource apt sources list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Add NodeSource apt repository for Node.js LTS {{ cli_dev_env_claude_code_nodejs_major_version }}
  # python3-debian is only installed for real on a real (non-check) run —
  # see the task above. Under --check it would still be missing at this
  # point (a normal apt task never installs anything for real in check
  # mode), and deb822_repository hard-fails under check mode if the library
  # isn't importable — so this task (and everything that depends on the
  # repo it adds) is skipped in check mode too, matching this collection's
  # general pattern for resources that would only exist after a real run.
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ cli_dev_env_claude_code_nodejs_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: /etc/apt/keyrings/nodesource.asc
    state: present
  become: true
  when: cli_dev_env_claude_code_enabled and not ansible_check_mode
  tags: [claude-code, cli_dev_env]

- name: Check installed Node.js major version
  ansible.builtin.command: node --version
  register: cli_dev_env_claude_code_node_installed_version
  changed_when: false
  failed_when: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Remove Node.js if installed major version does not match configured LTS
  ansible.builtin.apt:
    name: nodejs
    state: absent
  become: true
  when: >-
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_node_installed_version.rc == 0 and
    not cli_dev_env_claude_code_node_installed_version.stdout.startswith('v' + cli_dev_env_claude_code_nodejs_major_version | string + '.')
  tags: [claude-code, cli_dev_env]

- name: Install Node.js and build tools
  ansible.builtin.apt:
    name:
      - "nodejs={{ cli_dev_env_claude_code_nodejs_version }}"
      - "build-essential={{ cli_dev_env_claude_code_build_essential_version }}"
    state: present
    update_cache: true
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Hold nodejs and build-essential package versions
  # Same pattern as every other version-pinned apt package in this
  # collection (e.g. modern_cli's nodejs/npm, iac_tools' docker-ce,
  # code_quality_tools' trivy): without a hold, a plain `apt upgrade` on the
  # host could silently drift these past the pinned version. Guarded by
  # not ansible_check_mode for the same reason as code_quality_tools' trivy
  # hold task — dpkg_selections hard-fails if the package isn't actually
  # present in dpkg's database yet, which is the case under --check since
  # the install task above is itself skipped in check mode.
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - nodejs
    - build-essential
  become: true
  when: cli_dev_env_claude_code_enabled and not ansible_check_mode
  tags: [claude-code, cli_dev_env]

- name: Check for legacy root-owned global Claude Code install
  ansible.builtin.stat:
    path: /usr/lib/node_modules/@anthropic-ai/claude-code
  register: cli_dev_env_claude_code_legacy_global_stat
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Remove legacy root-owned global Claude Code install
  # Older versions of this role installed Claude Code as a root-owned global
  # npm package (become: true, default npm prefix on a NodeSource install is
  # /usr). This role now installs it under the invoking user's own npm
  # prefix instead (see the ~/.npmrc task below), so a fresh `claude` on
  # PATH no longer needs root to self-update — but a machine that already
  # ran the old version has a stale root-owned copy left on disk. It no
  # longer wins on PATH (the user prefix's bin dir is prepended ahead of
  # /usr/bin by terminal_env's .zshrc), but remove it so there isn't a
  # second, never-updated copy sitting around.
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: absent
  become: true
  when: >-
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_legacy_global_stat.stat.exists and
    not ansible_check_mode
  tags: [claude-code, cli_dev_env]

- name: Ensure npm global installs go to the user's own prefix
  # Without this, the global install below would need become: true (npm's
  # default global prefix is root-owned on a NodeSource install, e.g.
  # /usr/lib/node_modules) — install Claude Code as the invoking user
  # instead, so it doesn't need root and can self-update without root
  # either. lineinfile (not copy) so any other settings a user has in their
  # own ~/.npmrc (e.g. registry auth) are preserved. mode 0600 (not the repo
  # default 0644) since ~/.npmrc can hold credentials — same mode the base
  # role already uses for its own ~/.npmrc proxy-config task, and a
  # narrower mode: here would otherwise relax an existing 0600 file's
  # permissions on every run.
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.npmrc"
    regexp: "^prefix="
    line: "prefix={{ ansible_facts['env']['HOME'] }}/.local"
    create: true
    mode: "0600"
  become: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Install Claude Code CLI globally via npm
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    version: "{{ cli_dev_env_claude_code_version }}"
    global: true
    state: present
  become: false
  when: cli_dev_env_claude_code_enabled and not ansible_check_mode
  tags: [claude-code, cli_dev_env]

- name: Stat ~/.claude/settings.json
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: cli_dev_env_claude_code_settings_stat
  become: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Read ~/.claude/settings.json
  # A remote read (slurp), not lookup('file', ...): lookup() runs on the
  # controller, not the target host, so it silently reads (or misses) the
  # wrong machine's file whenever controller != target (e.g. over SSH) —
  # this collection cannot assume connection: local, unlike computer-setup.
  # Gated on the stat above rather than unconditionally, since slurp
  # hard-fails on a missing file — true here on a fresh install before
  # ~/.claude/ has been created by the CLI itself.
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: cli_dev_env_claude_code_settings_raw
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_settings_stat.stat.exists
  tags: [claude-code, cli_dev_env]

- name: Remove mcpServers from ~/.claude/settings.json if present (belongs in ~/.claude.json)
  vars:
    # The "if stat.exists else {}" ternary short-circuits (Jinja evaluates
    # only the taken branch), so the undefined/skipped slurp result is never
    # touched when the file doesn't exist.
    _cli_dev_env_claude_code_settings_current: >-
      {{ (cli_dev_env_claude_code_settings_raw.content | b64decode | from_json)
         if cli_dev_env_claude_code_settings_stat.stat.exists else {} }}
  ansible.builtin.copy:
    content: "{{ _cli_dev_env_claude_code_settings_current | dict2items | selectattr('key', '!=', 'mcpServers') | items2dict | to_nice_json }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
    mode: "0600"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    (_cli_dev_env_claude_code_settings_current.mcpServers | default(none)) is not none
  tags: [claude-code, cli_dev_env]

- name: Stat ~/.claude.json
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
  register: cli_dev_env_claude_code_global_stat
  become: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Read current Claude Code global config
  # Not ansible.builtin.slurp unconditionally, and not lookup('file', ...)
  # — same two reasons as ~/.claude/settings.json above: lookup() reads the
  # controller's filesystem, not the target's, and ~/.claude.json does not
  # exist yet on a fresh install (created by the CLI on first run/login,
  # not by the npm install above).
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
  register: cli_dev_env_claude_code_global_raw
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_global_stat.stat.exists
  tags: [claude-code, cli_dev_env]

- name: Configure MCP servers in Claude Code global config
  vars:
    _cli_dev_env_claude_code_current_global: >-
      {{ (cli_dev_env_claude_code_global_raw.content | b64decode | from_json)
         if cli_dev_env_claude_code_global_stat.stat.exists else {} }}
    _cli_dev_env_claude_code_desired_mcp_servers:
      ansible:
        type: stdio
        command: npx
        args: ["-y", "@ansible/ansible-mcp-server", "--stdio"]
        env: {}
      awslabs.aws-documentation:
        type: stdio
        command: uvx
        args: ["awslabs.aws-documentation-mcp-server@latest"]
        env:
          FASTMCP_LOG_LEVEL: ERROR
          UV_SYSTEM_CERTS: "true"
      awslabs.core:
        type: stdio
        command: uvx
        args: ["awslabs.core-mcp-server@latest"]
        env:
          AWS_PROFILE: "{{ cli_dev_env_claude_code_aws_profile }}"
          AWS_REGION: "{{ cli_dev_env_claude_code_aws_region }}"
          FASTMCP_LOG_LEVEL: ERROR
          UV_SYSTEM_CERTS: "true"
      terraform:
        type: stdio
        command: npx
        args: ["-y", "terraform-mcp-server"]
        env: {}
      github:
        type: stdio
        command: npx
        args: ["-y", "@modelcontextprotocol/server-github"]
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: "{{ cli_dev_env_claude_code_github_token }}"
      renovate:
        type: stdio
        command: npx
        args: ["-y", "renovate-mcp"]
        env: {}
    # Merge onto (not replace) any existing mcpServers entries — a server
    # registered outside this role (e.g. via `claude mcp add`, or `aws
    # configure agent-toolkit`'s `aws-mcp`) survives a re-run instead of
    # being silently wiped. Role-managed keys above still win on conflict
    # (combine() defaults to the second/right-hand dict), so this role
    # remains authoritative for its own servers' config.
    _cli_dev_env_claude_code_merged_mcp_servers: >-
      {{ (_cli_dev_env_claude_code_current_global.mcpServers | default({}))
         | combine(_cli_dev_env_claude_code_desired_mcp_servers) }}
  ansible.builtin.copy:
    content: "{{ _cli_dev_env_claude_code_current_global | combine({'mcpServers': _cli_dev_env_claude_code_merged_mcp_servers}) | to_nice_json }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
    mode: "0600"
  become: false
  # The rendered content embeds cli_dev_env_claude_code_github_token — keep
  # it out of -v/-vvv output the same way iac_tools' vault github_token
  # credential file write does.
  no_log: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    (_cli_dev_env_claude_code_current_global.mcpServers | default({})) != _cli_dev_env_claude_code_merged_mcp_servers
  tags: [claude-code, cli_dev_env]
