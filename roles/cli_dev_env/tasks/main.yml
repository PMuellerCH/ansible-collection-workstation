---
# ---- lazygit ----
- name: Create lazygit config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/lazygit"
    state: directory
    mode: "0755"
  become: false
  when: cli_dev_env_lazygit_enabled
  tags: [lazygit, cli_dev_env]

- name: Deploy lazygit config with Catppuccin Mocha theme
  ansible.builtin.copy:
    src: config.yml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/lazygit/config.yml"
    mode: "0644"
    force: false
  become: false
  when: cli_dev_env_lazygit_enabled
  tags: [lazygit, cli_dev_env]

- name: Get installed lazygit version
  ansible.builtin.command: lazygit --version
  register: cli_dev_env_lazygit_current_version
  changed_when: false
  failed_when: false
  when: cli_dev_env_lazygit_enabled
  tags: [lazygit, cli_dev_env]

- name: Download lazygit archive
  ansible.builtin.get_url:
    url: "{{ cli_dev_env_lazygit_download_base }}/lazygit_{{ cli_dev_env_lazygit_version }}_linux_x86_64.tar.gz"
    dest: "/tmp/lazygit_{{ cli_dev_env_lazygit_version }}_linux_x86_64.tar.gz"
    # jesseduffield/lazygit publishes an aggregate checksums.txt per release —
    # get_url fetches it and matches the entry by the destination's basename,
    # so there's no static checksum to keep in sync by hand when Renovate
    # bumps cli_dev_env_lazygit_version.
    checksum: "sha256:{{ cli_dev_env_lazygit_download_base }}/checksums.txt"
    mode: "0644"
  when: >-
    cli_dev_env_lazygit_enabled and
    (cli_dev_env_lazygit_current_version.rc != 0 or
     cli_dev_env_lazygit_version not in cli_dev_env_lazygit_current_version.stdout)
  tags: [lazygit, cli_dev_env]

- name: Install lazygit binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/lazygit_{{ cli_dev_env_lazygit_version }}_linux_x86_64.tar.gz"
    dest: /usr/local/bin/
    include:
      - lazygit
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_lazygit_enabled and
    (cli_dev_env_lazygit_current_version.rc != 0 or
     cli_dev_env_lazygit_version not in cli_dev_env_lazygit_current_version.stdout)
  tags: [lazygit, cli_dev_env]

# ---- neovim ----
# neovim publishes no checksum file for its release assets, so the checksum is
# derived at run time from GitHub's own per-asset digest for the pinned version
# (see the digest-checksum note in README). Nothing to keep in sync by hand when
# Renovate bumps cli_dev_env_neovim_version.
- name: Get installed neovim version
  ansible.builtin.command: nvim --version
  register: cli_dev_env_neovim_current_version
  changed_when: false
  failed_when: false
  when: cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Fetch neovim release metadata for the GitHub asset digest
  ansible.builtin.get_url:
    url: "https://api.github.com/repos/neovim/neovim/releases/tags/v{{ cli_dev_env_neovim_version }}"
    dest: "/tmp/nvim-linux-x86_64-{{ cli_dev_env_neovim_version }}_release.json"
    force: true
    headers: >-
      {{ {'Accept': 'application/vnd.github+json'}
         | combine({'Authorization': 'Bearer ' + cli_dev_env_github_api_token}
                   if cli_dev_env_github_api_token else {}) }}
    mode: "0644"
  # Suppress output only when a token is in use, so the Bearer header cannot
  # leak into invocation.module_args under -v or on failure. Unauthenticated
  # runs keep full logging.
  no_log: "{{ cli_dev_env_github_api_token | length > 0 }}"
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Read neovim release metadata
  ansible.builtin.slurp:
    path: "/tmp/nvim-linux-x86_64-{{ cli_dev_env_neovim_version }}_release.json"
  register: cli_dev_env_neovim_release_raw
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Resolve neovim archive checksum from the release metadata
  ansible.builtin.set_fact:
    cli_dev_env_neovim_checksum: >-
      {{ (cli_dev_env_neovim_release_raw.content | b64decode | from_json).assets
         | selectattr('name', 'equalto', 'nvim-linux-x86_64.tar.gz')
         | map(attribute='digest') | select('string') | first | default('') }}
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Assert GitHub published a sha256 digest for the neovim archive
  ansible.builtin.assert:
    that: cli_dev_env_neovim_checksum.startswith('sha256:')
    fail_msg: >-
      GitHub published no sha256 digest for nvim-linux-x86_64.tar.gz
      ({{ cli_dev_env_neovim_version }}); cannot verify the download.
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Download neovim archive
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/v{{ cli_dev_env_neovim_version }}/nvim-linux-x86_64.tar.gz"
    dest: "/tmp/nvim-linux-x86_64-{{ cli_dev_env_neovim_version }}.tar.gz"
    checksum: "{{ cli_dev_env_neovim_checksum }}"
    mode: "0644"
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Extract neovim to /opt
  ansible.builtin.unarchive:
    src: "/tmp/nvim-linux-x86_64-{{ cli_dev_env_neovim_version }}.tar.gz"
    dest: /opt/
    remote_src: true
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Create neovim symlink
  ansible.builtin.file:
    src: /opt/nvim-linux-x86_64/bin/nvim
    dest: /usr/local/bin/nvim
    state: link
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (cli_dev_env_neovim_current_version.rc != 0 or
     cli_dev_env_neovim_version not in cli_dev_env_neovim_current_version.stdout)
  tags: [neovim, cli_dev_env]

- name: Check if LazyVim config is already present
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/init.lua"
  register: cli_dev_env_neovim_lazyvim_stat
  become: false
  when: cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Clone LazyVim starter
  # LazyVim/starter has no release tags — it is a template meant to be
  # cloned once and immediately customized/committed by the user, not a
  # versioned artifact tracked for updates, so cloning the default branch is
  # deliberate here (unlike get_url downloads elsewhere in this collection,
  # which always pin to an immutable ref). This only ever runs once per
  # machine, guarded by the init.lua stat check above.
  ansible.builtin.git:
    repo: https://github.com/LazyVim/starter.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
    version: main
    update: false
  become: false
  when: >-
    cli_dev_env_neovim_enabled and
    not cli_dev_env_neovim_lazyvim_stat.stat.exists
  tags: [neovim, cli_dev_env]

- name: Remove LazyVim starter .git directory (fresh config)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/.git"
    state: absent
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    not cli_dev_env_neovim_lazyvim_stat.stat.exists
  tags: [neovim, cli_dev_env]

- name: Ensure plugins directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Check currently-deployed lazyvim.json extras
  # LazyVim rewrites this file at runtime — expands each short extra name
  # (e.g. "lang.yaml") to its fully-qualified module path
  # ("lazyvim.plugins.extras.lang.yaml") and adds "news"/"version"
  # bookkeeping fields — the moment nvim actually loads the config (which
  # the headless sync task below now does on every apply). A plain
  # force-overwriting copy would therefore never be idempotent: it resets
  # the file to short-name form, the sync task immediately expands it
  # again, forever. Comparing the *set of extras* (after stripping the
  # module-path prefix LazyVim adds) against the role's own desired list
  # lets the deploy task below skip when nothing meaningful changed, while
  # still redeploying — and self-healing the expansion again on the next
  # sync — when roles/cli_dev_env/files/lazyvim.json itself gains or loses
  # an extra.
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazyvim.json"
  register: cli_dev_env_neovim_lazyvim_json_current
  become: false
  failed_when: false
  when: cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy lazyvim.json extras config
  ansible.builtin.copy:
    src: lazyvim.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazyvim.json"
    mode: "0644"
  become: false
  vars:
    _cli_dev_env_lazyvim_desired_extras: "{{ (lookup('file', role_path + '/files/lazyvim.json') | from_json).extras }}"
    _cli_dev_env_lazyvim_current_extras: >-
      {{
        (cli_dev_env_neovim_lazyvim_json_current.content | b64decode | from_json).extras | default([])
        | map('regex_replace', '^lazyvim\.plugins\.extras\.', '')
        | list
        if cli_dev_env_neovim_lazyvim_json_current.content is defined
        else []
      }}
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    (_cli_dev_env_lazyvim_desired_extras | sort) != (_cli_dev_env_lazyvim_current_extras | sort)
  tags: [neovim, cli_dev_env]

- name: Deploy catppuccin colorscheme plugin config
  ansible.builtin.copy:
    src: plugins/colorscheme.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/colorscheme.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy vim-tmux-navigator plugin config
  ansible.builtin.copy:
    src: plugins/tmux-navigator.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/tmux-navigator.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Ensure nvim config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/config"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy keymaps config (jk escape, buffer navigation)
  ansible.builtin.copy:
    src: config/keymaps.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/config/keymaps.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

- name: Deploy neovim shell integration snippet
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/neovim.zsh"
    mode: "0644"
    content: |
      # Preferred editor
      export EDITOR='nvim'
      export VISUAL='nvim'
      alias vi='nvim'
      alias vim='nvim'
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled
  tags: [neovim, cli_dev_env]

# ---- presenterm (neovim plugin config only — the presenterm binary,
# mermaid-cli and zsh snippet live in the modern_cli role instead) ----
- name: Ensure nvim plugins directory exists (presenterm.nvim)
  # Deliberately kept self-contained (duplicates the neovim "Ensure plugins
  # directory exists" task above) so `--tags presenterm` alone is
  # self-sufficient and does not implicitly depend on the neovim tag having
  # also run in the same invocation — same redundancy the source
  # computer-setup roles already had, for the same reason.
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins"
    state: directory
    mode: "0755"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    cli_dev_env_neovim_presenterm_plugin_enabled
  tags: [presenterm, cli_dev_env]

- name: Deploy presenterm.nvim plugin config
  # Gated on cli_dev_env_neovim_presenterm_plugin_enabled: the presenterm
  # binary this plugin needs now lives in a different, independently
  # installable role (modern_cli). See README for why this toggle exists and
  # how it must be kept in sync with modern_cli_presenterm_enabled.
  ansible.builtin.copy:
    src: plugins/presenterm.lua
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua/plugins/presenterm.lua"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    cli_dev_env_neovim_presenterm_plugin_enabled
  tags: [presenterm, cli_dev_env]

# ---- LazyVim headless plugin sync (runs after every plugin config file
# above is deployed, so a single apply on a fresh machine both configures
# and installs everything in one pass) ----
- name: Check lazy-lock.json checksum before sync
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazy-lock.json"
  register: cli_dev_env_neovim_lazylock_before
  become: false
  when: cli_dev_env_neovim_enabled and cli_dev_env_neovim_lazy_sync_enabled
  tags: [neovim, cli_dev_env]

- name: Sync LazyVim plugins headlessly
  # "Lazy! sync" (bang = non-interactive) installs missing plugins, updates
  # existing ones, and removes ones no longer declared — the documented
  # lazy.nvim headless-CI command; it blocks until the sync fully completes
  # before +qa quits, unlike a bare (non-bang) :Lazy sync. Individual plugin
  # versions aren't Renovate-tracked (see README) — this always syncs to
  # whatever each plugin's default branch currently resolves to, recorded
  # in lazy-lock.json.
  ansible.builtin.command: nvim --headless "+Lazy! sync" +qa
  become: false
  changed_when: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    cli_dev_env_neovim_lazy_sync_enabled
  tags: [neovim, cli_dev_env]

- name: Check lazy-lock.json checksum after sync
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazy-lock.json"
  register: cli_dev_env_neovim_lazylock_after
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_neovim_enabled and
    cli_dev_env_neovim_lazy_sync_enabled
  # Reports changed only when the sync actually installed/updated/removed a
  # plugin (lock file content differs), not on every run — required for
  # this task to behave correctly in Molecule's idempotence check, since
  # (unlike most tasks in this role) it must run on every apply rather than
  # being gated behind a one-time "already installed" stat check.
  changed_when: >-
    cli_dev_env_neovim_lazylock_before.stat.checksum | default('') !=
    cli_dev_env_neovim_lazylock_after.stat.checksum | default('')
  tags: [neovim, cli_dev_env]

# ---- claude-code (Claude Code CLI via npm, Node.js sourced from
# NodeSource — this role's own Node.js install, independent of modern_cli's
# mermaid-cli one; see README "Node.js management" for why the two don't
# share logic in this PR) ----
- name: Install prerequisites for NodeSource apt setup
  # python3-debian is required by the ansible.builtin.deb822_repository
  # module used below (it is not present by default on a minimal Ubuntu
  # image) — added to this same prerequisites task rather than a separate
  # one, alongside the other NodeSource-setup prerequisites.
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Remove legacy NodeSource apt sources list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent
  become: true
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Add NodeSource apt repository for Node.js LTS {{ cli_dev_env_claude_code_nodejs_major_version }}
  # python3-debian is only installed for real on a real (non-check) run —
  # see the task above. Under --check it would still be missing at this
  # point (a normal apt task never installs anything for real in check
  # mode), and deb822_repository hard-fails under check mode if the library
  # isn't importable — so this task (and everything that depends on the
  # repo it adds) is skipped in check mode too, matching this collection's
  # general pattern for resources that would only exist after a real run.
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ cli_dev_env_claude_code_nodejs_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: /etc/apt/keyrings/nodesource.asc
    state: present
  become: true
  when: cli_dev_env_claude_code_enabled and not ansible_check_mode
  tags: [claude-code, cli_dev_env]

- name: Check installed Node.js major version
  ansible.builtin.command: node --version
  register: cli_dev_env_claude_code_node_installed_version
  changed_when: false
  failed_when: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Remove Node.js if installed major version does not match configured LTS
  # not ansible_check_mode is required here, not just on the tasks below:
  # the "Check installed Node.js major version" command task above doesn't
  # skip under --check, it returns a *simulated* result (rc: 0, empty
  # stdout, "Command would have run if not in check mode") — without this
  # guard, that empty stdout never starts with 'v<major>.', so this task
  # concludes the version doesn't match even when it does, and actually
  # attempts removal.
  ansible.builtin.apt:
    name: nodejs
    state: absent
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_node_installed_version.rc == 0 and
    not cli_dev_env_claude_code_node_installed_version.stdout.startswith('v' + cli_dev_env_claude_code_nodejs_major_version | string + '.')
  tags: [claude-code, cli_dev_env]

- name: Install Node.js and build tools
  ansible.builtin.apt:
    name:
      - nodejs
      - build-essential
    state: present
    update_cache: true
  become: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Check for legacy root-owned global Claude Code install
  ansible.builtin.stat:
    path: /usr/lib/node_modules/@anthropic-ai/claude-code
  register: cli_dev_env_claude_code_legacy_global_stat
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Remove legacy root-owned global Claude Code install
  # Older versions of this role installed Claude Code as a root-owned global
  # npm package (become: true, default npm prefix on a NodeSource install is
  # /usr). This role now installs it under the invoking user's own npm
  # prefix instead (see NPM_CONFIG_PREFIX below), so a fresh `claude` on
  # PATH no longer needs root to self-update — but a machine that already
  # ran the old version has a stale root-owned copy left on disk. It no
  # longer wins on PATH (the user prefix's bin dir is prepended ahead of
  # /usr/bin by terminal_env's .zshrc), but remove it so there isn't a
  # second, never-updated copy sitting around.
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: absent
  become: true
  when: >-
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_legacy_global_stat.stat.exists and
    not ansible_check_mode
  tags: [claude-code, cli_dev_env]

- name: Create environment.d directory
  # Not assuming base already created this — role independence (this role
  # must be runnable standalone, see README/collection conventions).
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/environment.d"
    state: directory
    mode: "0755"
  become: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Deploy npm prefix environment.d config
  # Not a ~/.npmrc prefix= line: base's own "Deploy npm proxy configuration
  # (~/.npmrc)" task fully overwrites that file on every run it's enabled
  # (base_http_proxy != ''), so a prefix= line added there by lineinfile
  # would fight it forever — base removes it, this task re-adds it, next
  # run repeats indefinitely (found live; same class of bug as #124's
  # base/iac_tools vault.zsh collision, just no shared-filename escape hatch
  # here since ~/.npmrc's name is fixed by npm itself). A systemd user
  # session env var in its own file sidesteps the collision entirely, and
  # — unlike a task-scoped environment: override on the install task alone —
  # also covers the user's own future interactive `npm install -g`/Claude
  # Code self-update calls, not just this Ansible-driven install.
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/environment.d/npm-prefix.conf"
    mode: "0644"
    content: |
      NPM_CONFIG_PREFIX={{ ansible_facts['env']['HOME'] }}/.local
  become: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Install Claude Code CLI globally via npm
  # NPM_CONFIG_PREFIX here too, not just via the environment.d file above:
  # environment.d only takes effect for new systemd user sessions started
  # after this file is deployed, not for this ansible-playbook run itself
  # (which inherited whatever environment the user's current session had at
  # invocation time, e.g. before a first-ever run).
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    version: "{{ cli_dev_env_claude_code_version }}"
    global: true
    state: present
  environment:
    NPM_CONFIG_PREFIX: "{{ ansible_facts['env']['HOME'] }}/.local"
  become: false
  when: cli_dev_env_claude_code_enabled and not ansible_check_mode
  tags: [claude-code, cli_dev_env]

- name: Stat ~/.claude/settings.json
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: cli_dev_env_claude_code_settings_stat
  become: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Read ~/.claude/settings.json
  # A remote read (slurp), not lookup('file', ...): lookup() runs on the
  # controller, not the target host, so it silently reads (or misses) the
  # wrong machine's file whenever controller != target (e.g. over SSH) —
  # this collection cannot assume connection: local, unlike computer-setup.
  # Gated on the stat above rather than unconditionally, since slurp
  # hard-fails on a missing file — true here on a fresh install before
  # ~/.claude/ has been created by the CLI itself.
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: cli_dev_env_claude_code_settings_raw
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_settings_stat.stat.exists
  tags: [claude-code, cli_dev_env]

- name: Remove mcpServers from ~/.claude/settings.json if present (belongs in ~/.claude.json)
  vars:
    # The "if stat.exists else {}" ternary short-circuits (Jinja evaluates
    # only the taken branch), so the undefined/skipped slurp result is never
    # touched when the file doesn't exist.
    _cli_dev_env_claude_code_settings_current: >-
      {{ (cli_dev_env_claude_code_settings_raw.content | b64decode | from_json)
         if cli_dev_env_claude_code_settings_stat.stat.exists else {} }}
  ansible.builtin.copy:
    content: "{{ _cli_dev_env_claude_code_settings_current | dict2items | selectattr('key', '!=', 'mcpServers') | items2dict | to_nice_json }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
    mode: "0600"
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    (_cli_dev_env_claude_code_settings_current.mcpServers | default(none)) is not none
  tags: [claude-code, cli_dev_env]

- name: Stat ~/.claude.json
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
  register: cli_dev_env_claude_code_global_stat
  become: false
  when: cli_dev_env_claude_code_enabled
  tags: [claude-code, cli_dev_env]

- name: Read current Claude Code global config
  # Not ansible.builtin.slurp unconditionally, and not lookup('file', ...)
  # — same two reasons as ~/.claude/settings.json above: lookup() reads the
  # controller's filesystem, not the target's, and ~/.claude.json does not
  # exist yet on a fresh install (created by the CLI on first run/login,
  # not by the npm install above).
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
  register: cli_dev_env_claude_code_global_raw
  become: false
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    cli_dev_env_claude_code_global_stat.stat.exists
  tags: [claude-code, cli_dev_env]

- name: Configure MCP servers in Claude Code global config
  vars:
    _cli_dev_env_claude_code_current_global: >-
      {{ (cli_dev_env_claude_code_global_raw.content | b64decode | from_json)
         if cli_dev_env_claude_code_global_stat.stat.exists else {} }}
    _cli_dev_env_claude_code_desired_mcp_servers:
      ansible:
        type: stdio
        command: npx
        args: ["-y", "@ansible/ansible-mcp-server", "--stdio"]
        env: {}
      awslabs.aws-documentation:
        type: stdio
        command: uvx
        args: ["awslabs.aws-documentation-mcp-server@latest"]
        env:
          FASTMCP_LOG_LEVEL: ERROR
          UV_SYSTEM_CERTS: "true"
      awslabs.core:
        type: stdio
        command: uvx
        args: ["awslabs.core-mcp-server@latest"]
        env:
          AWS_PROFILE: "{{ cli_dev_env_claude_code_aws_profile }}"
          AWS_REGION: "{{ cli_dev_env_claude_code_aws_region }}"
          FASTMCP_LOG_LEVEL: ERROR
          UV_SYSTEM_CERTS: "true"
      terraform:
        type: stdio
        command: npx
        args: ["-y", "terraform-mcp-server"]
        env: {}
      github:
        type: stdio
        command: npx
        args: ["-y", "@modelcontextprotocol/server-github"]
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: "{{ cli_dev_env_claude_code_github_token }}"
      renovate:
        type: stdio
        command: npx
        args: ["-y", "renovate-mcp"]
        env: {}
    # Merge onto (not replace) any existing mcpServers entries — a server
    # registered outside this role (e.g. via `claude mcp add`, or `aws
    # configure agent-toolkit`'s `aws-mcp`) survives a re-run instead of
    # being silently wiped. Role-managed keys above still win on conflict
    # (combine() defaults to the second/right-hand dict), so this role
    # remains authoritative for its own servers' config.
    _cli_dev_env_claude_code_merged_mcp_servers: >-
      {{ (_cli_dev_env_claude_code_current_global.mcpServers | default({}))
         | combine(_cli_dev_env_claude_code_desired_mcp_servers) }}
  ansible.builtin.copy:
    content: "{{ _cli_dev_env_claude_code_current_global | combine({'mcpServers': _cli_dev_env_claude_code_merged_mcp_servers}) | to_nice_json }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude.json"
    mode: "0600"
  become: false
  # The rendered content embeds cli_dev_env_claude_code_github_token — keep
  # it out of -v/-vvv output the same way iac_tools' vault github_token
  # credential file write does.
  no_log: true
  when: >-
    not ansible_check_mode and
    cli_dev_env_claude_code_enabled and
    (_cli_dev_env_claude_code_current_global.mcpServers | default({})) != _cli_dev_env_claude_code_merged_mcp_servers
  tags: [claude-code, cli_dev_env]

# ---- kiro-cli (Kiro CLI, AI coding agent) ----
# kiro-cli is a per-user, self-updating binary that lives in ~/.local/bin, so
# every task here runs as the target user (become: false), never root, and
# calls the binary by its full path cli_dev_env_kiro_bin (~/.local/bin is not
# on PATH for a non-interactive Ansible run — same reason iac_tools calls
# ansible-galaxy by full path). Bundled in this role with Claude Code: both are
# CLI-first AI coding agents (see README).
- name: Detect whether kiro-cli is already installed
  ansible.builtin.stat:
    path: "{{ cli_dev_env_kiro_bin }}"
  register: cli_dev_env_kiro_stat
  become: false
  when: cli_dev_env_kiro_enabled
  tags: [kiro, cli_dev_env]

- name: Download the official kiro-cli install script
  # Unpinned remote source by necessity (see defaults/main.yml and README):
  # upstream ships no versioned asset to pin and checksum. Fetched to a file
  # under the user's cache (mode 0700, removed afterwards) rather than piped
  # straight into a shell, so the install step can be guarded against check
  # mode.
  ansible.builtin.get_url:
    url: "{{ cli_dev_env_kiro_install_url }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.cache/kiro-cli-install.sh"
    mode: "0700"
    force: true
  become: false
  when:
    - cli_dev_env_kiro_enabled
    - not ansible_check_mode
    - not cli_dev_env_kiro_stat.stat.exists
  tags: [kiro, cli_dev_env]

- name: Install kiro-cli via the official script
  # --force makes the installer non-interactive: without it the script prompts
  # on /dev/tty when a binary is already present (confirmed by reading the
  # upstream script). This task only runs when the binary is absent, but --force
  # keeps it safe against a stale/partial install and avoids any tty prompt on a
  # headless run.
  ansible.builtin.command:
    cmd: "bash {{ ansible_facts['env']['HOME'] }}/.cache/kiro-cli-install.sh --force"
  become: false
  register: cli_dev_env_kiro_install
  changed_when: true
  when:
    - cli_dev_env_kiro_enabled
    - not ansible_check_mode
    - not cli_dev_env_kiro_stat.stat.exists
  tags: [kiro, cli_dev_env]

- name: Remove the downloaded kiro-cli install script
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.cache/kiro-cli-install.sh"
    state: absent
  become: false
  when:
    - cli_dev_env_kiro_enabled
    - not ansible_check_mode
    - not cli_dev_env_kiro_stat.stat.exists
  tags: [kiro, cli_dev_env]

- name: Re-detect kiro-cli after install
  # The settings tasks below need a working binary; confirm the installer
  # actually produced one rather than assuming it did.
  ansible.builtin.stat:
    path: "{{ cli_dev_env_kiro_bin }}"
  register: cli_dev_env_kiro_stat_post
  become: false
  when:
    - cli_dev_env_kiro_enabled
    - not ansible_check_mode
  tags: [kiro, cli_dev_env]

- name: Assert kiro-cli is present after install
  ansible.builtin.assert:
    that: cli_dev_env_kiro_stat_post.stat.exists
    fail_msg: "kiro-cli was not found at {{ cli_dev_env_kiro_bin }} after the install step."
  become: false
  when:
    - cli_dev_env_kiro_enabled
    - not ansible_check_mode
  tags: [kiro, cli_dev_env]

- name: Update kiro-cli to the latest release
  # Only when it was already present (a fresh install is latest by definition)
  # and the consumer opted in. A self-update is not configuration convergence,
  # so this never reports changed — it would otherwise flap Molecule idempotence
  # on whatever the update command prints.
  ansible.builtin.command:
    cmd: "{{ cli_dev_env_kiro_bin }} update --non-interactive"
  become: false
  register: cli_dev_env_kiro_update_run
  changed_when: false
  when:
    - cli_dev_env_kiro_enabled
    - cli_dev_env_kiro_update
    - not ansible_check_mode
    - cli_dev_env_kiro_stat.stat.exists
  tags: [kiro, cli_dev_env]

# kiro-cli default behaviour settings — read each setting as JSON first and
# write only when the current value differs, so the role is idempotent.
# `kiro-cli settings <key> -f json` prints the value as JSON (e.g. "v3", true)
# and exits 0, or exits non-zero when the key is unset.
- name: Read current kiro-cli settings
  ansible.builtin.command: "{{ cli_dev_env_kiro_bin }} settings {{ item.key }} -f json"
  loop:
    - { key: "chat.agentEngine", want: "{{ cli_dev_env_kiro_agent_engine }}" }
    - { key: "toolSearch.enabled", want: "{{ cli_dev_env_kiro_tool_search_enabled }}" }
    - { key: "chat.disableTrustAllConfirmation", want: "{{ cli_dev_env_kiro_disable_trust_all_confirmation }}" }
  loop_control:
    label: "{{ item.key }}"
    loop_var: item
  register: cli_dev_env_kiro_settings_read
  changed_when: false
  failed_when: false
  become: false
  when:
    - cli_dev_env_kiro_enabled
    - not ansible_check_mode
  tags: [kiro, cli_dev_env]

- name: Apply kiro-cli settings that differ from the desired value
  # A write runs only when the key is unset (read rc != 0) or its parsed JSON
  # value does not equal the desired value — an exact, type-aware comparison,
  # not a substring match on the human-readable "v3 (global)" output.
  ansible.builtin.command:
    cmd: "{{ cli_dev_env_kiro_bin }} settings {{ item.item.key }} {{ item.item.want | string | lower if (item.item.want is boolean) else item.item.want }}"
  become: false
  changed_when: true
  loop: "{{ cli_dev_env_kiro_settings_read.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - cli_dev_env_kiro_enabled
    - not ansible_check_mode
    - item.rc != 0 or (item.stdout | from_json) != item.item.want
  tags: [kiro, cli_dev_env]

- name: Create zsh conf.d directory (kiro-cli aliases)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when:
    - cli_dev_env_kiro_enabled
    - cli_dev_env_kiro_deploy_shell_aliases
  tags: [kiro, cli_dev_env]

- name: Remove legacy kiro_cli.zsh alias snippet from the standalone role
  # Older versions of this collection shipped Kiro CLI as a standalone
  # kiro_cli role that deployed ~/.config/zsh/conf.d/kiro_cli.zsh. This role
  # now deploys kiro.zsh instead. Both files are auto-sourced from conf.d, so
  # a leftover kiro_cli.zsh would keep defining ki/kil in parallel with this
  # role's kiro.zsh; depending on the locale's glob collation it may even be
  # sourced last and override a customized alias. Remove the orphan on
  # upgrade. Unconditional (no content guard, unlike base's vault.zsh cleanup):
  # that filename was owned exclusively by the removed kiro_cli role — no other
  # role ever wrote it and a hand-written file at this exact path is not a
  # supported configuration — so there is nothing of another role's to
  # preserve. Gated on cli_dev_env_kiro_enabled only (not the alias sub-toggle),
  # so a user who sets cli_dev_env_kiro_deploy_shell_aliases: false to supply
  # their own ki/kil still gets the stale snippet cleared, and matches the
  # feature-toggle-only gating of the claude-code legacy cleanups above.
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro_cli.zsh"
    state: absent
  become: false
  when: cli_dev_env_kiro_enabled
  tags: [kiro, cli_dev_env]

- name: Deploy kiro-cli shell alias snippet
  ansible.builtin.template:
    src: kiro.zsh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro.zsh"
    mode: "0644"
  become: false
  when:
    - cli_dev_env_kiro_enabled
    - cli_dev_env_kiro_deploy_shell_aliases
  tags: [kiro, cli_dev_env]
