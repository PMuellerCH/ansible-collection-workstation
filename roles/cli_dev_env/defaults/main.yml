---
cli_dev_env_lazygit_enabled: true
cli_dev_env_neovim_enabled: true
cli_dev_env_claude_code_enabled: true
cli_dev_env_kiro_enabled: true

# Optional GitHub API token used only to raise the rate limit when resolving
# the neovim release-asset digest (neovim publishes no checksum file — see
# tasks/main.yml). Defaults to GH_TOKEN/GITHUB_TOKEN from the environment;
# unauthenticated (empty) still works but is subject to GitHub's 60 requests/hour
# per-IP limit. On GitHub Actions the workflow passes GITHUB_TOKEN.
cli_dev_env_github_api_token: "{{ lookup('ansible.builtin.env', 'GH_TOKEN') or lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"

# Deploys ~/.config/nvim/lua/plugins/presenterm.lua for the presenterm.nvim
# LazyVim plugin. The presenterm *binary* this plugin needs lives in the
# modern_cli role (modern_cli_presenterm_enabled) — keep the two in sync in
# whatever play wires both roles together, see README.
cli_dev_env_neovim_presenterm_plugin_enabled: true

# Runs a headless `lazy.nvim` sync (install + update + clean) on every
# apply, instead of relying on a human running :Lazy sync manually inside
# neovim. See README for why individual plugin versions aren't
# Renovate-tracked.
cli_dev_env_neovim_lazy_sync_enabled: true

# renovate: datasource=github-releases depName=jesseduffield/lazygit extractVersion=^v(?<version>.*)$
cli_dev_env_lazygit_version: "0.66.2"
cli_dev_env_lazygit_download_base: "https://github.com/jesseduffield/lazygit/releases/download/v{{ cli_dev_env_lazygit_version }}"

# renovate: datasource=github-releases depName=neovim/neovim extractVersion=^v(?<version>.*)$
cli_dev_env_neovim_version: "0.12.6"
# neovim/neovim publishes no checksum file (unlike lazygit's checksums.txt); the
# archive checksum is derived at run time from GitHub's per-asset digest for the
# pinned version (see tasks/main.yml), so there is no static checksum to keep in
# sync when Renovate bumps the version.

# Selects which NodeSource major-version apt repo to add
# (deb.nodesource.com/node_{{ major }}.x) — nodejs/build-essential
# themselves are installed unpinned, see the root README.
cli_dev_env_claude_code_nodejs_major_version: "24"
# renovate: datasource=npm depName=@anthropic-ai/claude-code
cli_dev_env_claude_code_version: "2.1.314"
cli_dev_env_claude_code_aws_profile: "default"
cli_dev_env_claude_code_aws_region: "eu-central-1"
cli_dev_env_claude_code_github_token: ""

# ---- kiro-cli (Kiro CLI, AI coding agent) ----
# Grouped here with Claude Code: both are CLI-first AI coding agents a
# developer reaches for directly in the terminal, the same core-workflow
# rationale that bundles lazygit/neovim/Claude Code in this role.

# Absolute path to the kiro-cli binary. kiro-cli installs into the user's
# ~/.local/bin, which is not guaranteed to be on $PATH for a non-interactive
# Ansible run (no shell profile is sourced) — so every task calls the binary by
# full path, the same way iac_tools calls ansible-galaxy. Also used to detect an
# existing install.
cli_dev_env_kiro_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/kiro-cli"

# Official installer. kiro-cli is a self-updating single binary published only
# through this script (https://cli.kiro.dev/install) into ~/.local/bin; upstream
# ships no versioned, individually downloadable release asset to pin and
# checksum the way cliphist/clipse do. The install URL is therefore an
# unpinned remote source — a deliberate, documented deviation from this
# collection's "pin everything" convention (see README "kiro-cli is installed
# via the official script"). The role only runs the installer when the binary
# is absent; keeping it current afterwards is left to `kiro-cli update`
# (exposed through cli_dev_env_kiro_update below), the tool's own supported
# mechanism.
cli_dev_env_kiro_install_url: "https://cli.kiro.dev/install"

# Run `kiro-cli update --non-interactive` when the binary is already present,
# so a provisioned machine converges to the latest release. Set false to leave
# an existing install untouched (only ever install when missing).
cli_dev_env_kiro_update: true

# ---- kiro-cli default behaviour settings (persisted via `kiro-cli settings`) ----
# v3 agent engine ("v3 cli").
cli_dev_env_kiro_agent_engine: v3
# Tool auto-search ("autosearch for tools").
cli_dev_env_kiro_tool_search_enabled: true
# Autonomous mode is not a persistent setting — it is the `--trust-all-tools`
# chat flag, baked into the `ki` alias below. This setting only stops kiro-cli
# from prompting for confirmation each time trust-all is used, so the alias
# runs non-interactively.
cli_dev_env_kiro_disable_trust_all_confirmation: true

# ---- kiro-cli shell aliases ----
cli_dev_env_kiro_deploy_shell_aliases: true
# `ki`  -> kiro-cli chat in autonomous mode (trust-all-tools).
# `kil` -> kiro-cli login.
cli_dev_env_kiro_alias_chat: ki
cli_dev_env_kiro_alias_login: kil
