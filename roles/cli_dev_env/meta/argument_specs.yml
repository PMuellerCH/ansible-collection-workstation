---
argument_specs:
  main:
    short_description: >-
      Install CLI developer environment tools: lazygit, neovim/LazyVim, and
      the Claude Code CLI — each independently toggleable — plus
      presenterm.nvim's plugin config (independently toggleable, depends on
      the presenterm binary installed by the modern_cli role) and a headless
      lazy.nvim plugin sync on every apply.
    options:
      cli_dev_env_lazygit_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install lazygit.
      cli_dev_env_neovim_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Whether to install neovim and bootstrap the LazyVim configuration.
          Also gates the presenterm.nvim plugin config below.
      cli_dev_env_claude_code_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Whether to install the Claude Code CLI, its NodeSource-sourced
          Node.js dependency, and configure its MCP servers.
      cli_dev_env_neovim_presenterm_plugin_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Whether to deploy the presenterm.nvim plugin config
          (~/.config/nvim/lua/plugins/presenterm.lua). The presenterm binary
          this plugin needs lives in the modern_cli role
          (modern_cli_presenterm_enabled) — keep the two in sync. Only
          applies when cli_dev_env_neovim_enabled is true.
      cli_dev_env_neovim_lazy_sync_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Whether to run a headless `lazy.nvim` sync (install + update +
          clean) on every apply, instead of relying on a human running
          :Lazy sync manually. Only applies when cli_dev_env_neovim_enabled
          is true.
      cli_dev_env_lazygit_version:
        type: str
        required: false
        description: lazygit version (github-releases jesseduffield/lazygit), installed from a checksum-verified archive.
      cli_dev_env_lazygit_download_base:
        type: str
        required: false
        default: "https://github.com/jesseduffield/lazygit/releases/download/v{{ cli_dev_env_lazygit_version }}"
        description: Base URL the lazygit archive and its checksums.txt are downloaded from, before the filename.
      cli_dev_env_neovim_version:
        type: str
        required: false
        description: Neovim version (github-releases neovim/neovim), installed from a checksum-verified archive.
      cli_dev_env_claude_code_nodejs_major_version:
        type: str
        required: false
        default: "24"
        description: >-
          Node.js LTS major version installed from NodeSource for the
          Claude Code CLI (selects which deb.nodesource.com/node_{major}.x
          repo to add). nodejs and build-essential themselves are installed
          unpinned — see the root README.
      cli_dev_env_claude_code_version:
        type: str
        required: false
        description: "@anthropic-ai/claude-code npm package version (npm datasource)."
      cli_dev_env_claude_code_aws_profile:
        type: str
        required: false
        default: "default"
        description: AWS_PROFILE passed to the awslabs.core MCP server.
      cli_dev_env_claude_code_aws_region:
        type: str
        required: false
        default: "eu-central-1"
        description: AWS_REGION passed to the awslabs.core MCP server.
      cli_dev_env_claude_code_github_token:
        type: str
        required: false
        default: ""
        description: >-
          GitHub PAT passed as GITHUB_PERSONAL_ACCESS_TOKEN to the github
          MCP server (from the consumer's own secret store, e.g. Ansible
          Vault). Empty by default.
