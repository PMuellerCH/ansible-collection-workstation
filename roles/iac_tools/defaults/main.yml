---
# Per-tool enable flags — preserve original per-role identity within the merged role.
iac_tools_ansible_enabled: true
iac_tools_docker_enabled: true
iac_tools_act_enabled: true
iac_tools_aws_enabled: true
iac_tools_terraform_enabled: true
iac_tools_kubernetes_tools_enabled: true
iac_tools_floci_enabled: true

# Corporate proxy / Vault — role-scoped (a reusable role can't assume a
# consumer's global base_* vars). Leave empty on machines without a proxy.
iac_tools_http_proxy: ""
iac_tools_https_proxy: "{{ iac_tools_http_proxy }}"
iac_tools_no_proxy: ""
iac_tools_vault_addr: ""

# pipx bootstrap — community.general.pipx requires pipx >= 1.7.0, but Ubuntu
# 24.04's apt-provided pipx is only 1.4.3. See README "pipx bootstrap"
# section (same pattern as the code_quality_tools role).
# renovate: datasource=pypi depName=pipx
iac_tools_pipx_min_version: "1.18.5"

# ── ansible ──────────────────────────────────────────────────────────────
# renovate: datasource=pypi depName=ansible-core
iac_tools_ansible_core_version: "2.21.5"
# renovate: datasource=pypi depName=molecule
iac_tools_ansible_molecule_version: "26.10.0"
# renovate: datasource=pypi depName=molecule-plugins
iac_tools_ansible_molecule_plugins_version: "26.10.12"
# renovate: datasource=pypi depName=hvac
# Shared with kubernetes_tools's Pop!_OS pipx-inject branch below — both
# inject hvac into the same ansible-core venv, so a single pinned version
# avoids two tasks fighting over different versions of the same package.
iac_tools_hvac_version: "2.4.0"

# ── act ──────────────────────────────────────────────────────────────────
# renovate: datasource=github-releases depName=nektos/act extractVersion=^v(?<version>.*)$
iac_tools_act_version: "0.2.89"
iac_tools_act_download_base: "https://github.com/nektos/act/releases/download/v{{ iac_tools_act_version }}"

# ── aws ──────────────────────────────────────────────────────────────────
# renovate: datasource=github-tags depName=aws/aws-cli
iac_tools_aws_cli_version: "2.38.6"
# renovate: datasource=pypi depName=boto3
iac_tools_aws_boto3_version: "1.43.27"
# renovate: datasource=github-releases depName=aws/session-manager-plugin
iac_tools_aws_session_manager_plugin_version: "1.2.814.0"

# AWS SSO profiles for ~/.aws/config, one entry per [default]/[profile ...]
# block. Empty by default — no ~/.aws/config is deployed until a consumer
# supplies real profile data. Each item:
#   name: "default" (renders a bare [default] block) or a profile name
#         (renders [profile <name>])
#   sso_start_url, sso_region, output: as in the AWS config file
#   sso_role_name, sso_account_id, region: profile-specific (omit for a bare
#         [default] block that only sets sso_start_url/sso_region/output)
iac_tools_aws_profiles: []

# ── terraform ────────────────────────────────────────────────────────────
# renovate: datasource=github-releases depName=terraform-linters/tflint extractVersion=^v(?<version>.*)$
iac_tools_tflint_version: "0.65.0"
# renovate: datasource=github-releases depName=terraform-docs/terraform-docs extractVersion=^v(?<version>.*)$
iac_tools_terraform_docs_version: "0.24.0"
iac_tools_terraform_docs_archive: "terraform-docs-v{{ iac_tools_terraform_docs_version }}-linux-amd64.tar.gz"
# renovate: datasource=github-releases depName=warrensbox/terraform-switcher extractVersion=^v(?<version>.*)$
iac_tools_tfswitch_version: "1.20.0"
iac_tools_tfswitch_archive: "terraform-switcher_v{{ iac_tools_tfswitch_version }}_linux_amd64.tar.gz"
iac_tools_tfswitch_download_base: "https://github.com/warrensbox/terraform-switcher/releases/download/v{{ iac_tools_tfswitch_version }}"

# Terraform Cloud / Vault secrets — already externalized via Ansible Vault
# upstream; consumers pass these in. Empty defaults so the role degrades
# gracefully (no credentials block deployed) when unset.
iac_tools_terraform_cloud_token: ""
iac_tools_terraform_vault_github_token: ""

# ── floci ─────────────────────────────────────────────────────────────────
# Pinned against floci-io/floci-cli (the CLI wrapper), not floci-io/floci
# (the emulator engine itself, which ships only as a Docker image with no
# GitHub release binaries — floci start pulls and manages it directly).
# renovate: datasource=github-releases depName=floci-io/floci-cli extractVersion=^(?<version>.*)$
iac_tools_floci_version: "0.4.0"

# ── kubernetes_tools ─────────────────────────────────────────────────────
# renovate: datasource=github-releases depName=kubernetes/kubernetes extractVersion=^v(?<version>.*)$
iac_tools_kubectl_version: "1.37.1"
iac_tools_kubectl_url: "https://dl.k8s.io/release/v{{ iac_tools_kubectl_version }}/bin/linux/amd64/kubectl"
iac_tools_kubectl_checksum_url: "https://dl.k8s.io/release/v{{ iac_tools_kubectl_version }}/bin/linux/amd64/kubectl.sha256"
# renovate: datasource=github-releases depName=derailed/k9s extractVersion=^v(?<version>.*)$
iac_tools_k9s_version: "0.50.18"
# renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.*)$
iac_tools_helm_version: "4.3.1"
# renovate: datasource=github-releases depName=ahmetb/kubectx extractVersion=^v(?<version>.*)$
iac_tools_kubectx_version: "0.11.0"
iac_tools_kubectx_archive: "kubectx_v{{ iac_tools_kubectx_version }}_linux_x86_64.tar.gz"
iac_tools_kubens_archive: "kubens_v{{ iac_tools_kubectx_version }}_linux_x86_64.tar.gz"
# renovate: datasource=github-releases depName=stern/stern extractVersion=^v(?<version>.*)$
iac_tools_stern_version: "1.35.0"
# renovate: datasource=github-releases depName=kubernetes-sigs/krew extractVersion=^v(?<version>.*)$
iac_tools_krew_version: "0.5.0"
# renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.*)$
iac_tools_kubeconform_version: "0.8.0"
# renovate: datasource=github-releases depName=stackrox/kube-linter extractVersion=^v(?<version>.*)$
iac_tools_kube_linter_version: "0.8.3"
# renovate: datasource=pypi depName=kubernetes
iac_tools_kubernetes_pip_kubernetes_version: "37.0.1"
# renovate: datasource=pypi depName=jsonpatch
iac_tools_kubernetes_pip_jsonpatch_version: "1.38"
# renovate: datasource=pypi depName=pyhcl
iac_tools_kubernetes_pip_pyhcl_version: "0.4.5"

# EKS clusters for ~/.kube/config, one entry per cluster/context. Empty by
# default — no kubeconfig is deployed until a consumer supplies real
# cluster data. Each item reconstructs one cluster + matching context + aws
# exec-auth user entry:
#   context_name: friendly context name (e.g. "myproject-dev")
#   cluster_name: short EKS cluster name (e.g. "dev") — used in the ARN and
#         passed to `aws eks get-token --cluster-name`
#   region: AWS region the cluster runs in
#   account_id: AWS account ID the cluster belongs to
#   certificate_authority_data: base64 cluster CA cert
#   server: cluster API server URL
#   role_arn: IAM role ARN assumed via `aws eks get-token --role`
#   aws_profile: AWS_PROFILE used for the exec credential plugin
iac_tools_kubernetes_clusters: []
# Context name to set as `current-context`. Defaults to the first entry in
# iac_tools_kubernetes_clusters when left empty and the list is non-empty.
iac_tools_kubernetes_current_context: ""
