---
# ═══════════════════════════════════════════════════════════════════════════
# ansible — ansible-core (pipx), Galaxy collections
# ═══════════════════════════════════════════════════════════════════════════

# pipx bootstrap — community.general.pipx requires pipx >= 1.7.0, but Ubuntu
# 24.04's apt-provided pipx is only 1.4.3. Scoped to whichever sub-roles that
# rely on the shared ansible-core pipx venv are enabled (ansible itself, plus
# aws/kubernetes_tools which inject packages into that same venv), so a
# consumer running only "docker"/"terraform" doesn't pay for it. See README.
- name: Install python3-pip and python3-venv (required to bootstrap a newer pipx and its managed venvs)
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: iac_tools_ansible_enabled or iac_tools_aws_enabled or iac_tools_kubernetes_tools_enabled
  tags: [ansible, aws, kubernetes_tools, iac_tools]

- name: Ensure pipx >= minimum version is importable via `python -m pipx`
  ansible.builtin.pip:
    name: "pipx=={{ iac_tools_pipx_min_version }}"
    extra_args: "--user --break-system-packages"
    executable: pip3
  become: false
  when: iac_tools_ansible_enabled or iac_tools_aws_enabled or iac_tools_kubernetes_tools_enabled
  tags: [ansible, aws, kubernetes_tools, iac_tools]

- name: Install ansible-core via pipx
  community.general.pipx:
    name: "ansible-core=={{ iac_tools_ansible_core_version }}"
    state: present
  become: false
  when: not ansible_check_mode and iac_tools_ansible_enabled
  tags: [ansible, iac_tools]

- name: Inject hvac into ansible-core pipx venv
  community.general.pipx:
    name: ansible-core
    state: inject
    inject_packages:
      - "hvac=={{ iac_tools_hvac_version }}"
  become: false
  when: not ansible_check_mode and iac_tools_ansible_enabled
  tags: [ansible, iac_tools]

- name: Inject molecule into ansible-core pipx venv
  community.general.pipx:
    name: ansible-core
    state: inject
    inject_packages:
      - "molecule=={{ iac_tools_ansible_molecule_version }}"
    install_apps: true
  become: false
  when: not ansible_check_mode and iac_tools_ansible_enabled
  tags: [ansible, iac_tools]

- name: Inject molecule-plugins into ansible-core pipx venv
  community.general.pipx:
    name: ansible-core
    state: inject
    inject_packages:
      - "molecule-plugins[docker]=={{ iac_tools_ansible_molecule_plugins_version }}"
  become: false
  when: not ansible_check_mode and iac_tools_ansible_enabled
  tags: [ansible, iac_tools]

- name: Copy Galaxy collections requirements file to the target
  # role_path is a controller-side path — it only happens to also be valid
  # on the target in computer-setup (which always uses connection: local,
  # so controller == target). A reusable role can't assume that; copy the
  # file to the target first so the command below has something real to
  # read regardless of connection type (ssh, docker, ...).
  ansible.builtin.copy:
    src: requirements.yml
    dest: /tmp/iac_tools-ansible-collections-requirements.yml
    mode: "0644"
  become: false
  when: iac_tools_ansible_enabled
  tags: [ansible, iac_tools]

- name: Install common Ansible Galaxy collections
  # Full path, not just "ansible-galaxy" — pipx installs its entry-point
  # binaries to ~/.local/bin, which isn't guaranteed to be on $PATH for a
  # non-interactive Ansible run (no shell profile sourced). --upgrade is
  # required for exact-pinned versions to actually apply on a re-run —
  # without it, ansible-galaxy silently skips a collection that's already
  # installed at any version, so a Renovate-driven version bump in
  # requirements.yml would otherwise never take effect on an
  # already-provisioned machine.
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ansible-galaxy collection install --upgrade -r /tmp/iac_tools-ansible-collections-requirements.yml"
  become: false
  changed_when: false
  when: not ansible_check_mode and iac_tools_ansible_enabled
  tags: [ansible, iac_tools]

# ═══════════════════════════════════════════════════════════════════════════
# docker — Docker CE + compose/buildx, corporate proxy integration
# ═══════════════════════════════════════════════════════════════════════════

# ansible.builtin.deb822_repository (used here and in the terraform section
# below) can normally auto-install this dependency itself on a real run, but
# not under --check ("python3-debian must be installed to use check mode") —
# install it explicitly up front so both apt-repository tasks work in either
# mode.
- name: Install python3-debian (required by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: iac_tools_docker_enabled or iac_tools_terraform_enabled
  tags: [docker, terraform, iac_tools]

# Required by the AWS CLI installer and tflint (.zip) unarchive steps below —
# ansible.builtin.unarchive has no pure-Python fallback for .zip.
# computer-setup's own base role happens to already install this, but a
# reusable role can't assume that. A generic utility, not any sub-role's
# primary tool, so left unpinned like other bundled utilities elsewhere in
# this collection.
- name: Install unzip
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: iac_tools_aws_enabled or iac_tools_terraform_enabled
  tags: [aws, terraform, iac_tools]

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
  become: true
  when: iac_tools_docker_enabled
  tags: [docker, iac_tools]

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /usr/share/keyrings/docker.asc
    mode: "0644"
    force: false
  become: true
  when: iac_tools_docker_enabled
  tags: [docker, iac_tools]

- name: Remove legacy Docker apt sources list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true
  when: iac_tools_docker_enabled
  tags: [docker, iac_tools]

# python3-debian is only installed for real on a real (non-check) run — see
# the task above. Under --check it would still be missing at this point (a
# normal apt task never installs anything for real in check mode), so
# deb822_repository (and everything that depends on the repo it adds) is
# skipped in check mode too, matching this collection's general pattern for
# resources that would only exist after a real run.
- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: noble
    components: stable
    architectures: amd64
    signed_by: /usr/share/keyrings/docker.asc
    state: present
  become: true
  when: iac_tools_docker_enabled and not ansible_check_mode
  tags: [docker, iac_tools]

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - "docker-ce=5:{{ iac_tools_docker_version }}-1~ubuntu.24.04~noble"
      - "docker-ce-cli=5:{{ iac_tools_docker_version }}-1~ubuntu.24.04~noble"
      - "docker-ce-rootless-extras=5:{{ iac_tools_docker_version }}-1~ubuntu.24.04~noble"
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
  when: iac_tools_docker_enabled and not ansible_check_mode
  tags: [docker, iac_tools]

- name: Hold Docker package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  become: true
  loop:
    - docker-ce
    - docker-ce-cli
    - docker-ce-rootless-extras
  when: iac_tools_docker_enabled and not ansible_check_mode
  tags: [docker, iac_tools]

- name: Add user to docker group
  # ansible_facts['user_id'], not ansible_facts['env']['USER'] — $USER isn't
  # guaranteed to be exported (e.g. no login shell in a minimal/systemd
  # target such as a Molecule container), while user_id is always populated
  # by the setup module regardless of environment. Skipped under --check —
  # the docker group is created by docker-ce's postinst script, which never
  # ran for real above in check mode, so the group wouldn't exist yet.
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true
  when: iac_tools_docker_enabled and not ansible_check_mode
  tags: [docker, iac_tools]

- name: Create Docker systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  become: true
  when: iac_tools_docker_enabled and iac_tools_http_proxy != ''
  tags: [docker, iac_tools]

- name: Deploy Docker proxy systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    mode: "0644"
    content: |
      [Service]
      Environment="http_proxy={{ iac_tools_http_proxy }}"
      Environment="https_proxy={{ iac_tools_https_proxy }}"
      Environment="HTTP_PROXY={{ iac_tools_http_proxy }}"
      Environment="HTTPS_PROXY={{ iac_tools_https_proxy }}"
      Environment="no_proxy={{ iac_tools_no_proxy }}"
      Environment="NO_PROXY={{ iac_tools_no_proxy }}"
  become: true
  when: iac_tools_docker_enabled and iac_tools_http_proxy != ''
  notify:
    - Reload systemd daemon
    - Restart docker
  tags: [docker, iac_tools]

- name: Create Docker client config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.docker"
    state: directory
    mode: "0700"
  become: false
  when: iac_tools_docker_enabled and iac_tools_http_proxy != ''
  tags: [docker, iac_tools]

- name: Deploy Docker client proxy config
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.docker/config.json"
    mode: "0600"
    force: false
    content: |
      {
        "proxies": {
          "default": {
            "httpProxy": "{{ iac_tools_http_proxy }}",
            "httpsProxy": "{{ iac_tools_https_proxy }}",
            "noProxy": "{{ iac_tools_no_proxy }}"
          }
        }
      }
  become: false
  when: iac_tools_docker_enabled and iac_tools_http_proxy != ''
  tags: [docker, iac_tools]

# ═══════════════════════════════════════════════════════════════════════════
# aws — AWS CLI v2, session-manager-plugin, boto3 (shared ansible-core venv)
# ═══════════════════════════════════════════════════════════════════════════

- name: Get installed AWS CLI version
  ansible.builtin.command: aws --version
  register: iac_tools_aws_current_version
  become: false
  changed_when: false
  failed_when: false
  when: iac_tools_aws_enabled
  tags: [aws, iac_tools]

# Note: AWS only publishes a GPG .sig for this installer, not a plain or
# structured checksum file — outside the two-tier get_url checksum pattern
# used elsewhere in this collection (see README). Deferred rather than
# blocking, matching this collection's established judgment call for
# downloads with no straightforward checksum path.
- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ iac_tools_aws_cli_version }}.zip"
    dest: "/tmp/awscliv2-{{ iac_tools_aws_cli_version }}.zip"
    mode: "0644"
  when: >-
    iac_tools_aws_enabled and
    (iac_tools_aws_current_version.rc != 0 or iac_tools_aws_cli_version not in iac_tools_aws_current_version.stdout)
  tags: [aws, iac_tools]

- name: Unzip AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: "/tmp/awscliv2-{{ iac_tools_aws_cli_version }}.zip"
    dest: /tmp
    remote_src: true
  when: >-
    not ansible_check_mode and iac_tools_aws_enabled and
    (iac_tools_aws_current_version.rc != 0 or iac_tools_aws_cli_version not in iac_tools_aws_current_version.stdout)
  tags: [aws, iac_tools]

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install --update
  become: true
  when: >-
    not ansible_check_mode and iac_tools_aws_enabled and
    (iac_tools_aws_current_version.rc != 0 or iac_tools_aws_cli_version not in iac_tools_aws_current_version.stdout)
  changed_when: true
  tags: [aws, iac_tools]

- name: Ensure ~/.config/zsh/conf.d directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when: iac_tools_aws_enabled
  tags: [aws, iac_tools]

- name: Deploy aws zsh config
  ansible.builtin.copy:
    src: aws.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/aws.zsh"
    mode: "0644"
  become: false
  when: iac_tools_aws_enabled
  tags: [aws, iac_tools]

- name: Ensure ~/.aws directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.aws"
    state: directory
    mode: "0700"
  become: false
  when: iac_tools_aws_enabled
  tags: [aws, iac_tools]

- name: Deploy AWS config
  ansible.builtin.template:
    src: aws-config.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.aws/config"
    mode: "0600"
    force: false
  become: false
  when: iac_tools_aws_enabled and iac_tools_aws_profiles | length > 0
  tags: [aws, iac_tools]

- name: Get boto3 version in ansible-core venv
  # `python3 -m pipx`, not the "pipx" binary — same PATH-independence
  # rationale as the ansible-galaxy task above (and matches how
  # community.general.pipx itself resolves pipx, per its own docs).
  ansible.builtin.command:
    cmd: python3 -m pipx runpip ansible-core show boto3
  register: iac_tools_aws_boto3_current
  become: false
  changed_when: false
  failed_when: false
  when: not ansible_check_mode and iac_tools_aws_enabled
  tags: [aws, iac_tools]

- name: Inject boto3 into ansible-core pipx venv
  # Also requires iac_tools_ansible_enabled — the ansible-core pipx app this
  # injects into is only installed by the "ansible" sub-role above. Without
  # this guard, enabling aws while disabling ansible would hard-fail here
  # (pipx inject requires the target app to already exist).
  community.general.pipx:
    name: ansible-core
    state: inject
    inject_packages:
      - "boto3=={{ iac_tools_aws_boto3_version }}"
    force: true
  become: false
  when: >-
    not ansible_check_mode and iac_tools_aws_enabled and iac_tools_ansible_enabled and
    (iac_tools_aws_boto3_current.rc != 0 or iac_tools_aws_boto3_version not in iac_tools_aws_boto3_current.stdout)
  tags: [aws, iac_tools]

- name: Get installed session-manager-plugin version
  ansible.builtin.command:
    cmd: session-manager-plugin --version
  register: iac_tools_aws_smp_current
  become: false
  changed_when: false
  failed_when: false
  when: iac_tools_aws_enabled
  tags: [aws, iac_tools]

# Note: same GPG-.sig-only situation as the AWS CLI installer above.
- name: Download session-manager-plugin .deb
  ansible.builtin.get_url:
    url: "https://s3.amazonaws.com/session-manager-downloads/plugin/{{ iac_tools_aws_session_manager_plugin_version }}/ubuntu_64bit/session-manager-plugin.deb"
    dest: "/tmp/session-manager-plugin-{{ iac_tools_aws_session_manager_plugin_version }}.deb"
    mode: "0644"
  when: >-
    iac_tools_aws_enabled and
    (iac_tools_aws_smp_current.rc != 0 or iac_tools_aws_session_manager_plugin_version not in iac_tools_aws_smp_current.stdout)
  tags: [aws, iac_tools]

- name: Install session-manager-plugin
  ansible.builtin.apt:
    deb: "/tmp/session-manager-plugin-{{ iac_tools_aws_session_manager_plugin_version }}.deb"
  become: true
  when: >-
    not ansible_check_mode and iac_tools_aws_enabled and
    (iac_tools_aws_smp_current.rc != 0 or iac_tools_aws_session_manager_plugin_version not in iac_tools_aws_smp_current.stdout)
  tags: [aws, iac_tools]

- name: Deploy aws proxy environment snippet
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/aws-proxy.zsh"
    mode: "0644"
    content: |
      export AWS_CA_BUNDLE="/etc/ssl/certs/ca-certificates.crt"
      export AWS_REQUEST_CHECKSUM_CALCULATION="when_required"
  become: false
  when: iac_tools_aws_enabled and iac_tools_http_proxy != ''
  tags: [aws, iac_tools]

# ═══════════════════════════════════════════════════════════════════════════
# terraform — Terraform, Vault (apt), tfswitch, tflint, terraform-docs
# ═══════════════════════════════════════════════════════════════════════════

- name: Download HashiCorp GPG key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
    mode: "0644"
  become: true
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Remove legacy HashiCorp apt sources list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/hashicorp.list
    state: absent
  become: true
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

# terraform/vault package integrity is verified by apt itself against the
# HashiCorp repo's signed Release metadata (signed_by above) — no separate
# per-package checksum needed on top of that. Skipped under --check for the
# same python3-debian reason as the Docker repository task above.
- name: Add HashiCorp apt repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /usr/share/keyrings/hashicorp-archive-keyring.asc
    state: present
  become: true
  when: iac_tools_terraform_enabled and not ansible_check_mode
  tags: [terraform, iac_tools]

- name: Install terraform and vault
  ansible.builtin.apt:
    name:
      - "terraform={{ iac_tools_terraform_version }}"
      - "vault={{ iac_tools_vault_version }}"
    state: present
    update_cache: true
  become: true
  when: not ansible_check_mode and iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Hold terraform and vault package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  become: true
  loop:
    - terraform
    - vault
  when: iac_tools_terraform_enabled and not ansible_check_mode
  tags: [terraform, iac_tools]

- name: Get installed tflint version
  ansible.builtin.command: tflint --version
  register: iac_tools_tflint_current_version
  become: false
  changed_when: false
  failed_when: false
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Download tflint archive
  ansible.builtin.get_url:
    url: "https://github.com/terraform-linters/tflint/releases/download/v{{ iac_tools_tflint_version }}/tflint_linux_amd64.zip"
    dest: "/tmp/tflint_{{ iac_tools_tflint_version }}_linux_amd64.zip"
    mode: "0644"
  when: >-
    iac_tools_terraform_enabled and
    (iac_tools_tflint_current_version.rc != 0 or iac_tools_tflint_version not in iac_tools_tflint_current_version.stdout)
  tags: [terraform, iac_tools]

- name: Install tflint binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/tflint_{{ iac_tools_tflint_version }}_linux_amd64.zip"
    dest: /usr/local/bin/
    include:
      - tflint
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and iac_tools_terraform_enabled and
    (iac_tools_tflint_current_version.rc != 0 or iac_tools_tflint_version not in iac_tools_tflint_current_version.stdout)
  tags: [terraform, iac_tools]

- name: Get installed terraform-docs version
  ansible.builtin.command: terraform-docs --version
  register: iac_tools_terraform_docs_current_version
  become: false
  changed_when: false
  failed_when: false
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Download terraform-docs archive
  ansible.builtin.get_url:
    url: "https://github.com/terraform-docs/terraform-docs/releases/download/v{{ iac_tools_terraform_docs_version }}/{{ iac_tools_terraform_docs_archive }}"
    dest: "/tmp/{{ iac_tools_terraform_docs_archive }}"
    mode: "0644"
  when: >-
    iac_tools_terraform_enabled and
    (iac_tools_terraform_docs_current_version.rc != 0 or
     iac_tools_terraform_docs_version not in iac_tools_terraform_docs_current_version.stdout)
  tags: [terraform, iac_tools]

- name: Install terraform-docs binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/{{ iac_tools_terraform_docs_archive }}"
    dest: /usr/local/bin/
    include:
      - terraform-docs
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and iac_tools_terraform_enabled and
    (iac_tools_terraform_docs_current_version.rc != 0 or
     iac_tools_terraform_docs_version not in iac_tools_terraform_docs_current_version.stdout)
  tags: [terraform, iac_tools]

- name: Get installed tfswitch version
  ansible.builtin.command: tfswitch --version
  register: iac_tools_tfswitch_current_version
  become: false
  changed_when: false
  failed_when: false
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

# Pinned release + checksum-verified download, not the upstream shell
# installer (curl | bash against a mutable branch URL) — same tier-1
# get_url checksum pattern as tflint/terraform-docs above.
# warrensbox/terraform-switcher publishes a plain sha256sum-format
# checksums file per release.
- name: Download tfswitch archive
  ansible.builtin.get_url:
    url: "{{ iac_tools_tfswitch_download_base }}/{{ iac_tools_tfswitch_archive }}"
    dest: "/tmp/{{ iac_tools_tfswitch_archive }}"
    checksum: "sha256:{{ iac_tools_tfswitch_download_base }}/terraform-switcher_v{{ iac_tools_tfswitch_version }}_checksums.txt"
    mode: "0644"
  when: >-
    iac_tools_terraform_enabled and
    (iac_tools_tfswitch_current_version.rc != 0 or
     iac_tools_tfswitch_version not in iac_tools_tfswitch_current_version.stdout)
  tags: [terraform, iac_tools]

- name: Install tfswitch binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/{{ iac_tools_tfswitch_archive }}"
    dest: /usr/local/bin/
    include:
      - tfswitch
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and iac_tools_terraform_enabled and
    (iac_tools_tfswitch_current_version.rc != 0 or
     iac_tools_tfswitch_version not in iac_tools_tfswitch_current_version.stdout)
  tags: [terraform, iac_tools]

- name: Create Terraform plugin cache directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.terraform.d/plugin-cache"
    state: directory
    mode: "0755"
  become: false
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Create Terraform config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/terraform"
    state: directory
    mode: "0755"
  become: false
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Deploy terraformrc (plugin cache + Terraform Cloud credentials)
  ansible.builtin.template:
    src: terraformrc.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/terraform/terraformrc"
    mode: "0600"
  become: false
  no_log: true
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Deploy terraform shell integration snippet
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/terraform.zsh"
    mode: "0644"
    content: |
      # Terraform
      export TF_CLI_CONFIG_FILE="$HOME/.config/terraform/terraformrc"
      export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
      alias tfaa='terraform apply -auto-approve'
      alias tfsl='terraform state list'
      alias tfss='terraform state show'
  become: false
  when: iac_tools_terraform_enabled
  tags: [terraform, iac_tools]

- name: Deploy terraform proxy environment snippet
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/terraform-proxy.zsh"
    mode: "0644"
    content: |
      export TF_CLI_ARGS_init="-backend-config=skip_s3_checksum=true"
  become: false
  when: iac_tools_terraform_enabled and iac_tools_http_proxy != ''
  tags: [terraform, iac_tools]

- name: Create vault config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/vault"
    state: directory
    mode: "0700"
  become: false
  when: iac_tools_terraform_enabled and iac_tools_vault_addr != ''
  tags: [terraform, iac_tools]

- name: Deploy vault GitHub token credential file
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/vault/github_token"
    content: "{{ iac_tools_terraform_vault_github_token }}"
    mode: "0600"
  become: false
  no_log: true
  when: >-
    iac_tools_terraform_enabled and iac_tools_vault_addr != '' and
    iac_tools_terraform_vault_github_token != ''
  tags: [terraform, iac_tools]

- name: Deploy vault shell integration snippet
  ansible.builtin.template:
    src: vault.zsh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/vault.zsh"
    mode: "0644"
  become: false
  when: iac_tools_terraform_enabled and iac_tools_vault_addr != ''
  tags: [terraform, iac_tools]

