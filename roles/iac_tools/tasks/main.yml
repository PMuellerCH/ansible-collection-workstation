- name: Get installed kubectl version
  ansible.builtin.command: kubectl version --client
  register: iac_tools_kubectl_installed
  become: false
  changed_when: false
  failed_when: false
  when: iac_tools_kubernetes_tools_enabled
  tags: [kubernetes_tools, iac_tools]

- name: Download kubectl binary
  ansible.builtin.get_url:
    url: "{{ iac_tools_kubectl_url }}"
    dest: /usr/local/bin/kubectl
    checksum: "sha256:{{ lookup('url', iac_tools_kubectl_checksum_url) }}"
    mode: "0755"
    owner: root
    group: root
  become: true
  when: >-
    iac_tools_kubernetes_tools_enabled and
    (iac_tools_kubectl_installed.rc != 0 or iac_tools_kubectl_version not in iac_tools_kubectl_installed.stdout)
  tags: [kubernetes_tools, iac_tools]

- name: Get installed k9s version
  ansible.builtin.command: k9s version --short
  register: iac_tools_k9s_installed
  become: false
  changed_when: false
  failed_when: false
  when: iac_tools_kubernetes_tools_enabled
  tags: [kubernetes_tools, iac_tools]

- name: Download k9s archive
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/v{{ iac_tools_k9s_version }}/k9s_Linux_amd64.tar.gz"
    dest: "/tmp/k9s_{{ iac_tools_k9s_version }}_Linux_amd64.tar.gz"
    mode: "0644"
  when: >-
    iac_tools_kubernetes_tools_enabled and
    (iac_tools_k9s_installed.rc != 0 or iac_tools_k9s_version not in iac_tools_k9s_installed.stdout)
  tags: [kubernetes_tools, iac_tools]

- name: Install k9s binary
  ansible.builtin.unarchive:
    src: "/tmp/k9s_{{ iac_tools_k9s_version }}_Linux_amd64.tar.gz"
    dest: /usr/local/bin/
    include:
      - k9s
    remote_src: true
    mode: "0755"
