- name: Check if helm-diff plugin is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/helm/plugins/helm-diff"
  register: iac_tools_helm_diff_stat
  become: false
  when: iac_tools_kubernetes_tools_enabled
  tags: [kubernetes_tools, iac_tools]

# Required by the helm-diff plugin's own install hook (shells out to
# curl/wget internally) — not obvious from this role's own tasks, only
# surfaced by actually running the install for real. computer-setup's own
# base role happens to already install curl, but a reusable role can't
# assume that.
- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: >-
    iac_tools_kubernetes_tools_enabled and not ansible_check_mode and
    not iac_tools_helm_diff_stat.stat.exists
  tags: [kubernetes_tools, iac_tools]

- name: Install helm-diff plugin
  ansible.builtin.command:
    cmd: helm plugin install https://github.com/databus23/helm-diff --verify=false
  become: false
  when: >-
    not ansible_check_mode and iac_tools_kubernetes_tools_enabled and
    not iac_tools_helm_diff_stat.stat.exists
  changed_when: true
  # noqa: command-instead-of-module - helm plugin CLI; no Ansible module available
  tags: [kubernetes_tools, iac_tools]

- name: Install Python Kubernetes libraries via apt (Ubuntu)
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-jsonpatch
      - python3-hvac
      - python3-pyhcl
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: iac_tools_kubernetes_tools_enabled and ansible_facts['distribution'] == 'Ubuntu'
  tags: [kubernetes_tools, iac_tools]

- name: Inject Python Kubernetes libraries into ansible-core pipx venv (non-Ubuntu)
  # Also requires iac_tools_ansible_enabled — same rationale as the boto3
  # inject above.
  community.general.pipx:
    name: ansible-core
    state: inject
    inject_packages:
      - "kubernetes=={{ iac_tools_kubernetes_pip_kubernetes_version }}"
      - "jsonpatch=={{ iac_tools_kubernetes_pip_jsonpatch_version }}"
      - "hvac=={{ iac_tools_hvac_version }}"
      - "pyhcl=={{ iac_tools_kubernetes_pip_pyhcl_version }}"
  become: false
  when: >-
    not ansible_check_mode and iac_tools_kubernetes_tools_enabled and
    iac_tools_ansible_enabled and ansible_facts['distribution'] != 'Ubuntu'
  tags: [kubernetes_tools, iac_tools]

- name: Ensure ~/.kube directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.kube"
    state: directory
    mode: "0700"
  become: false
  when: iac_tools_kubernetes_tools_enabled
  tags: [kubernetes_tools, iac_tools]

- name: Deploy kubeconfig
  ansible.builtin.template:
    src: kube-config.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.kube/config"
    mode: "0600"
    force: false
  become: false
  when: iac_tools_kubernetes_tools_enabled and iac_tools_kubernetes_clusters | length > 0
  tags: [kubernetes_tools, iac_tools]

- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when: iac_tools_kubernetes_tools_enabled
  tags: [kubernetes_tools, iac_tools]

- name: Deploy kubernetes shell integration snippet
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kubernetes_tools.zsh"
    mode: "0644"
    content: |
      # krew PATH
      export PATH="${KREW_ROOT:-$HOME/.krew}/bin:$PATH"

      # Helm shell completion
      command -v helm &>/dev/null && source <(helm completion zsh)

      # Stern shell completion
      command -v stern &>/dev/null && source <(stern --completion=zsh)
  become: false
  when: iac_tools_kubernetes_tools_enabled
  tags: [kubernetes_tools, iac_tools]
