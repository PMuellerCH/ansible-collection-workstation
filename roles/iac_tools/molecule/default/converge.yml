---
- name: Converge
  hosts: all
  gather_facts: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
    HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
    HTTPS_PROXY: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
  vars:
    # Non-empty test data so the templated-config deploy path (not just the
    # empty-list skip path) is exercised for real. Fake account IDs / ARNs /
    # a placeholder base64 CA — none of this is real swisstopo data.
    iac_tools_aws_profiles:
      - name: default
        sso_start_url: "https://molecule-test.awsapps.com/start#/"
        sso_region: eu-central-1
        output: json
      - name: molecule-test
        sso_start_url: "https://molecule-test.awsapps.com/start#/"
        sso_role_name: AdministratorAccess
        sso_account_id: "123456789012"
        sso_region: eu-central-1
        region: eu-central-1
        output: json
    iac_tools_kubernetes_clusters:
      - context_name: molecule-test-dev
        cluster_name: dev
        region: eu-central-1
        account_id: "123456789012"
        certificate_authority_data: "TW9sZWN1bGUgdGVzdCBDQQ=="
        server: "https://molecule-test.eks.amazonaws.com"
        role_arn: "arn:aws:iam::123456789012:role/kubernetes-admins-dev"
        aws_profile: molecule-test
  roles:
    - role: swisstopo.workstation.iac_tools
