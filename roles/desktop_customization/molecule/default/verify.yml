---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert flameshot is installed
      ansible.builtin.assert:
        that: "'flameshot' in ansible_facts.packages"

    - name: Check flameshot dpkg selection
      ansible.builtin.command: dpkg --get-selections flameshot
      register: _desktop_customization_flameshot_selection
      changed_when: false

    - name: Assert flameshot package is held
      ansible.builtin.assert:
        that: "'hold' in _desktop_customization_flameshot_selection.stdout"

    - name: Check flameshot autostart entry was deployed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/flameshot.desktop"
      register: _desktop_customization_autostart

    - name: Assert flameshot autostart entry exists
      ansible.builtin.assert:
        that: _desktop_customization_autostart.stat.exists

    - name: Read GNOME dynamic-workspaces dconf key
      community.general.dconf:
        key: /org/gnome/mutter/dynamic-workspaces
        state: read
      register: _desktop_customization_dynamic_workspaces

    - name: Read GNOME num-workspaces dconf key
      community.general.dconf:
        key: /org/gnome/desktop/wm/preferences/num-workspaces
        state: read
      register: _desktop_customization_num_workspaces

    - name: Assert fixed-workspace dconf keys were set
      ansible.builtin.assert:
        that:
          - _desktop_customization_dynamic_workspaces.value == "false"
          - _desktop_customization_num_workspaces.value == "9"

    - name: Read GNOME flameshot custom keybinding name
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot/name
        state: read
      register: _desktop_customization_kb_name

    - name: Read GNOME flameshot custom keybinding command
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot/command
        state: read
      register: _desktop_customization_kb_command

    - name: Read GNOME flameshot custom keybinding binding
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot/binding
        state: read
      register: _desktop_customization_kb_binding

    - name: Assert flameshot GNOME custom keybinding was configured
      ansible.builtin.assert:
        that:
          - _desktop_customization_kb_name.value == "'Flameshot'"
          - _desktop_customization_kb_command.value == "'flameshot gui'"
          - _desktop_customization_kb_binding.value == "'Print'"

    - name: Read GNOME custom-keybindings registration list
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
        state: read
      register: _desktop_customization_kb_list

    - name: Assert flameshot keybinding path is registered
      ansible.builtin.assert:
        that: "'/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot/' in _desktop_customization_kb_list.value"

    - name: Assert the pre-existing unrelated keybinding was preserved (not overwritten)
      ansible.builtin.assert:
        that: "'/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/pre-existing-test/' in _desktop_customization_kb_list.value"

    - name: Read default GNOME screenshot keybinding
      community.general.dconf:
        key: /org/gnome/shell/keybindings/screenshot
        state: read
      register: _desktop_customization_default_screenshot_kb

    - name: Assert default GNOME screenshot keybinding was disabled
      ansible.builtin.assert:
        that: _desktop_customization_default_screenshot_kb.value == "@as []"

    - name: Check Flathub remote is configured
      ansible.builtin.command: flatpak remotes --system
      register: _desktop_customization_flatpak_remotes
      changed_when: false

    - name: Assert Flathub remote is present
      ansible.builtin.assert:
        that: "'flathub' in _desktop_customization_flatpak_remotes.stdout"

    - name: Check smile is installed via Flatpak
      ansible.builtin.command: flatpak info --system it.mijorus.smile
      register: _desktop_customization_smile_flatpak
      changed_when: false
      failed_when: false

    - name: Assert smile Flatpak is installed
      ansible.builtin.assert:
        that: _desktop_customization_smile_flatpak.rc == 0
