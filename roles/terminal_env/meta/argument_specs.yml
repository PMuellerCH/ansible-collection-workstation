---
argument_specs:
  main:
    short_description: >-
      Install and configure the daily terminal environment: zsh (with
      oh-my-zsh, powerlevel10k, and plugins), tmux (with TPM), and kitty —
      all Catppuccin Mocha themed.
    options:
      terminal_env_zsh_version:
        type: str
        required: false
        default: "5.9-6ubuntu2"
        description: zsh apt package version (deb datasource, Ubuntu Noble).
      terminal_env_zsh_omz_commit:
        type: str
        required: false
        default: "0912e05c0589d26ea20d79555487900880aad4d5"  # pragma: allowlist secret
        description: >-
          Pinned commit SHA of ohmyzsh/ohmyzsh used to fetch the install.sh
          installer (no tags/releases published upstream; not Renovate-tracked).
      terminal_env_zsh_powerlevel10k_version:
        type: str
        required: false
        default: "1.20.0"
        description: powerlevel10k theme version (github-tags romkatv/powerlevel10k).
      terminal_env_zsh_fzf_tab_version:
        type: str
        required: false
        default: "1.3.0"
        description: fzf-tab plugin version (github-tags Aloxaf/fzf-tab).
      terminal_env_zsh_autosuggestions_version:
        type: str
        required: false
        default: "0.7.1"
        description: zsh-autosuggestions plugin version (github-tags zsh-users/zsh-autosuggestions).
      terminal_env_zsh_syntax_highlighting_version:
        type: str
        required: false
        default: "0.8.0"
        description: zsh-syntax-highlighting plugin version (github-tags zsh-users/zsh-syntax-highlighting).
      terminal_env_tmux_version:
        type: str
        required: false
        default: "3.4-1ubuntu0.1"
        description: tmux apt package version (deb datasource, Ubuntu Noble).
      terminal_env_tmux_catppuccin_version:
        type: str
        required: false
        default: "2.3.0"
        description: Catppuccin tmux plugin version (github-releases catppuccin/tmux).
      terminal_env_kitty_version:
        type: str
        required: false
        default: "0.32.2-1ubuntu0.4"
        description: kitty apt package version (deb datasource, Ubuntu Noble).
