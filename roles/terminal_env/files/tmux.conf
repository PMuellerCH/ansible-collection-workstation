# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shell
set -g default-shell /usr/bin/zsh

# Terminal colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Kitty keyboard protocol (suppresses "application escape mode" warnings)
set -g extended-keys on
set -ga terminal-features 'xterm*:extkeys'

# Kitty graphics protocol passthrough (required for image.nvim inline images)
set -gq allow-passthrough on
set -g visual-activity off

# Mouse support
set -g mouse on

# Pane borders — heavy lines for better visibility
set -g pane-border-lines heavy

# Base index 1 for windows and panes
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-style pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation without prefix — smart: pass through to nvim when it is focused
# Uses #{pane_current_command} (tmux-native, no ps subprocess) for reliable detection
# Pairs with christoomey/vim-tmux-navigator plugin in neovim
bind -n C-h if -F "#{==:#{pane_current_command},nvim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{==:#{pane_current_command},nvim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{==:#{pane_current_command},nvim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{==:#{pane_current_command},nvim}" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if -F "#{==:#{pane_current_command},nvim}" "send-keys 'C-\\'" 'select-pane -l'

# Alt+1-9 to switch windows directly
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Split panes (preserve current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Ctrl+Alt+hjkl to open a new pane in that direction
bind -n C-M-l split-window -h  -c "#{pane_current_path}"
bind -n C-M-h split-window -hb -c "#{pane_current_path}"
bind -n C-M-j split-window -v  -c "#{pane_current_path}"
bind -n C-M-k split-window -vb -c "#{pane_current_path}"

# Alt+hjkl to resize the active pane
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# Prefix + Shift+hjkl to move (swap) the active pane in that direction
bind H swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'
bind L swap-pane -t '{right-of}' \; select-pane -t '{right-of}'

# Catppuccin theme (v2.x API) — manual install (recommended over TPM due to name conflicts)
# https://github.com/catppuccin/tmux#manual-recommended
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, [Z],}'
set -g @catppuccin_date_time_text ' %a %-d.%-m.%Y %H:%M'

# Load catppuccin plugin before status bar so @catppuccin_status_* variables are available
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Status bar
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right " | Continuum: #{continuum_status}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# tmux-continuum: auto-save every 15 min, restore on server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
