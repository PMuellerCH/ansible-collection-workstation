---
argument_specs:
  main:
    short_description: >-
      Install the Kiro CLI (kiro-cli) via its official installer and set its
      default behaviour: v3 agent engine, tool auto-search, and autonomous
      (trust-all-tools) mode wired into the `ki` shell alias. Also deploys a
      zsh conf.d snippet with `ki` (autonomous chat) and `kil` (login) aliases.
    options:
      kiro_cli_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure kiro-cli.
      kiro_cli_bin:
        type: str
        required: false
        default: "{{ ansible_facts['env']['HOME'] }}/.local/bin/kiro-cli"
        description: >-
          Absolute path to the kiro-cli binary. Used to detect an existing
          install and to invoke the binary by full path, since ~/.local/bin is
          not guaranteed to be on $PATH for a non-interactive Ansible run.
      kiro_cli_install_url:
        type: str
        required: false
        default: "https://cli.kiro.dev/install"
        description: >-
          URL of the official kiro-cli install script, downloaded and run when
          the binary is absent. Unpinned by necessity — kiro-cli is a
          self-updating binary with no versioned release asset to pin; see
          README.
      kiro_cli_update:
        type: bool
        required: false
        default: true
        description: >-
          When the binary is already present, run `kiro-cli update
          --non-interactive` to converge to the latest release. Set false to
          leave an existing install untouched.
      kiro_cli_agent_engine:
        type: str
        required: false
        default: v3
        description: >-
          Value for the global `chat.agentEngine` setting ("v3 cli"). Applied
          via `kiro-cli settings`.
      kiro_cli_tool_search_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Value for the global `toolSearch.enabled` setting ("autosearch for
          tools"). Applied via `kiro-cli settings`.
      kiro_cli_disable_trust_all_confirmation:
        type: bool
        required: false
        default: true
        description: >-
          Value for the global `chat.disableTrustAllConfirmation` setting. When
          true, the `ki` alias (which passes `--trust-all-tools`) starts
          autonomous chat without a per-launch confirmation prompt.
      kiro_cli_deploy_shell_aliases:
        type: bool
        required: false
        default: true
        description: >-
          Whether to deploy ~/.config/zsh/conf.d/kiro_cli.zsh with the chat and
          login aliases.
      kiro_cli_alias_chat:
        type: str
        required: false
        default: ki
        description: >-
          Alias name for `kiro-cli chat --trust-all-tools` (autonomous mode).
      kiro_cli_alias_login:
        type: str
        required: false
        default: kil
        description: Alias name for `kiro-cli login`.
