---
# ---- install ----
# kiro-cli is a per-user, self-updating binary that lives in ~/.local/bin, so
# every task here runs as the target user (become: false), never root, and
# calls the binary by its full path kiro_cli_bin (~/.local/bin is not on PATH
# for a non-interactive Ansible run — same reason iac_tools calls ansible-galaxy
# by full path).
- name: Detect whether kiro-cli is already installed
  ansible.builtin.stat:
    path: "{{ kiro_cli_bin }}"
  register: kiro_cli_stat
  become: false
  when: kiro_cli_enabled
  tags: [kiro_cli]

- name: Download the official kiro-cli install script
  # Unpinned remote source by necessity (see defaults/main.yml and README):
  # upstream ships no versioned asset to pin and checksum. Fetched to a file
  # under the user's cache (mode 0700, removed afterwards) rather than piped
  # straight into a shell, so the install step can be guarded against check
  # mode.
  ansible.builtin.get_url:
    url: "{{ kiro_cli_install_url }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.cache/kiro-cli-install.sh"
    mode: "0700"
    force: true
  become: false
  when:
    - kiro_cli_enabled
    - not ansible_check_mode
    - not kiro_cli_stat.stat.exists
  tags: [kiro_cli]

- name: Install kiro-cli via the official script
  # --force makes the installer non-interactive: without it the script prompts
  # on /dev/tty when a binary is already present (confirmed by reading the
  # upstream script). This task only runs when the binary is absent, but --force
  # keeps it safe against a stale/partial install and avoids any tty prompt on a
  # headless run.
  ansible.builtin.command:
    cmd: "bash {{ ansible_facts['env']['HOME'] }}/.cache/kiro-cli-install.sh --force"
  become: false
  register: kiro_cli_install
  changed_when: true
  when:
    - kiro_cli_enabled
    - not ansible_check_mode
    - not kiro_cli_stat.stat.exists
  tags: [kiro_cli]

- name: Remove the downloaded install script
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.cache/kiro-cli-install.sh"
    state: absent
  become: false
  when:
    - kiro_cli_enabled
    - not ansible_check_mode
    - not kiro_cli_stat.stat.exists
  tags: [kiro_cli]

- name: Re-detect kiro-cli after install
  # The settings tasks below need a working binary; confirm the installer
  # actually produced one rather than assuming it did.
  ansible.builtin.stat:
    path: "{{ kiro_cli_bin }}"
  register: kiro_cli_stat_post
  become: false
  when:
    - kiro_cli_enabled
    - not ansible_check_mode
  tags: [kiro_cli]

- name: Assert kiro-cli is present after install
  ansible.builtin.assert:
    that: kiro_cli_stat_post.stat.exists
    fail_msg: "kiro-cli was not found at {{ kiro_cli_bin }} after the install step."
  become: false
  when:
    - kiro_cli_enabled
    - not ansible_check_mode
  tags: [kiro_cli]

- name: Update kiro-cli to the latest release
  # Only when it was already present (a fresh install is latest by definition)
  # and the consumer opted in. A self-update is not configuration convergence,
  # so this never reports changed — it would otherwise flap Molecule idempotence
  # on whatever the update command prints.
  ansible.builtin.command:
    cmd: "{{ kiro_cli_bin }} update --non-interactive"
  become: false
  register: kiro_cli_update_run
  changed_when: false
  when:
    - kiro_cli_enabled
    - kiro_cli_update
    - not ansible_check_mode
    - kiro_cli_stat.stat.exists
  tags: [kiro_cli]

# ---- default behaviour settings ----
# Read each setting as JSON first and write only when the current value differs,
# so the role is idempotent. `kiro-cli settings <key> -f json` prints the value
# as JSON (e.g. "v3", true) and exits 0, or exits non-zero when the key is unset.
- name: Read current kiro-cli settings
  ansible.builtin.command: "{{ kiro_cli_bin }} settings {{ item.key }} -f json"
  loop:
    - { key: "chat.agentEngine", want: "{{ kiro_cli_agent_engine }}" }
    - { key: "toolSearch.enabled", want: "{{ kiro_cli_tool_search_enabled }}" }
    - { key: "chat.disableTrustAllConfirmation", want: "{{ kiro_cli_disable_trust_all_confirmation }}" }
  loop_control:
    label: "{{ item.key }}"
    loop_var: item
  register: kiro_cli_settings_read
  changed_when: false
  failed_when: false
  become: false
  when:
    - kiro_cli_enabled
    - not ansible_check_mode
  tags: [kiro_cli]

- name: Apply kiro-cli settings that differ from the desired value
  # A write runs only when the key is unset (read rc != 0) or its parsed JSON
  # value does not equal the desired value — an exact, type-aware comparison,
  # not a substring match on the human-readable "v3 (global)" output.
  ansible.builtin.command:
    cmd: "{{ kiro_cli_bin }} settings {{ item.item.key }} {{ item.item.want | string | lower if (item.item.want is boolean) else item.item.want }}"
  become: false
  changed_when: true
  loop: "{{ kiro_cli_settings_read.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - kiro_cli_enabled
    - not ansible_check_mode
    - item.rc != 0 or (item.stdout | from_json) != item.item.want
  tags: [kiro_cli]

# ---- shell integration ----
- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when:
    - kiro_cli_enabled
    - kiro_cli_deploy_shell_aliases
  tags: [kiro_cli]

- name: Deploy kiro-cli shell alias snippet
  ansible.builtin.template:
    src: kiro_cli.zsh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/kiro_cli.zsh"
    mode: "0644"
  become: false
  when:
    - kiro_cli_enabled
    - kiro_cli_deploy_shell_aliases
  tags: [kiro_cli]
