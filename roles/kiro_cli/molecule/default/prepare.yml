---
- name: Prepare
  hosts: all
  gather_facts: false
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
    HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
    HTTPS_PROXY: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
  tasks:
    # The upstream kiro-cli install script aborts in check_dependencies()
    # unless a downloader (curl or wget), unzip and sha256sum are all present
    # on Linux. The bare test image ships none of curl/wget/unzip, so the
    # installer fails with "Missing required dependencies: curl or wget unzip".
    # These are not something this role should install: on a real workstation
    # they come from the base role (and coreutils provides sha256sum). Provide
    # them here so Molecule exercises the actual install path.
    - name: Install kiro-cli installer dependencies
      ansible.builtin.apt:
        name:
          - curl
          - unzip
        state: present
        update_cache: true
      become: true
