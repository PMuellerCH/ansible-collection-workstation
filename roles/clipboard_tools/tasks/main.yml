---
# ---- wl-clipboard ----
- name: Install wl-clipboard
  ansible.builtin.apt:
    name: wl-clipboard
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: clipboard_tools_wl_clipboard_enabled
  tags: [wl-clipboard, clipboard_tools]

# ---- cliphist ----
- name: Get installed cliphist version
  ansible.builtin.command: cliphist version
  register: clipboard_tools_cliphist_current_version
  changed_when: false
  failed_when: false
  when: clipboard_tools_cliphist_enabled
  tags: [cliphist, clipboard_tools]

- name: Download cliphist binary
  ansible.builtin.get_url:
    url: "https://github.com/sentriz/cliphist/releases/download/v{{ clipboard_tools_cliphist_version }}/v{{ clipboard_tools_cliphist_version }}-linux-amd64"
    dest: "/tmp/cliphist-{{ clipboard_tools_cliphist_version }}"
    checksum: "{{ clipboard_tools_cliphist_checksum }}"
    mode: "0755"
  when: >-
    clipboard_tools_cliphist_enabled and
    (clipboard_tools_cliphist_current_version.rc != 0 or
     clipboard_tools_cliphist_version not in clipboard_tools_cliphist_current_version.stderr)
  tags: [cliphist, clipboard_tools]

- name: Install cliphist binary to /usr/local/bin
  ansible.builtin.command:
    cmd: install -m 0755 /tmp/cliphist-{{ clipboard_tools_cliphist_version }} /usr/local/bin/cliphist
  become: true
  when: >-
    not ansible_check_mode and
    clipboard_tools_cliphist_enabled and
    (clipboard_tools_cliphist_current_version.rc != 0 or
     clipboard_tools_cliphist_version not in clipboard_tools_cliphist_current_version.stderr)
  changed_when: true
  tags: [cliphist, clipboard_tools]
  # noqa: command-instead-of-module - copy remote_src=true triggers ansible-core _ansible_inject_invocation bug

# ---- clipse ----
- name: Get installed clipse version
  ansible.builtin.command: clipse -v
  register: clipboard_tools_clipse_current_version
  changed_when: false
  failed_when: false
  when: clipboard_tools_clipse_enabled
  tags: [clipse, clipboard_tools]

- name: Download clipse archive
  ansible.builtin.get_url:
    url: "{{ clipboard_tools_clipse_download_base }}/{{ clipboard_tools_clipse_archive }}"
    dest: "/tmp/clipse-{{ clipboard_tools_clipse_version }}-linux-wayland-amd64.tar.gz"
    # savedra1/clipse publishes a plain sha256sum-format checksums.txt per
    # release — get_url fetches and matches against it by the source URL's
    # basename, so there's no static checksum to keep in sync by hand when
    # Renovate bumps clipboard_tools_clipse_version.
    checksum: "sha256:{{ clipboard_tools_clipse_download_base }}/checksums.txt"
    mode: "0644"
  when: >-
    clipboard_tools_clipse_enabled and
    (clipboard_tools_clipse_current_version.rc != 0 or
     clipboard_tools_clipse_version not in clipboard_tools_clipse_current_version.stdout)
  tags: [clipse, clipboard_tools]

- name: Extract clipse binary from archive
  ansible.builtin.unarchive:
    src: "/tmp/clipse-{{ clipboard_tools_clipse_version }}-linux-wayland-amd64.tar.gz"
    dest: /tmp/
    include:
      - clipse-linux-wayland-amd64
    remote_src: true
  when: >-
    not ansible_check_mode and
    clipboard_tools_clipse_enabled and
    (clipboard_tools_clipse_current_version.rc != 0 or
     clipboard_tools_clipse_version not in clipboard_tools_clipse_current_version.stdout)
  tags: [clipse, clipboard_tools]

- name: Install clipse binary to /usr/local/bin
  ansible.builtin.command:
    cmd: install -m 0755 /tmp/clipse-linux-wayland-amd64 /usr/local/bin/clipse
  become: true
  when: >-
    not ansible_check_mode and
    clipboard_tools_clipse_enabled and
    (clipboard_tools_clipse_current_version.rc != 0 or
     clipboard_tools_clipse_version not in clipboard_tools_clipse_current_version.stdout)
  changed_when: true
  tags: [clipse, clipboard_tools]
  # noqa: command-instead-of-module - copy remote_src=true triggers ansible-core _ansible_inject_invocation bug

# ---- cliphist autostart (soft runtime dependency on wl-clipboard's
# wl-paste — see README "Soft cross-tool dependencies" for why this is
# documentation-only and not hard-gated on clipboard_tools_wl_clipboard_enabled) ----
- name: Create autostart directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart"
    state: directory
    mode: "0755"
  become: false
  when: clipboard_tools_cliphist_enabled
  tags: [cliphist, clipboard_tools]

- name: Deploy cliphist autostart entry
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/cliphist.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=cliphist daemon
      Exec=wl-paste --watch cliphist store
      Hidden=false
      NoDisplay=false
      X-GNOME-Autostart-enabled=true
  become: false
  when: clipboard_tools_cliphist_enabled
  tags: [cliphist, clipboard_tools]

# ---- shell integration ----
- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when: clipboard_tools_deploy_shell_aliases
  tags: [wl-clipboard, cliphist, clipse, clipboard_tools]

- name: Deploy clipboard_tools shell integration snippet
  ansible.builtin.template:
    src: clipboard_tools.zsh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/clipboard_tools.zsh"
    mode: "0644"
  become: false
  when: clipboard_tools_deploy_shell_aliases
  tags: [wl-clipboard, cliphist, clipse, clipboard_tools]
