---
# This role's tools ultimately talk to a Wayland compositor at runtime
# (wl-copy/wl-paste, cliphist's autostart daemon), which does not exist in a
# headless Docker container — same "can't fully exercise the runtime
# behavior in a headless container" constraint desktop_customization has for
# its GNOME dconf settings. This scenario verifies what can be checked
# without a real clipboard/compositor: binaries installed at the pinned
# versions (their --version/version subcommands run standalone, with no
# Wayland connection required — confirmed against the actual upstream
# binaries), the autostart .desktop file deployed with the expected content,
# and the shell integration snippet deployed — not actual clipboard
# behavior.
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert wl-clipboard is installed
      ansible.builtin.assert:
        that: "'wl-clipboard' in ansible_facts.packages"

    - name: Check wl-clipboard dpkg selection
      ansible.builtin.command: dpkg --get-selections wl-clipboard
      register: _clipboard_tools_wl_clipboard_selection
      changed_when: false

    - name: Assert wl-clipboard package is held
      ansible.builtin.assert:
        that: "'hold' in _clipboard_tools_wl_clipboard_selection.stdout"

    - name: Check cliphist runs
      ansible.builtin.command: cliphist version
      register: _clipboard_tools_cliphist_version
      changed_when: false

    - name: Assert cliphist reports the pinned version
      ansible.builtin.assert:
        # cliphist writes its version output to stderr, not stdout (same as
        # the current-version idempotency check in tasks/main.yml).
        that: "'0.7.0' in _clipboard_tools_cliphist_version.stderr"

    - name: Check clipse runs
      ansible.builtin.command: clipse -v
      register: _clipboard_tools_clipse_version
      changed_when: false

    - name: Assert clipse reports the pinned version
      ansible.builtin.assert:
        that: "'1.2.1' in _clipboard_tools_clipse_version.stdout"

    - name: Check cliphist autostart entry was deployed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/cliphist.desktop"
      register: _clipboard_tools_autostart

    - name: Assert cliphist autostart entry exists
      ansible.builtin.assert:
        that: _clipboard_tools_autostart.stat.exists

    - name: Read cliphist autostart entry content
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/cliphist.desktop"
      register: _clipboard_tools_autostart_content

    - name: Assert cliphist autostart entry shells out to wl-paste
      ansible.builtin.assert:
        that: "'Exec=wl-paste --watch cliphist store' in (_clipboard_tools_autostart_content.content | b64decode)"

    - name: Stat zsh alias snippet
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/clipboard_tools.zsh"
      register: _clipboard_tools_zsh_snippet

    - name: Assert zsh alias snippet was deployed
      ansible.builtin.assert:
        that: _clipboard_tools_zsh_snippet.stat.exists

    - name: Read zsh alias snippet content
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/clipboard_tools.zsh"
      register: _clipboard_tools_zsh_snippet_content

    - name: Assert zsh alias snippet contains the ch function and clipboard alias
      ansible.builtin.assert:
        that:
          - "'ch() {' in (_clipboard_tools_zsh_snippet_content.content | b64decode)"
          - "\"alias clipboard='clipse'\" in (_clipboard_tools_zsh_snippet_content.content | b64decode)"
