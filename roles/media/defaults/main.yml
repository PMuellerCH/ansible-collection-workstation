---
# media: graphics tools, beets, Spotify and Plex

# Whether to install Inkscape, GIMP and Pinta (Flatpak).
media_graphics_enabled: true

# Whether to install beets (pipx) and deploy its config.
media_beets_enabled: true

# Whether to install Spotify (Flatpak) and ncspot.
media_spotify_enabled: true

# Whether to install Plex Desktop and Plexamp (Flatpak).
media_plex_enabled: true

# renovate: datasource=pypi depName=beets
media_beets_version: "2.14.1"

# renovate: datasource=pypi depName=pyacoustid
media_beets_pyacoustid_version: "1.3.1"

# renovate: datasource=github-releases depName=hrkfdn/ncspot extractVersion=^v(?<version>.*)$
media_ncspot_version: "1.5.1"
media_ncspot_download_base: "https://github.com/hrkfdn/ncspot/releases/download/v{{ media_ncspot_version }}"
