---
- name: Install graphics tools
  ansible.builtin.apt:
    name:
      - inkscape
      - gimp
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Pinta is not packaged in apt on Ubuntu 24.04 (Noble); flatpak.yml bootstraps Flathub first.
- name: Install Pinta via Flatpak
  community.general.flatpak:
    name: com.github.PintaProject.Pinta
    state: present
    method: system
  become: true
