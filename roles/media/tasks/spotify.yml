---
- name: Install Spotify via Flatpak
  community.general.flatpak:
    name: com.spotify.Client
    state: present
    method: system
  become: true

- name: Get installed ncspot version
  ansible.builtin.command: ncspot --version
  register: media_ncspot_current_version
  changed_when: false
  failed_when: false

- name: Download ncspot
  ansible.builtin.get_url:
    url: "{{ media_ncspot_download_base }}/ncspot-v{{ media_ncspot_version }}-linux-x86_64.tar.gz"
    dest: "{{ media_dl_tmp.path }}/ncspot-v{{ media_ncspot_version }}.tar.gz"
    # hrkfdn/ncspot publishes a matching .sha256 file per asset; get_url fetches it and matches by the
    # source URL's basename, so there is no static checksum to keep in sync when Renovate bumps the version.
    checksum: "sha256:{{ media_ncspot_download_base }}/ncspot-v{{ media_ncspot_version }}-linux-x86_64.sha256"
    mode: "0644"
  when: media_ncspot_current_version.rc != 0 or media_ncspot_version not in media_ncspot_current_version.stdout

- name: Install ncspot binary
  ansible.builtin.unarchive:
    src: "{{ media_dl_tmp.path }}/ncspot-v{{ media_ncspot_version }}.tar.gz"
    dest: /usr/local/bin/
    include:
      - ncspot
    remote_src: true
    mode: "0755"
  become: true
  when: media_ncspot_current_version.rc != 0 or media_ncspot_version not in media_ncspot_current_version.stdout
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create ncspot config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ncspot"
    state: directory
    mode: "0755"

- name: Deploy ncspot config
  ansible.builtin.copy:
    src: ncspot_config.toml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/ncspot/config.toml"
    mode: "0644"
    force: false
