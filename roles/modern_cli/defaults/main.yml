modern_cli_moor_enabled: true
modern_cli_yazi_enabled: true

# Optional GitHub API token used only to raise the rate limit when resolving
# release-asset digests for tools that publish no checksum file (dust, jaq,
# moor, procs, xcp, yazi — see tasks/main.yml). Defaults to GH_TOKEN/GITHUB_TOKEN
# from the environment; unauthenticated (empty) still works but is subject to
# GitHub's 60 requests/hour per-IP limit. On GitHub Actions the workflow passes
# GITHUB_TOKEN; a consumer can override this with their own token.
modern_cli_github_api_token: "{{ lookup('ansible.builtin.env', 'GH_TOKEN') or lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"

# Pinned commit of catppuccin/bat (theme is fetched from an immutable ref, not the mutable "main" branch)
modern_cli_bat_theme_ref: "6810349b28055dce54076712fc05fc68da4b8ec0"  # pragma: allowlist secret
modern_cli_bat_theme_checksum: "sha256:395566f08ceb301b936b91c077690ef94f7aeb651b121553f201c99c2bd4aa77"

# renovate: datasource=github-releases depName=catppuccin/btop
modern_cli_btop_catppuccin_version: "1.0.0"
modern_cli_btop_catppuccin_checksum: "sha256:5331e055f239d2b42a15496905c6f357493940e1213cc91acfcba67b3fd7a281"

# renovate: datasource=github-releases depName=junegunn/fzf extractVersion=^v(?<version>.*)$
modern_cli_fzf_version: "0.74.5"

# renovate: datasource=github-releases depName=mfontanini/presenterm extractVersion=^v(?<version>.*)$
modern_cli_presenterm_version: "0.16.1"
modern_cli_presenterm_download_base: "https://github.com/mfontanini/presenterm/releases/download/v{{ modern_cli_presenterm_version }}"
modern_cli_presenterm_archive: "presenterm-{{ modern_cli_presenterm_version }}-x86_64-unknown-linux-gnu.tar.gz"

# renovate: datasource=npm depName=@mermaid-js/mermaid-cli
modern_cli_presenterm_mermaid_cli_version: "12.0.0"

# renovate: datasource=pypi depName=emoji-fzf
modern_cli_emoji_fzf_version: "0.12.0"

# Minimum pipx version community.general.pipx requires (Ubuntu 24.04's apt-provided
# pipx is only 1.4.3 — see README "pipx bootstrap" section). Same pattern as
# code_quality_tools_pipx_min_version; modern_cli bootstraps its own pipx
# since it cannot assume another role already upgraded it (role independence).
# renovate: datasource=pypi depName=pipx
modern_cli_pipx_min_version: "1.18.10"

# Pinned commit of catppuccin/delta (no releases/tags published — theme is
# fetched from an immutable ref, not the mutable "main" branch).
modern_cli_delta_catppuccin_ref: "011516f5d14f66b771b3e716f29c77231e008c74"  # pragma: allowlist secret
modern_cli_delta_catppuccin_checksum: "sha256:f0580ada6b1e3767b718b25116a2ababec314474a12d1a796c917ef93d63b455"

# renovate: datasource=github-releases depName=dalance/procs extractVersion=^v(?<version>.*)$
modern_cli_procs_version: "0.14.12"
# dalance/procs publishes no checksum file; the archive checksum is derived at
# run time from GitHub's per-asset digest (see tasks/main.yml).

# renovate: datasource=github-releases depName=bootandy/dust extractVersion=^v(?<version>.*)$
modern_cli_dust_version: "1.2.7"
# bootandy/dust publishes no checksum file; the .deb checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml), so there is no static
# checksum to keep in sync when Renovate bumps the version.

# renovate: datasource=github-releases depName=sachaos/viddy extractVersion=^v(?<version>.*)$
modern_cli_viddy_version: "1.3.1"

# renovate: datasource=github-releases depName=tarka/xcp extractVersion=^xcp-v(?<version>.*)$
modern_cli_xcp_version: "0.24.9"
