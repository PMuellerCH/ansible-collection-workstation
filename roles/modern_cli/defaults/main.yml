---
modern_cli_bat_enabled: true
modern_cli_btop_enabled: true
modern_cli_emoji_fzf_enabled: true
modern_cli_eza_enabled: true
modern_cli_fd_enabled: true
modern_cli_fzf_enabled: true
modern_cli_htop_enabled: true
modern_cli_presenterm_enabled: true
modern_cli_ripgrep_enabled: true
modern_cli_zoxide_enabled: true
modern_cli_sd_enabled: true
