# time from GitHub's per-asset digest (see tasks/main.yml).

# renovate: datasource=github-releases depName=mr-karan/doggo extractVersion=^v(?<version>.*)$
modern_cli_doggo_version: "1.4.2"

# renovate: datasource=github-releases depName=01mf02/jaq extractVersion=^v(?<version>.*)$
modern_cli_jaq_version: "3.1.2"
# 01mf02/jaq publishes no checksum file; the binary checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml).

# The upstream project (repo walles/moar) renamed the tool itself to "moor"
# to resolve a name clash — release assets and the installed binary are
# named "moor", not "moar", even though the GitHub repo path is unchanged.
# renovate: datasource=github-releases depName=walles/moar extractVersion=^v(?<version>.*)$
modern_cli_moor_version: "2.19.6"
# walles/moar publishes no checksum file; the binary checksum is derived at run
# time from GitHub's per-asset digest (see tasks/main.yml), so there is no static
# checksum to keep in sync when Renovate bumps the version.

