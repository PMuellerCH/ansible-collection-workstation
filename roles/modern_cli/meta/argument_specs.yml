---
argument_specs:
  main:
    short_description: >-
      Install a set of modern CLI tool replacements: bat, btop, emoji-fzf, eza,
      fd, fzf, htop, presenterm, ripgrep, zoxide — each independently
      toggleable. Catppuccin Mocha theming is applied to bat, btop, and fzf;
      the other tools have no themeable config.
    options:
      modern_cli_bat_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install bat.
      modern_cli_btop_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install btop.
      modern_cli_emoji_fzf_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Whether to install emoji-fzf via pipx (also gates the pipx bootstrap).
          Requires fzf and wl-copy (this collection's clipboard_tools role,
          clipboard_tools_wl_clipboard_enabled) at runtime for the deployed
          `emoji` shell function.
      modern_cli_eza_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install eza.
      modern_cli_fd_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install fd-find (and symlink it to fd).
      modern_cli_fzf_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install fzf.
      modern_cli_htop_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install htop.
      modern_cli_presenterm_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Whether to install presenterm (binary + mermaid-cli only; no
          neovim plugin integration — that's owned by the cli_dev_env role).
      modern_cli_ripgrep_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install ripgrep.
      modern_cli_zoxide_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install zoxide.
      modern_cli_bat_version:
        type: str
        required: false
        default: "0.24.0-1build1"
        description: Exact apt package version of bat to install (held after install).
      modern_cli_btop_version:
        type: str
        required: false
        default: "1.3.0-1"
        description: Exact apt package version of btop to install (held after install).
      modern_cli_bat_theme_ref:
        type: str
        required: false
        default: "6810349b28055dce54076712fc05fc68da4b8ec0"  # pragma: allowlist secret
        description: Pinned commit of catppuccin/bat the theme file is downloaded from (immutable, unlike the "main" branch).
      modern_cli_bat_theme_checksum:
        type: str
        required: false
        default: "sha256:395566f08ceb301b936b91c077690ef94f7aeb651b121553f201c99c2bd4aa77"
        description: Checksum of the bat theme file at modern_cli_bat_theme_ref, verified by get_url.
      modern_cli_btop_catppuccin_version:
        type: str
        required: false
        default: "1.0.0"
        description: Release tag of catppuccin/btop to download the Mocha theme archive from.
      modern_cli_btop_catppuccin_checksum:
        type: str
        required: false
        default: "sha256:5331e055f239d2b42a15496905c6f357493940e1213cc91acfcba67b3fd7a281"
        description: Checksum of the themes.tar.gz archive at modern_cli_btop_catppuccin_version, verified by get_url.
      modern_cli_eza_version:
        type: str
        required: false
        default: "0.18.2-1"
        description: Exact apt package version of eza to install (held after install).
      modern_cli_fd_version:
        type: str
        required: false
        default: "9.0.0-1"
        description: Exact apt package version of fd-find to install (held after install).
      modern_cli_htop_version:
        type: str
        required: false
        default: "3.3.0-4build1"
        description: Exact apt package version of htop to install (held after install).
      modern_cli_ripgrep_version:
        type: str
        required: false
        default: "14.1.0-1"
        description: Exact apt package version of ripgrep to install (held after install).
      modern_cli_zoxide_version:
        type: str
        required: false
        default: "0.9.3-1"
        description: Exact apt package version of zoxide to install (held after install).
      modern_cli_fzf_version:
        type: str
        required: false
        default: "0.74.2"
        description: fzf version (github-releases junegunn/fzf), installed from a checksum-verified binary tarball.
      modern_cli_presenterm_version:
        type: str
        required: false
        default: "0.16.1"
        description: presenterm version (github-releases mfontanini/presenterm), installed from a checksum-verified binary tarball.
      modern_cli_presenterm_download_base:
        type: str
        required: false
        default: "https://github.com/mfontanini/presenterm/releases/download/v{{ modern_cli_presenterm_version }}"
        description: Base URL the presenterm archive and its .sha512 checksum file are downloaded from, before the filename.
      modern_cli_presenterm_archive:
        type: str
        required: false
        default: "presenterm-{{ modern_cli_presenterm_version }}-x86_64-unknown-linux-gnu.tar.gz"
        description: Filename of the presenterm release archive to download.
      modern_cli_presenterm_mermaid_cli_version:
        type: str
        required: false
        default: "11.16.0"
        description: "@mermaid-js/mermaid-cli npm version, installed globally for presenterm's mermaid diagram rendering."
      modern_cli_presenterm_nodejs_version:
        type: str
        required: false
        default: "18.19.1+dfsg-6ubuntu5"
        description: Exact apt package version of nodejs to install (held after install), required for mermaid-cli.
      modern_cli_presenterm_npm_version:
        type: str
        required: false
        default: "9.2.0~ds1-2"
        description: Exact apt package version of npm to install (held after install); not pulled in automatically by nodejs (only a Suggests, not a Depends).
      modern_cli_emoji_fzf_version:
        type: str
        required: false
        default: "0.12.0"
        description: emoji-fzf version (pypi), installed via pipx.
      modern_cli_pipx_min_version:
        type: str
        required: false
        default: "1.7.1"
        description: >-
          pipx version (pypi) installed via pip --user to satisfy
          community.general.pipx's >= 1.7.0 requirement, since Ubuntu 24.04's
          apt-provided pipx is only 1.4.3. Only used when modern_cli_emoji_fzf_enabled.
      modern_cli_deploy_shell_aliases:
        type: bool
        required: false
        default: true
        description: >-
          Whether to deploy a zsh conf.d snippet (~/.config/zsh/conf.d/modern_cli.zsh)
          with aliases for each enabled tool.
