---
argument_specs:
  main:
    short_description: >-
      Install and Catppuccin-Mocha-theme a set of modern CLI tool replacements:
      bat, btop, eza, fd, ripgrep, zoxide — each independently toggleable.
    options:
      modern_cli_bat_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install bat.
      modern_cli_btop_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install btop.
      modern_cli_eza_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install eza.
      modern_cli_fd_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install fd-find (and symlink it to fd).
      modern_cli_ripgrep_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install ripgrep.
      modern_cli_zoxide_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install zoxide.
      modern_cli_bat_version:
        type: str
        required: false
        default: "0.24.0-1build1"
        description: Exact apt package version of bat to install (held after install).
      modern_cli_btop_version:
        type: str
        required: false
        default: "1.3.0-1"
        description: Exact apt package version of btop to install (held after install).
      modern_cli_btop_catppuccin_version:
        type: str
        required: false
        default: "1.0.0"
        description: Release tag of catppuccin/btop to download the Mocha theme archive from.
      modern_cli_eza_version:
        type: str
        required: false
        default: "0.18.2-1"
        description: Exact apt package version of eza to install (held after install).
      modern_cli_fd_version:
        type: str
        required: false
        default: "9.0.0-1"
        description: Exact apt package version of fd-find to install (held after install).
      modern_cli_ripgrep_version:
        type: str
        required: false
        default: "14.1.0-1"
        description: Exact apt package version of ripgrep to install (held after install).
      modern_cli_zoxide_version:
        type: str
        required: false
        default: "0.9.3-1"
        description: Exact apt package version of zoxide to install (held after install).
      modern_cli_deploy_shell_aliases:
        type: bool
        required: false
        default: true
        description: >-
          Whether to deploy a zsh conf.d snippet (~/.config/zsh/conf.d/modern_cli.zsh)
          with aliases for each enabled tool.
