# dust (github release .deb, no checksum file — static pin; still apt-held
# like any other installed .deb, same pattern as trivy in code_quality_tools)
- name: Get installed dust version
  ansible.builtin.command: dust --version
  register: modern_cli_dust_current_version
  changed_when: false
  failed_when: false
  when: modern_cli_dust_enabled
  tags: [dust, modern_cli]

- name: Download dust .deb
  ansible.builtin.get_url:
    url: "https://github.com/bootandy/dust/releases/download/v{{ modern_cli_dust_version }}/du-dust_{{ modern_cli_dust_version }}-1_amd64.deb"
    dest: "/tmp/du-dust_{{ modern_cli_dust_version }}_amd64.deb"
    checksum: "{{ modern_cli_dust_checksum }}"
    mode: "0644"
  when: >-
    modern_cli_dust_enabled and
    (modern_cli_dust_current_version.rc != 0 or
     modern_cli_dust_version not in modern_cli_dust_current_version.stdout)
  tags: [dust, modern_cli]

- name: Install dust
  ansible.builtin.apt:
    deb: "/tmp/du-dust_{{ modern_cli_dust_version }}_amd64.deb"
  become: true
  when: >-
    not ansible_check_mode and
    modern_cli_dust_enabled and
    (modern_cli_dust_current_version.rc != 0 or
     modern_cli_dust_version not in modern_cli_dust_current_version.stdout)
  tags: [dust, modern_cli]

# viddy (github release, per-asset .sha256 file — dynamic checksum)
- name: Get installed viddy version
  ansible.builtin.command: viddy --version
  register: modern_cli_viddy_current_version
  changed_when: false
  failed_when: false
  when: modern_cli_viddy_enabled
  tags: [viddy, modern_cli]

- name: Download viddy archive
  ansible.builtin.get_url:
    url: "{{ _modern_cli_viddy_release_base }}.tar.gz"
    dest: "/tmp/viddy-{{ modern_cli_viddy_version }}.tar.gz"
    # sachaos/viddy publishes a matching .sha256 file per release asset —
    # get_url fetches and verifies against it directly, so there's no static
    # checksum to keep in sync by hand when Renovate bumps
    # modern_cli_viddy_version.
    checksum: "sha256:{{ _modern_cli_viddy_release_base }}.sha256"
    mode: "0644"
  vars:
    _modern_cli_viddy_release_base: >-
      https://github.com/sachaos/viddy/releases/download/v{{ modern_cli_viddy_version }}/viddy-v{{ modern_cli_viddy_version }}-linux-x86_64
  when: >-
    modern_cli_viddy_enabled and
    (modern_cli_viddy_current_version.rc != 0 or
     modern_cli_viddy_version not in modern_cli_viddy_current_version.stdout)
  tags: [viddy, modern_cli]

- name: Install viddy binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/viddy-{{ modern_cli_viddy_version }}.tar.gz"
    dest: /usr/local/bin/
    include:
      - viddy
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and
    modern_cli_viddy_enabled and
    (modern_cli_viddy_current_version.rc != 0 or
     modern_cli_viddy_version not in modern_cli_viddy_current_version.stdout)
  tags: [viddy, modern_cli]

