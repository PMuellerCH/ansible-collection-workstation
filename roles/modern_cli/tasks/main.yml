# shell integration
- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  when: modern_cli_deploy_shell_aliases
  tags: [bat, btop, cli-tools, modern_cli]

- name: Deploy modern_cli shell aliases
  ansible.builtin.template:
    src: modern_cli.zsh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/modern_cli.zsh"
    mode: "0644"
  when: modern_cli_deploy_shell_aliases
  tags: [bat, btop, cli-tools, modern_cli]
