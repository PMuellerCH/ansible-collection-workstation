# fd
- name: Install fd-find
  ansible.builtin.apt:
    name: "fd-find={{ modern_cli_fd_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: modern_cli_fd_enabled
  tags: [cli-tools, modern_cli]

- name: Hold fd-find package version
  ansible.builtin.dpkg_selections:
    name: fd-find
    selection: hold
  become: true
  when: modern_cli_fd_enabled
  tags: [cli-tools, modern_cli]

- name: Create /usr/local/bin/fd symlink (fd-find installs as fdfind on Debian/Ubuntu)
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  become: true
  when: modern_cli_fd_enabled
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [cli-tools, modern_cli]

