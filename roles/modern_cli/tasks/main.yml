# doggo (github release, aggregate checksums.txt — dynamic checksum)
- name: Get installed doggo version
  ansible.builtin.command: doggo --version
  register: modern_cli_doggo_current_version
  changed_when: false
  failed_when: false
  when: modern_cli_doggo_enabled
  tags: [doggo, modern_cli]

- name: Download doggo archive
  ansible.builtin.get_url:
    url: "https://github.com/mr-karan/doggo/releases/download/v{{ modern_cli_doggo_version }}/doggo-linux-x86_64.tar.gz"
    dest: "/tmp/doggo-{{ modern_cli_doggo_version }}.tar.gz"
    # mr-karan/doggo publishes an aggregate, version-named checksums.txt per
    # release — get_url fetches it and matches the entry by the source URL's
    # basename, so there's no static checksum to keep in sync by hand when
    # Renovate bumps modern_cli_doggo_version.
    checksum: "sha256:https://github.com/mr-karan/doggo/releases/download/v{{ modern_cli_doggo_version }}/doggo_{{ modern_cli_doggo_version }}_checksums.txt"
    mode: "0644"
  when: >-
    modern_cli_doggo_enabled and
    (modern_cli_doggo_current_version.rc != 0 or
     modern_cli_doggo_version not in modern_cli_doggo_current_version.stdout)
  tags: [doggo, modern_cli]

- name: Install doggo binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/doggo-{{ modern_cli_doggo_version }}.tar.gz"
    dest: /usr/local/bin/
    include:
      - doggo
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and
    modern_cli_doggo_enabled and
    (modern_cli_doggo_current_version.rc != 0 or
     modern_cli_doggo_version not in modern_cli_doggo_current_version.stdout)
  tags: [doggo, modern_cli]

# jaq (github release, bare binary, no checksum file — static pin)
- name: Get installed jaq version
  ansible.builtin.command: jaq --version
  register: modern_cli_jaq_current_version
  changed_when: false
  failed_when: false
  when: modern_cli_jaq_enabled
  tags: [jaq, modern_cli]

- name: Install jaq binary to /usr/local/bin
  ansible.builtin.get_url:
    url: "https://github.com/01mf02/jaq/releases/download/v{{ modern_cli_jaq_version }}/jaq-x86_64-unknown-linux-gnu"
    dest: /usr/local/bin/jaq
    checksum: "{{ modern_cli_jaq_checksum }}"
    mode: "0755"
  become: true
  when: >-
    modern_cli_jaq_enabled and
    (modern_cli_jaq_current_version.rc != 0 or
     modern_cli_jaq_version not in modern_cli_jaq_current_version.stdout)
  tags: [jaq, modern_cli]

# moor (github release, bare binary, no checksum file — static pin; upstream
# renamed the tool itself from "moar" to "moor", see the version var comment
# in defaults/main.yml)
- name: Get installed moor version
  ansible.builtin.command: moor --version
  register: modern_cli_moor_current_version
  changed_when: false
  failed_when: false
  when: modern_cli_moor_enabled
  tags: [moor, modern_cli]

- name: Install moor binary to /usr/local/bin
  ansible.builtin.get_url:
    url: "https://github.com/walles/moar/releases/download/v{{ modern_cli_moor_version }}/moor-v{{ modern_cli_moor_version }}-linux-amd64"
    dest: /usr/local/bin/moor
    checksum: "{{ modern_cli_moor_checksum }}"
    mode: "0755"
  become: true
  when: >-
    modern_cli_moor_enabled and
    (modern_cli_moor_current_version.rc != 0 or
     modern_cli_moor_version not in modern_cli_moor_current_version.stdout)
  tags: [moor, modern_cli]

# yazi (github release .deb, no checksum file — static pin; installs both
# `yazi` and its companion `ya` CLI, apt-held like any other installed .deb,
# same pattern as trivy in code_quality_tools and dust above)
- name: Get installed yazi version
  ansible.builtin.command: yazi --version
  register: modern_cli_yazi_current_version
  changed_when: false
  failed_when: false
  when: modern_cli_yazi_enabled
  tags: [yazi, modern_cli]

- name: Download yazi .deb
  ansible.builtin.get_url:
    url: "https://github.com/sxyazi/yazi/releases/download/v{{ modern_cli_yazi_version }}/yazi-x86_64-unknown-linux-gnu.deb"
    dest: "/tmp/yazi_{{ modern_cli_yazi_version }}_amd64.deb"
    checksum: "{{ modern_cli_yazi_checksum }}"
    mode: "0644"
  when: >-
    modern_cli_yazi_enabled and
    (modern_cli_yazi_current_version.rc != 0 or
     modern_cli_yazi_version not in modern_cli_yazi_current_version.stdout)
  tags: [yazi, modern_cli]

- name: Install yazi
  ansible.builtin.apt:
    deb: "/tmp/yazi_{{ modern_cli_yazi_version }}_amd64.deb"
  become: true
  when: >-
    not ansible_check_mode and
    modern_cli_yazi_enabled and
    (modern_cli_yazi_current_version.rc != 0 or
     modern_cli_yazi_version not in modern_cli_yazi_current_version.stdout)
  tags: [yazi, modern_cli]

- name: Create yazi config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/yazi"
    state: directory
    mode: "0755"
  become: false
  when: modern_cli_yazi_enabled
  tags: [yazi, modern_cli]

- name: Deploy Catppuccin Mocha theme for yazi
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/catppuccin/yazi/{{ modern_cli_yazi_theme_ref }}/themes/mocha/catppuccin-mocha-mauve.toml"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/yazi/theme.toml"
    checksum: "{{ modern_cli_yazi_theme_checksum }}"
    mode: "0644"
  become: false
  when: modern_cli_yazi_enabled
  tags: [yazi, modern_cli]

# shell integration
- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  when: modern_cli_deploy_shell_aliases
  tags: [bat, btop, cli-tools, delta, doggo, dust, emoji_fzf, fzf, jaq, moor, presenterm, procs, viddy, xcp, yazi, modern_cli]

- name: Deploy modern_cli shell aliases
  ansible.builtin.template:
    src: modern_cli.zsh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/modern_cli.zsh"
    mode: "0644"
  become: false
  when: modern_cli_deploy_shell_aliases
  tags: [bat, btop, cli-tools, delta, doggo, dust, emoji_fzf, fzf, jaq, moor, presenterm, procs, viddy, xcp, yazi, modern_cli]
