# delta (apt package name git-delta, binary name delta) — includes Catppuccin
# Mocha theming via git config, since delta only has meaningful theming once
# wired into git itself (unlike bat/btop, which have standalone config files).
- name: Install delta
  ansible.builtin.apt:
    name: git-delta
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: modern_cli_delta_enabled
  tags: [delta, modern_cli]

- name: Create git conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/git"
    state: directory
    mode: "0755"
  become: false
  when: modern_cli_delta_enabled
  tags: [delta, modern_cli]

- name: Download Catppuccin Mocha theme for delta
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/catppuccin/delta/{{ modern_cli_delta_catppuccin_ref }}/catppuccin.gitconfig"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/catppuccin-delta.gitconfig"
    checksum: "{{ modern_cli_delta_catppuccin_checksum }}"
    mode: "0644"
  become: false
  when: modern_cli_delta_enabled
  tags: [delta, modern_cli]

- name: Include Catppuccin delta theme file in global gitconfig
  community.general.git_config:
    name: include.path
    value: "{{ ansible_facts['env']['HOME'] }}/.config/git/catppuccin-delta.gitconfig"
    scope: global
  become: false
  when: modern_cli_delta_enabled and not ansible_check_mode
  tags: [delta, modern_cli]

- name: Set delta as git's diff pager, with the Catppuccin Mocha theme
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become: false
  loop:
    - name: core.pager
      value: delta
    - name: delta.features
      value: catppuccin-mocha
  when: modern_cli_delta_enabled and not ansible_check_mode
  tags: [delta, modern_cli]

# procs (github release, no per-release checksum file — static pin)
- name: Install unzip (required to extract the procs zip archive)
  ansible.builtin.apt:
