    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: modern_cli_procs_enabled
  tags: [procs, modern_cli]

- name: Get installed procs version
  ansible.builtin.command: procs --version
  register: modern_cli_procs_current_version
  changed_when: false
  failed_when: false
  when: modern_cli_procs_enabled
  tags: [procs, modern_cli]

- name: Download procs archive
  ansible.builtin.get_url:
    url: "https://github.com/dalance/procs/releases/download/v{{ modern_cli_procs_version }}/procs-v{{ modern_cli_procs_version }}-x86_64-linux.zip"
    dest: "/tmp/procs-{{ modern_cli_procs_version }}.zip"
    checksum: "{{ modern_cli_procs_checksum }}"
    mode: "0644"
  when: >-
    modern_cli_procs_enabled and
    (modern_cli_procs_current_version.rc != 0 or
     modern_cli_procs_version not in modern_cli_procs_current_version.stdout)
  tags: [procs, modern_cli]

- name: Install procs binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/procs-{{ modern_cli_procs_version }}.zip"
    dest: /usr/local/bin/
    include:
