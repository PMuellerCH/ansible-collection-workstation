---
# Thin dispatcher: one task file per component, each behind its own switch.
# Tags use include_tasks' `apply:` so they reach the tasks inside the file.
#
# Release archives are staged in one private directory per run (mktemp -d,
# mode 0700, owned by the invoking user) instead of fixed /tmp paths, so another
# local user cannot pre-create or swap a file between the download and the
# root-level extract/install. It is removed again in `always`, also when a
# component fails.
- name: Run the desktop_integration tasks with a private download directory
  block:
    - name: Create private download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: desktop_integration_dl_
      register: desktop_integration_dl_tmp
      become: false
      # Directory creation that every download below depends on, so it also
      # runs in --check (the sanctioned check_mode: false exception). Reports
      # unchanged: it is scratch space, not managed state.
      check_mode: false
      changed_when: false
      tags: [always]

    - name: Configure workspaces and keybindings
      ansible.builtin.include_tasks:
        file: workspaces.yml
        apply:
          tags: [gui-customization, desktop_integration]
      when: desktop_integration_workspaces_enabled
      tags: [gui-customization, desktop_integration]

    - name: Install flameshot
      ansible.builtin.include_tasks:
        file: flameshot.yml
        apply:
          tags: [flameshot, gui-customization, desktop_integration]
      when: desktop_integration_flameshot_enabled
      tags: [flameshot, gui-customization, desktop_integration]

    - name: Install the smile emoji picker (Flatpak)
      ansible.builtin.include_tasks:
        file: smile.yml
        apply:
          tags: [emoji-picker, desktop_integration]
      when: desktop_integration_smile_enabled
      tags: [emoji-picker, desktop_integration]

    - name: Install wl-clipboard
      ansible.builtin.include_tasks:
        file: wl_clipboard.yml
        apply:
          tags: [wl-clipboard, desktop_integration]
      when: desktop_integration_wl_clipboard_enabled
      tags: [wl-clipboard, desktop_integration]

    - name: Install cliphist
      ansible.builtin.include_tasks:
        file: cliphist.yml
        apply:
          tags: [cliphist, desktop_integration]
      when: desktop_integration_cliphist_enabled
      tags: [cliphist, desktop_integration]

    - name: Install clipse
      ansible.builtin.include_tasks:
        file: clipse.yml
        apply:
          tags: [clipse, desktop_integration]
      when: desktop_integration_clipse_enabled
      tags: [clipse, desktop_integration]

    - name: Deploy the clipboard shell integration
      ansible.builtin.include_tasks:
        file: shell.yml
        apply:
          tags: [wl-clipboard, cliphist, clipse, desktop_integration]
      when: desktop_integration_deploy_shell_aliases
      tags: [wl-clipboard, cliphist, clipse, desktop_integration]
  rescue:
    - name: Report the failed desktop_integration task
      ansible.builtin.fail:
        msg: "A desktop_integration task failed ({{ ansible_failed_task.name | default('unknown task') }}): {{ ansible_failed_result.msg | default('see the preceding error') }}"
      # `always` so a tag-filtered run cannot skip this and swallow the failure.
      tags: [always]
  always:
    - name: Remove private download directory
      ansible.builtin.file:
        path: "{{ desktop_integration_dl_tmp.path }}"
        state: absent
      become: false
      check_mode: false
      changed_when: false
      when: desktop_integration_dl_tmp.path is defined
      tags: [always]
