---
# ---- clipse ----
- name: Get installed clipse version
  ansible.builtin.command: clipse -v
  register: desktop_integration_clipse_current_version
  changed_when: false
  failed_when: false
  when: desktop_integration_clipse_enabled
  tags: [clipse, desktop_integration]

- name: Download clipse archive
  ansible.builtin.get_url:
    url: "{{ desktop_integration_clipse_download_base }}/{{ desktop_integration_clipse_archive }}"
    dest: "/tmp/clipse-{{ desktop_integration_clipse_version }}-linux-wayland-amd64.tar.gz"
    # savedra1/clipse publishes a plain sha256sum-format checksums.txt per
    # release — get_url fetches and matches against it by the source URL's
    # basename, so there's no static checksum to keep in sync by hand when
    # Renovate bumps desktop_integration_clipse_version.
    checksum: "sha256:{{ desktop_integration_clipse_download_base }}/checksums.txt"
    mode: "0644"
  when: >-
    desktop_integration_clipse_enabled and
    (desktop_integration_clipse_current_version.rc != 0 or
     desktop_integration_clipse_version not in desktop_integration_clipse_current_version.stdout)
  tags: [clipse, desktop_integration]

- name: Extract clipse binary from archive
  ansible.builtin.unarchive:
    src: "/tmp/clipse-{{ desktop_integration_clipse_version }}-linux-wayland-amd64.tar.gz"
    dest: /tmp/
    include:
      - clipse-linux-wayland-amd64
    remote_src: true
  when: >-
    not ansible_check_mode and
    desktop_integration_clipse_enabled and
    (desktop_integration_clipse_current_version.rc != 0 or
     desktop_integration_clipse_version not in desktop_integration_clipse_current_version.stdout)
  tags: [clipse, desktop_integration]

- name: Install clipse binary to /usr/local/bin
  ansible.builtin.command:
    cmd: install -m 0755 /tmp/clipse-linux-wayland-amd64 /usr/local/bin/clipse
  become: true
  when: >-
    not ansible_check_mode and
    desktop_integration_clipse_enabled and
    (desktop_integration_clipse_current_version.rc != 0 or
     desktop_integration_clipse_version not in desktop_integration_clipse_current_version.stdout)
  changed_when: true
  tags: [clipse, desktop_integration]
  # noqa: command-instead-of-module - copy remote_src=true triggers ansible-core _ansible_inject_invocation bug
