---
# ---- base ----
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - yq
      - unzip
      - dnsutils
      - cifs-utils
      - pwgen
      - openssl
      - direnv
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [base]

- name: Install open-vm-tools (VMware guest utilities)
  ansible.builtin.apt:
    name: open-vm-tools
    state: present
  become: true
  when: ansible_virtualization_type == "VMware"
  tags: [base]

- name: Create autostart directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart"
    state: directory
    mode: "0755"
  become: false
  when: ansible_virtualization_type == "VMware"
  tags: [base]

- name: Deploy vmware-user autostart entry (clipboard integration)
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/vmware-user.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=VMware User Agent
      Exec=/usr/bin/vmware-user
      X-GNOME-Autostart-enabled=true
      NoDisplay=false
  become: false
  when: ansible_virtualization_type == "VMware"
  tags: [base]

- name: Remove update-notifier (suppresses GUI update popups)
  ansible.builtin.apt:
    name:
      - update-notifier
      - update-notifier-common
    state: absent
  become: true
  tags: [base]

- name: Disable apt periodic update checks
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99disable-periodic
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
      APT::Periodic::Unattended-Upgrade "0";
  become: true
  tags: [base]

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"
  become: true
  tags: [base]

- name: Install locale packages
  ansible.builtin.apt:
    name:
      - locales
      - hunspell-de-ch
      - hunspell-en-us
    state: present
  become: true
  tags: [base]

- name: Generate format locale
  community.general.locale_gen:
    name: "{{ base_locale_format }}"
    state: present
  become: true
  tags: [base]

- name: Generate UI locale
  community.general.locale_gen:
    name: "{{ base_locale_ui }}"
    state: present
  become: true
  tags: [base]

- name: Create zsh conf.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d"
    state: directory
    mode: "0755"
  become: false
  tags: [base]

- name: Deploy locale ZSH snippet
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/locale.zsh"
    mode: "0644"
    content: |
      export LANG="{{ base_locale_format }}"
      export LC_TIME="{{ base_locale_format }}"
      export LC_NUMERIC="{{ base_locale_format }}"
      export LC_MONETARY="{{ base_locale_format }}"
      export LC_PAPER="{{ base_locale_format }}"
      export LC_MEASUREMENT="{{ base_locale_format }}"
      export LANGUAGE="{{ base_locale_ui }}"
      export LC_MESSAGES="{{ base_locale_ui }}"
  become: false
  tags: [base]

- name: Deploy Vault ZSH snippet
  # Named base-vault.zsh (not vault.zsh) to avoid colliding with iac_tools'
  # own "Deploy vault shell integration snippet" task, which writes a richer
  # vault.zsh (VAULT_ADDR + VAULT_NAMESPACE + a vault-login() function) to
  # the same conf.d directory when terraform/vault are enabled. Both roles
  # are independent by design (see role-independence convention) and neither
  # can defer to the other, so distinct filenames are the only way to avoid
  # them perpetually overwriting each other's version of the same file.
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/base-vault.zsh"
    mode: "0644"
    content: |
      export VAULT_ADDR="{{ base_vault_addr }}"
  become: false
  when: base_vault_addr != ''
  tags: [base]

- name: Check for legacy vault.zsh from older base role versions
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/vault.zsh"
  register: base_legacy_vault_zsh
  become: false
  tags: [base]

- name: Read legacy vault.zsh content
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/vault.zsh"
  register: base_legacy_vault_zsh_content
  become: false
  when: base_legacy_vault_zsh.stat.exists
  tags: [base]

- name: Remove legacy vault.zsh written by older base role versions
  # Prior to the base-vault.zsh rename above (#124), this role wrote
  # directly to vault.zsh, colliding with iac_tools' own richer template of
  # the same name. Since ~/.config/zsh/conf.d/*.zsh files are all
  # auto-sourced, a leftover legacy vault.zsh from an older base run would
  # still be sourced and could override VAULT_ADDR with a stale value even
  # after upgrading to this fix. Only remove it when its content is exactly
  # the old base-only one-liner (no VAULT_NAMESPACE or vault-login
  # function), so an iac_tools-managed vault.zsh is never touched.
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/conf.d/vault.zsh"
    state: absent
  become: false
  when: >-
    base_legacy_vault_zsh.stat.exists and
    'VAULT_NAMESPACE' not in (base_legacy_vault_zsh_content.content | b64decode) and
    'vault-login' not in (base_legacy_vault_zsh_content.content | b64decode)
  tags: [base]

- name: Create environment.d directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/environment.d"
    state: directory
    mode: "0755"
  become: false
  tags: [base]

- name: Deploy locale environment.d config (GUI apps via systemd user session)
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/environment.d/locale.conf"
    mode: "0644"
    content: |
      LANG={{ base_locale_format }}
      LC_TIME={{ base_locale_format }}
      LC_NUMERIC={{ base_locale_format }}
      LC_MONETARY={{ base_locale_format }}
      LC_PAPER={{ base_locale_format }}
      LC_MEASUREMENT={{ base_locale_format }}
      LANGUAGE={{ base_locale_ui }}
      LC_MESSAGES={{ base_locale_ui }}
  become: false
  tags: [base]

# ---- Corporate proxy ----
# Deploys proxy env vars to the systemd user session (picked up by all GUI apps,
# including Electron apps like Slack) and to the Flatpak sandbox global override
# (picked up by Flatpak-sandboxed apps like Spotify).
# Only runs when base_http_proxy is set for the machine.

- name: Deploy proxy environment.d config (for all GNOME session apps)
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/environment.d/proxy.conf"
    mode: "0644"
    content: |
      http_proxy={{ base_http_proxy }}
      https_proxy={{ base_https_proxy }}
      HTTP_PROXY={{ base_http_proxy }}
      HTTPS_PROXY={{ base_https_proxy }}
      no_proxy={{ base_no_proxy }}
      NO_PROXY={{ base_no_proxy }}
  become: false
  when: base_http_proxy != ''
  tags: [base]

- name: Deploy proxy vars to /etc/environment (system-wide, PAM sessions)
  ansible.builtin.blockinfile:
    path: /etc/environment
    create: true
    mode: "0644"
    block: |
      http_proxy={{ base_http_proxy }}
      https_proxy={{ base_https_proxy }}
      HTTP_PROXY={{ base_http_proxy }}
      HTTPS_PROXY={{ base_https_proxy }}
      no_proxy={{ base_no_proxy }}
      NO_PROXY={{ base_no_proxy }}
  become: true
  when: base_http_proxy != ''
  tags: [base]

# ---- Corporate CA certificate ----
# The corporate proxy (BIT Proxy) performs TLS inspection and re-signs all
# HTTPS traffic with its own CA. Without the CA in the trust store, all HTTPS
# connections fail with "self-signed certificate" errors.
# CA 06 C is the currently active intermediate CA (valid until Sep 2026);
# the cert is bundled in the role's files/ directory and must be updated here
# when the corporate IT rotates to a new CA generation.

- name: Install corporate proxy CA certificate
  ansible.builtin.copy:
    src: BITProxyCA06C.crt
    dest: /usr/local/share/ca-certificates/BITProxyCA06C.crt
    mode: "0644"
  become: true
  when: base_http_proxy != ''
  notify: Update CA certificates
  tags: [base]

- name: Flush handlers (rebuild CA bundle before syncing to Flatpak path)
  ansible.builtin.meta: flush_handlers
  tags: [base]

- name: Create Flatpak CA bundle directory
  ansible.builtin.file:
    path: /var/lib/ca-certificates
    state: directory
    mode: "0755"
  become: true
  when: base_http_proxy != ''
  tags: [base]

- name: Stat system CA bundle
  ansible.builtin.stat:
    path: /etc/ssl/certs/ca-certificates.crt
    checksum_algorithm: sha256
  register: base_ca_bundle_source_stat
  when: base_http_proxy != ''
  tags: [base]

- name: Stat Flatpak-accessible CA bundle
  ansible.builtin.stat:
    path: /var/lib/ca-certificates/ca-bundle.crt
    checksum_algorithm: sha256
  register: base_ca_bundle_flatpak_stat
  when: base_http_proxy != ''
  tags: [base]

- name: Sync system CA bundle to Flatpak-accessible location
  ansible.builtin.command:
    cmd: install -m 0644 /etc/ssl/certs/ca-certificates.crt /var/lib/ca-certificates/ca-bundle.crt
  become: true
  when: >-
    base_http_proxy != '' and
    (not base_ca_bundle_flatpak_stat.stat.exists or
     base_ca_bundle_flatpak_stat.stat.checksum != base_ca_bundle_source_stat.stat.checksum)
  changed_when: true
  # noqa: command-instead-of-module - copy remote_src=true triggers ansible-core _ansible_inject_invocation bug
  tags: [base]

- name: Set NODE_EXTRA_CA_CERTS to Flatpak-accessible CA bundle
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^NODE_EXTRA_CA_CERTS='
    line: "NODE_EXTRA_CA_CERTS=/var/lib/ca-certificates/ca-bundle.crt"
    create: true
    mode: "0644"
  become: true
  when: base_http_proxy != ''
  tags: [base]

- name: Set UV_SYSTEM_CERTS so uv/uvx trust the OS CA store
  # uv/uvx use their own vendored CA bundle (via rustls) by default, not the
  # OS trust store this role installs the corporate CA into above — same
  # class of problem as Node.js above (NODE_EXTRA_CA_CERTS), just a
  # different opt-in mechanism. Without this, any uv/uvx invocation that
  # needs to fetch a package (e.g. `uvx <pypi-package>`, or a uvx-launched
  # MCP server) fails with "invalid peer certificate: UnknownIssuer".
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^UV_SYSTEM_CERTS='
    line: "UV_SYSTEM_CERTS=1"
    create: true
    mode: "0644"
  become: true
  when: base_http_proxy != ''
  tags: [base]

- name: Create Flatpak system overrides directory
  ansible.builtin.file:
    path: /var/lib/flatpak/overrides
    state: directory
    mode: "0755"
  become: true
  when: base_http_proxy != ''
  tags: [base]

- name: Deploy Flatpak system proxy override (for Flatpak-sandboxed apps)
  ansible.builtin.copy:
    dest: /var/lib/flatpak/overrides/global
    mode: "0644"
    content: |
      [Context]
      filesystems=/var/lib/ca-certificates:ro

      [Environment]
      http_proxy={{ base_http_proxy }}
      https_proxy={{ base_https_proxy }}
      HTTP_PROXY={{ base_http_proxy }}
      HTTPS_PROXY={{ base_https_proxy }}
      no_proxy={{ base_no_proxy }}
      NO_PROXY={{ base_no_proxy }}
      SSL_CERT_FILE=/var/lib/ca-certificates/ca-bundle.crt
      NODE_EXTRA_CA_CERTS=/var/lib/ca-certificates/ca-bundle.crt
  become: true
  when: base_http_proxy != ''
  tags: [base]

- name: Deploy npm proxy configuration (~/.npmrc)
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.npmrc"
    mode: "0600"
    content: |
      proxy={{ base_http_proxy }}
      https-proxy={{ base_https_proxy }}
      fetch-retries=3
      fetch-retry-mintimeout=5000
      fetch-retry-maxtimeout=15000
  become: false
  when: base_http_proxy != ''
  tags: [base]

- name: Configure GNOME system proxy via dconf
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  become: false
  vars:
    base_proxy_ignore_hosts_list: "{{ base_no_proxy.split(',') | map('trim') | reject('equalto', '') | list }}"
  loop:
    - key: /org/gnome/system/proxy/mode
      value: "'manual'"
    - key: /org/gnome/system/proxy/http/enabled
      value: "true"
    - key: /org/gnome/system/proxy/http/host
      value: "'{{ base_http_proxy | urlsplit('hostname') }}'"
    - key: /org/gnome/system/proxy/http/port
      value: "{{ base_http_proxy | urlsplit('port') }}"
    - key: /org/gnome/system/proxy/https/host
      value: "'{{ base_https_proxy | urlsplit('hostname') }}'"
    - key: /org/gnome/system/proxy/https/port
      value: "{{ base_https_proxy | urlsplit('port') }}"
    - key: /org/gnome/system/proxy/ignore-hosts
      # GVariant can't infer a type for a bare empty array literal ("[]") —
      # it needs the "@as" (array-of-strings) type annotation. Only matters
      # when base_no_proxy is empty, which is the common single-proxy case.
      value: >-
        {{ '@as ' ~ (base_proxy_ignore_hosts_list | to_json)
           if base_proxy_ignore_hosts_list | length == 0
           else base_proxy_ignore_hosts_list | to_json }}
  when: base_http_proxy != '' and base_desktop_environment == 'gnome'
  tags: [base]

# ---- git ----
- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [git]

- name: Configure git user name
  community.general.git_config:
    name: user.name
    value: "{{ base_git_user_name }}"
    scope: global
  become: false
  tags: [git]

- name: Configure git user email
  community.general.git_config:
    name: user.email
    value: "{{ base_git_user_email }}"
    scope: global
  become: false
  tags: [git]

- name: Configure git default branch
  community.general.git_config:
    name: init.defaultBranch
    value: "{{ base_git_default_branch }}"
    scope: global
  become: false
  tags: [git]

- name: Configure git pull strategy
  community.general.git_config:
    name: pull.rebase
    value: "{{ base_git_pull_rebase | ternary('true', 'false') }}"
    scope: global
  become: false
  tags: [git]

- name: Configure git push default
  community.general.git_config:
    name: push.default
    value: "{{ base_git_push_default }}"
    scope: global
  become: false
  tags: [git]

- name: Set core editor
  community.general.git_config:
    name: core.editor
    value: "{{ base_git_editor }}"
    scope: global
  become: false
  tags: [git]

- name: Configure git gpg format to ssh
  community.general.git_config:
    name: gpg.format
    value: ssh
    scope: global
  become: false
  when: base_git_signing_enabled
  tags: [git]

- name: Configure git signing key
  community.general.git_config:
    name: user.signingkey
    value: "{{ base_git_signing_key }}"
    scope: global
  become: false
  when: base_git_signing_enabled
  tags: [git]

- name: Configure git commit auto-signing
  community.general.git_config:
    name: commit.gpgsign
    value: "true"
    scope: global
  become: false
  when: base_git_signing_enabled
  tags: [git]

- name: Configure git tag auto-signing
  community.general.git_config:
    name: tag.gpgSign
    value: "true"
    scope: global
  become: false
  when: base_git_signing_enabled
  tags: [git]

# ---- ssh ----
- name: Create ~/.ssh directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"
  become: false
  tags: [ssh]

- name: Create ~/.config/ssh directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ssh"
    state: directory
    mode: "0755"
  become: false
  tags: [ssh]

- name: Deploy SSH config
  ansible.builtin.copy:
    src: ssh_config
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/ssh/config"
    mode: "0600"
    force: false
  become: false
  tags: [ssh]

- name: Stat ~/.ssh/config
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
  register: base_ssh_config_stat
  become: false
  tags: [ssh]

- name: Symlink ~/.ssh/config → ~/.config/ssh/config
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/ssh/config"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    state: link
    force: true
  become: false
  when: >-
    not ansible_check_mode and
    (not base_ssh_config_stat.stat.exists or base_ssh_config_stat.stat.islnk)
  tags: [ssh]

- name: Check if id_ed25519 key exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
  register: base_ssh_id_ed25519_key
  become: false
  tags: [ssh]

- name: Fix SSH private key permissions if key exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
    mode: "0600"
  become: false
  when: base_ssh_id_ed25519_key.stat.exists
  tags: [ssh]

- name: Check if sysadmin_key exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/sysadmin_key"
  register: base_ssh_sysadmin_key
  become: false
  tags: [ssh]

- name: Fix sysadmin_key permissions
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/sysadmin_key"
    mode: "0600"
  become: false
  when: base_ssh_sysadmin_key.stat.exists
  tags: [ssh]

- name: Add extra host entries to SSH config
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ssh/config"
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ item.name }}"
    block: |
      Host {{ item.name }}
            HostName {{ item.hostname }}
            User {{ item.user }}
            {% if item.identity_file is defined %}IdentityFile {{ item.identity_file }}
            {% endif %}
  become: false
  loop: "{{ base_ssh_extra_hosts }}"
  tags: [ssh]

# ---- python ----
- name: Install Python toolchain
  ansible.builtin.apt:
    name:
      - build-essential
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [python]

- name: Get installed uv version
  ansible.builtin.command: uv --version
  register: base_python_uv_installed_version
  changed_when: false
  failed_when: false
  tags: [python]

- name: Download uv archive
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ base_python_uv_version }}/uv-x86_64-unknown-linux-musl.tar.gz"
    dest: "/tmp/uv-{{ base_python_uv_version }}.tar.gz"
    # uv publishes a matching .sha256 file per release asset — get_url fetches
    # and verifies against it directly, so there's no static checksum to keep
    # in sync by hand when Renovate bumps base_python_uv_version.
    checksum: "sha256:https://github.com/astral-sh/uv/releases/download/{{ base_python_uv_version }}/uv-x86_64-unknown-linux-musl.tar.gz.sha256"
    mode: "0644"
  when: base_python_uv_installed_version.rc != 0 or base_python_uv_version not in base_python_uv_installed_version.stdout
  tags: [python]

- name: Install uv and uvx to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/uv-{{ base_python_uv_version }}.tar.gz"
    dest: /usr/local/bin/
    include:
      - "uv-x86_64-unknown-linux-musl/uv"
      - "uv-x86_64-unknown-linux-musl/uvx"
    extra_opts: ["--strip-components=1"]
    remote_src: true
    mode: "0755"
  become: true
  when: >-
    not ansible_check_mode and
    (base_python_uv_installed_version.rc != 0 or base_python_uv_version not in base_python_uv_installed_version.stdout)
  tags: [python]

# ---- fonts ----
- name: Install font dependencies
  ansible.builtin.apt:
    name:
      - fontconfig
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [fonts]

- name: Create user fonts directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
    state: directory
    mode: "0755"
  become: false
  tags: [fonts]

- name: Check nerd fonts version stamp
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/.nerd-fonts-version"
  register: base_fonts_version_stat
  become: false
  tags: [fonts]

- name: Read nerd fonts version stamp
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/.nerd-fonts-version"
  register: base_fonts_installed_version
  become: false
  when: base_fonts_version_stat.stat.exists
  tags: [fonts]

- name: Download JetBrainsMono Nerd Font
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ base_fonts_nerd_font_version }}/JetBrainsMono.zip"
    dest: "/tmp/JetBrainsMono.zip"
    # nerd-fonts publishes an aggregate SHA-256.txt per release — get_url
    # fetches it and matches the JetBrainsMono.zip entry directly, so there's
    # no static checksum to keep in sync by hand when Renovate bumps
    # base_fonts_nerd_font_version.
    checksum: "sha256:https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ base_fonts_nerd_font_version }}/SHA-256.txt"
    mode: "0644"
  when: not base_fonts_version_stat.stat.exists or (base_fonts_installed_version.content | b64decode | trim) != base_fonts_nerd_font_version
  tags: [fonts]

- name: Unarchive JetBrainsMono Nerd Font
  ansible.builtin.unarchive:
    src: "/tmp/JetBrainsMono.zip"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/"
    remote_src: true
  become: false
  when: >-
    not ansible_check_mode and
    (not base_fonts_version_stat.stat.exists or (base_fonts_installed_version.content | b64decode | trim) != base_fonts_nerd_font_version)
  tags: [fonts]

- name: Write nerd fonts version stamp
  ansible.builtin.copy:
    content: "{{ base_fonts_nerd_font_version }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/.nerd-fonts-version"
    mode: "0644"
  become: false
  when: >-
    not ansible_check_mode and
    (not base_fonts_version_stat.stat.exists or (base_fonts_installed_version.content | b64decode | trim) != base_fonts_nerd_font_version)
  tags: [fonts]

- name: Refresh font cache
  ansible.builtin.command: fc-cache -fv
  changed_when: true
  when: >-
    not ansible_check_mode and
    (not base_fonts_version_stat.stat.exists or (base_fonts_installed_version.content | b64decode | trim) != base_fonts_nerd_font_version)
  tags: [fonts]
