---
# Thin dispatcher: one task file per component. Tags use include_tasks' `apply:`
# so they reach the tasks inside the file. The old `base` tag still selects everything.
- name: Install base packages, set hostname and locale
  ansible.builtin.include_tasks:
    file: system.yml
    apply:
      tags: [system, base]
  tags: [system, base]

- name: Configure the corporate proxy and CA certificate
  ansible.builtin.include_tasks:
    file: proxy.yml
    apply:
      tags: [proxy, base]
  tags: [proxy, base]

- name: Configure SSH
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: [ssh, base]
  tags: [ssh, base]

- name: Install the Python toolchain (uv)
  ansible.builtin.include_tasks:
    file: python.yml
    apply:
      tags: [python, base]
  tags: [python, base]

- name: Install Node.js (NodeSource)
  ansible.builtin.include_tasks:
    file: nodejs.yml
    apply:
      tags: [nodejs, base]
  when: base_nodejs_enabled
  tags: [nodejs, base]

- name: Install fonts
  ansible.builtin.include_tasks:
    file: fonts.yml
    apply:
      tags: [fonts, base]
  tags: [fonts, base]
