---
- name: Converge
  hosts: all
  gather_facts: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
    HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
    HTTPS_PROXY: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
  roles:
    - role: pmuellerch.workstation.base
      vars:
        base_hostname: molecule-base
        base_git_user_name: Molecule Test
        base_git_user_email: molecule@example.com
        # base_http_proxy is intentionally left empty: the corporate-proxy path
        # (CA cert install, Flatpak overrides, npmrc, dconf) installs a CA cert
        # that collides with the /etc/ssl/certs/ca-certificates.crt:ro bind
        # mount above (needed so other tasks can reach GitHub through a real
        # corporate proxy in CI) — update-ca-certificates cannot replace a
        # read-only-mounted file. Untested here; same gap as the rest of this
        # collection.
