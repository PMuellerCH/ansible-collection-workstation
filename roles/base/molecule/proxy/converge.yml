---
- name: Converge
  hosts: all
  gather_facts: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') }}"
    https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
    HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
    HTTPS_PROXY: "{{ lookup('env', 'https_proxy') or lookup('env', 'http_proxy') }}"
  roles:
    - role: pmuellerch.workstation.base
      vars:
        base_hostname: molecule-base-proxy
        base_git_user_name: Molecule Test
        base_git_user_email: molecule@example.com
        # Deliberately the real host proxy (this CI/dev host already sits
        # behind it) so the role's own corporate-proxy path — CA install,
        # /etc/environment, npmrc, Flatpak override, GNOME dconf — is
        # actually exercised, instead of being skipped like in the default
        # scenario.
        base_http_proxy: "{{ lookup('env', 'http_proxy') }}"
