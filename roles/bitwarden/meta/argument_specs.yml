---
argument_specs:
  main:
    short_description: Install the Bitwarden GUI and rbw CLI, configured for bitwarden.eu
    options:
      bitwarden_version:
        type: str
        required: false
        description: Bitwarden GUI version (GitHub release tag desktop-v<version>), see defaults/main.yml
      bitwarden_rbw_version:
        type: str
        required: false
        description: rbw CLI version (GitHub release tag), see defaults/main.yml
      bitwarden_email:
        type: str
        required: false
        default: ""
        description: Email address written into rbw's config.json for bitwarden.eu login
