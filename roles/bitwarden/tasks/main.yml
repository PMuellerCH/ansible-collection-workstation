---
# --- Bitwarden GUI ---
#
# Release archives are staged in one private directory per run (mktemp -d,
# mode 0700, owned by the invoking user) instead of fixed /tmp paths, so another
# local user cannot pre-create or swap a file between the download and the
# root-level extract/install. It is removed again in `always`, also when a
# component fails.
- name: Run the bitwarden tasks with a private download directory
  block:
    - name: Create private download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: bitwarden_dl_
      register: bitwarden_dl_tmp
      become: false
      # Directory creation that every download below depends on, so it also
      # runs in --check (the sanctioned check_mode: false exception). Reports
      # unchanged: it is scratch space, not managed state.
      check_mode: false
      changed_when: false
      tags: [always]


    - name: Get installed Bitwarden GUI version
      ansible.builtin.command: dpkg-query -W -f='${Version}' bitwarden
      register: bitwarden_current_version
      changed_when: false
      failed_when: false

    - name: Download Bitwarden .deb
      ansible.builtin.get_url:
        url: "https://github.com/bitwarden/clients/releases/download/desktop-v{{ bitwarden_version }}/oss-Bitwarden-{{ bitwarden_version }}-amd64.deb"
        dest: "{{ bitwarden_dl_tmp.path }}/Bitwarden-{{ bitwarden_version }}-amd64.deb"
        mode: "0644"
      when: bitwarden_current_version.rc != 0 or bitwarden_version not in bitwarden_current_version.stdout

    - name: Install Bitwarden GUI
      ansible.builtin.apt:
        deb: "{{ bitwarden_dl_tmp.path }}/Bitwarden-{{ bitwarden_version }}-amd64.deb"
      become: true
      when: >-
        not ansible_check_mode and
        (bitwarden_current_version.rc != 0 or bitwarden_version not in bitwarden_current_version.stdout)

    # --- rbw (Bitwarden TUI / CLI) ---

    - name: Get installed rbw version
      ansible.builtin.command: rbw --version
      register: bitwarden_rbw_current_version
      changed_when: false
      failed_when: false

    - name: Download rbw archive
      ansible.builtin.get_url:
        url: "https://github.com/doy/rbw/releases/download/{{ bitwarden_rbw_version }}/rbw_{{ bitwarden_rbw_version }}_linux_amd64.tar.gz"
        dest: "{{ bitwarden_dl_tmp.path }}/rbw_{{ bitwarden_rbw_version }}_linux_amd64.tar.gz"
        mode: "0644"
      when: bitwarden_rbw_current_version.rc != 0 or bitwarden_rbw_version not in bitwarden_rbw_current_version.stdout

    - name: Install rbw binary
      ansible.builtin.unarchive:
        src: "{{ bitwarden_dl_tmp.path }}/rbw_{{ bitwarden_rbw_version }}_linux_amd64.tar.gz"
        dest: /usr/local/bin/
        include:
          - rbw
          - rbw-agent
        remote_src: true
        mode: "0755"
      become: true
      when: >-
        not ansible_check_mode and
        (bitwarden_rbw_current_version.rc != 0 or bitwarden_rbw_version not in bitwarden_rbw_current_version.stdout)

    # --- rbw config (bitwarden.eu server) ---

    - name: Create rbw config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/rbw"
        state: directory
        mode: "0700"

    - name: Configure rbw for bitwarden.eu
      ansible.builtin.template:
        src: rbw_config.json.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/rbw/config.json"
        mode: "0600"
        force: false
  rescue:
    - name: Report the failed bitwarden task
      ansible.builtin.fail:
        msg: "A bitwarden task failed ({{ ansible_failed_task.name | default('unknown task') }}): {{ ansible_failed_result.msg | default('see the preceding error') }}"
      # `always` so a tag-filtered run cannot skip this and swallow the failure.
      tags: [always]
  always:
    - name: Remove private download directory
      ansible.builtin.file:
        path: "{{ bitwarden_dl_tmp.path }}"
        state: absent
      become: false
      check_mode: false
      changed_when: false
      when: bitwarden_dl_tmp.path is defined
      tags: [always]
