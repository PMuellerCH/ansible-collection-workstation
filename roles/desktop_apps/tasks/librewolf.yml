---
# --- librewolf (opt-in alternative browser) ---
- name: Install extrepo (repository manager LibreWolf's apt repo is distributed through)
  ansible.builtin.apt:
    name: extrepo
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: desktop_apps_librewolf_enabled
  tags: [librewolf, desktop_apps]

- name: Check if the LibreWolf extrepo source is already enabled
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/extrepo_librewolf.sources
  register: desktop_apps_librewolf_extrepo_stat
  when: desktop_apps_librewolf_enabled
  tags: [librewolf, desktop_apps]

- name: Enable the LibreWolf extrepo source
  # extrepo has no dedicated Ansible module; it fetches the repository's
  # signed policy (URL + GPG key) from extrepo's own curated index and
  # writes /etc/apt/sources.list.d/extrepo_librewolf.sources — no manual
  # key/sources-file handling needed, unlike Brave above. Needs real
  # network access (skipped under --check, same as the apt repo tasks
  # above), and is guarded by the stat check so it only ever runs once.
  ansible.builtin.command: extrepo enable librewolf
  become: true
  changed_when: true
  when: >-
    not ansible_check_mode and
    desktop_apps_librewolf_enabled and
    not desktop_apps_librewolf_extrepo_stat.stat.exists
  # noqa: command-instead-of-module - extrepo has no Ansible module; this is its own CLI's documented interface
  tags: [librewolf, desktop_apps]

- name: Install LibreWolf
  ansible.builtin.apt:
    name: librewolf
    state: present
    update_cache: true
  become: true
  when: desktop_apps_librewolf_enabled and not ansible_check_mode
  tags: [librewolf, desktop_apps]

- name: Create LibreWolf policies directory
  ansible.builtin.file:
    path: /etc/librewolf/policies
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: desktop_apps_librewolf_enabled
  tags: [librewolf, desktop_apps]

- name: Deploy LibreWolf policies (Bitwarden and uBlock Origin extensions, de-CH dictionary, password manager disabled)
  # LibreWolf is a Firefox fork and reads the identical Mozilla policies.json
  # schema from its own /etc/librewolf/policies/ path — the same template
  # Firefox uses above is reused as-is, not duplicated.
  ansible.builtin.template:
    src: policies.json.j2
    dest: /etc/librewolf/policies/policies.json
    owner: root
    group: root
    mode: "0644"
  become: true
  when: desktop_apps_librewolf_enabled
  tags: [librewolf, desktop_apps]
