---
# flatpak/flathub bootstrap (needed for slack; self-contained per role independence)
- name: Install flatpak and xdg-utils
  ansible.builtin.apt:
    name:
      - flatpak
      - xdg-utils
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: desktop_apps_slack_enabled
  tags: [slack, desktop_apps]

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: system
  become: true
  when: desktop_apps_slack_enabled
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slack, desktop_apps]

# slack
- name: Install Slack via Flatpak
  community.general.flatpak:
    name: com.slack.Slack
    state: present
    method: system
  become: true
  when: desktop_apps_slack_enabled
  tags: [slack, desktop_apps]
