---
argument_specs:
  main:
    short_description: >-
      Install standard/mainstream desktop applications: OnlyOffice Desktop
      Editors, Firefox policies, and the opt-in alternative browsers Brave
      and LibreWolf — each independently toggleable.
    options:
      desktop_apps_onlyoffice_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install OnlyOffice Desktop Editors.
      desktop_apps_firefox_enabled:
        type: bool
        required: false
        default: true
        description: Whether to deploy system-wide Firefox policies.
      desktop_apps_brave_enabled:
        type: bool
        required: false
        default: false
        description: >-
          Whether to install Brave as an opt-in alternative browser, with
          crypto wallet/rewards features disabled via managed policy.
          Default false — Firefox stays the default for every consumer of
          this role unless explicitly toggled on.
      desktop_apps_librewolf_enabled:
        type: bool
        required: false
        default: false
        description: >-
          Whether to install LibreWolf as an opt-in alternative browser
          (via extrepo). Default false — Firefox stays the default for
          every consumer of this role unless explicitly toggled on.
