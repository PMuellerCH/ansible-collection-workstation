---
argument_specs:
  main:
    short_description: >-
      Install desktop applications: OnlyOffice, Firefox policies, Brave, LibreWolf, Slack and Microsoft Teams —
      each independently toggleable.
    options:
      desktop_apps_onlyoffice_enabled:
        default: true
        description: Whether to install OnlyOffice Desktop Editors.
        required: false
        type: bool
      desktop_apps_firefox_enabled:
        default: true
        description: Whether to deploy system-wide Firefox policies.
        required: false
        type: bool
      desktop_apps_brave_enabled:
        default: false
        description: Whether to install Brave as an opt-in alternative browser, with crypto wallet/rewards features disabled via managed policy. Default
          false — Firefox stays the default for every consumer of this role unless explicitly toggled on.
        required: false
        type: bool
      desktop_apps_librewolf_enabled:
        default: false
        description: Whether to install LibreWolf as an opt-in alternative browser (via extrepo). Default false — Firefox stays the default for every consumer
          of this role unless explicitly toggled on.
        required: false
        type: bool
      desktop_apps_slack_enabled:
        default: true
        description: Whether to install Slack (also gates the Flatpak/Flathub bootstrap).
        required: false
        type: bool
      desktop_apps_teams_enabled:
        default: true
        description: Whether to install teams-for-linux.
        required: false
        type: bool
      desktop_apps_teams_version:
        description: teams-for-linux version (github-releases IsmaelMartinez/teams-for-linux).
        required: false
        type: str
      desktop_apps_teams_download_base:
        default: https://github.com/IsmaelMartinez/teams-for-linux/releases/download/v{{ desktop_apps_teams_version }}
        description: Base URL the teams-for-linux .deb is downloaded from, before the filename.
        required: false
        type: str
