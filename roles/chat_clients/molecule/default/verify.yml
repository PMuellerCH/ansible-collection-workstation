---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert teams-for-linux is installed
      ansible.builtin.assert:
        that: "'teams-for-linux' in ansible_facts.packages"

    - name: Check Flathub remote is configured
      ansible.builtin.command: flatpak remotes --system
      register: _chat_clients_flatpak_remotes
      changed_when: false

    - name: Assert Flathub remote is present
      ansible.builtin.assert:
        that: "'flathub' in _chat_clients_flatpak_remotes.stdout"

    - name: Check Slack is installed via Flatpak
      ansible.builtin.command: flatpak info --system com.slack.Slack
      register: _chat_clients_slack_flatpak
      changed_when: false
      failed_when: false

    - name: Assert Slack Flatpak is installed
      ansible.builtin.assert:
        that: _chat_clients_slack_flatpak.rc == 0
