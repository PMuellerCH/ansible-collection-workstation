---
# flatpak/flathub bootstrap (needed for slack; self-contained per role independence)
- name: Install flatpak and xdg-utils
  ansible.builtin.apt:
    name:
      - flatpak
      - xdg-utils
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: chat_clients_slack_enabled
  tags: [slack, chat_clients]

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: system
  become: true
  when: chat_clients_slack_enabled
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slack, chat_clients]

# slack
- name: Install Slack via Flatpak
  community.general.flatpak:
    name: com.slack.Slack
    state: present
    method: system
  become: true
  when: chat_clients_slack_enabled
  tags: [slack, chat_clients]

# teams
- name: Get installed teams-for-linux version
  ansible.builtin.command: dpkg-query -W -f='${Version}' teams-for-linux
  register: chat_clients_teams_current_version
  changed_when: false
  failed_when: false
  when: chat_clients_teams_enabled
  tags: [teams, chat_clients]

- name: Fetch teams-for-linux release checksum metadata
  # electron-builder publishes this alongside every release with a sha512
  # (base64) per asset — used to verify the .deb wasn't corrupted/tampered
  # with in transit. Fetched fresh each run so it always matches whatever
  # chat_clients_teams_version Renovate has pinned, with no separate
  # checksum value to keep in sync by hand. Uses get_url (not uri) so it
  # goes through chat_clients_teams_download_base like the .deb download
  # itself — a consumer overriding that var (mirror, offline cache) gets a
  # checksum that's still guaranteed to match what was actually downloaded.
  ansible.builtin.get_url:
    url: "{{ chat_clients_teams_download_base }}/latest-linux.yml"
    dest: "/tmp/teams-for-linux-{{ chat_clients_teams_version }}-latest-linux.yml"
    mode: "0644"
  when: >-
    chat_clients_teams_enabled and
    (chat_clients_teams_current_version.rc != 0 or
     chat_clients_teams_version not in chat_clients_teams_current_version.stdout)
  tags: [teams, chat_clients]

- name: Read teams-for-linux release checksum metadata
  # get_url reports changed but doesn't actually write the file under
  # --check, so this (and everything downstream that depends on the file
  # existing) must be skipped in check mode rather than hard-fail.
  ansible.builtin.slurp:
    src: "/tmp/teams-for-linux-{{ chat_clients_teams_version }}-latest-linux.yml"
  register: chat_clients_teams_release_metadata
  when: >-
    not ansible_check_mode and
    chat_clients_teams_enabled and
    (chat_clients_teams_current_version.rc != 0 or
     chat_clients_teams_version not in chat_clients_teams_current_version.stdout)
  tags: [teams, chat_clients]

- name: Determine expected checksum (base64 sha512) for the .deb asset
  ansible.builtin.set_fact:
    chat_clients_teams_sha512_b64: >-
      {{ (chat_clients_teams_release_metadata.content | b64decode | from_yaml).files
         | selectattr('url', 'equalto', 'teams-for-linux_' ~ chat_clients_teams_version ~ '_amd64.deb')
         | map(attribute='sha512') | first | default('', true) }}
  when: >-
    not ansible_check_mode and
    chat_clients_teams_enabled and
    (chat_clients_teams_current_version.rc != 0 or
     chat_clients_teams_version not in chat_clients_teams_current_version.stdout)
  tags: [teams, chat_clients]

- name: Assert the expected checksum was found in the release metadata
  ansible.builtin.assert:
    that: chat_clients_teams_sha512_b64 | length > 0
    fail_msg: >-
      No sha512 entry for teams-for-linux_{{ chat_clients_teams_version }}_amd64.deb
      found in latest-linux.yml — upstream may have changed the release
      metadata format or asset naming.
  when: >-
    not ansible_check_mode and
    chat_clients_teams_enabled and
    (chat_clients_teams_current_version.rc != 0 or
     chat_clients_teams_version not in chat_clients_teams_current_version.stdout)
  tags: [teams, chat_clients]

- name: Convert expected checksum to hex (get_url requires hex, metadata is base64)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import base64,sys; print(base64.b64decode(sys.argv[1]).hex())
      - "{{ chat_clients_teams_sha512_b64 }}"
  register: chat_clients_teams_sha512_hex
  changed_when: false
  when: >-
    not ansible_check_mode and
    chat_clients_teams_enabled and
    (chat_clients_teams_current_version.rc != 0 or
     chat_clients_teams_version not in chat_clients_teams_current_version.stdout)
  tags: [teams, chat_clients]

- name: Download teams-for-linux .deb
  ansible.builtin.get_url:
    url: "{{ chat_clients_teams_download_base }}/teams-for-linux_{{ chat_clients_teams_version }}_amd64.deb"
    dest: "/tmp/teams-for-linux_{{ chat_clients_teams_version }}_amd64.deb"
    checksum: "sha512:{{ chat_clients_teams_sha512_hex.stdout | trim }}"
    mode: "0644"
  when: >-
    not ansible_check_mode and
    chat_clients_teams_enabled and
    (chat_clients_teams_current_version.rc != 0 or
     chat_clients_teams_version not in chat_clients_teams_current_version.stdout)
  tags: [teams, chat_clients]

- name: Install teams-for-linux
  ansible.builtin.apt:
    deb: "/tmp/teams-for-linux_{{ chat_clients_teams_version }}_amd64.deb"
  become: true
  when: >-
    not ansible_check_mode and
    chat_clients_teams_enabled and
    (chat_clients_teams_current_version.rc != 0 or
     chat_clients_teams_version not in chat_clients_teams_current_version.stdout)
  tags: [teams, chat_clients]
