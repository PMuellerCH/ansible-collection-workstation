---
- name: Install GitHub CLI
  ansible.builtin.apt:
    name: "gh={{ gh_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: gh

- name: Hold gh package version
  ansible.builtin.dpkg_selections:
    name: gh
    selection: hold
  become: true
  tags: gh
