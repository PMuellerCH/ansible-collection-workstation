---
# Thin dispatcher: one task file per component, each behind its own switch.
# Tags use include_tasks' `apply:` so they reach the tasks inside the file.
#
# Release archives are staged in one private directory per run (mktemp -d,
# mode 0700, owned by the invoking user) instead of fixed /tmp paths, so another
# local user cannot pre-create or swap a file between the checksum-verified
# download and the root-level extract/install. It is removed again in `always`,
# also when a component fails.
- name: Install the ansible_dev components in a private download directory
  block:
    - name: Create private download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible_dev_dl_
      register: ansible_dev_dl_tmp
      become: false
      # Directory creation that every download below depends on, so it also
      # runs in --check (the sanctioned check_mode: false exception). Reports
      # unchanged: it is scratch space, not managed state.
      check_mode: false
      changed_when: false
      tags: [always]

    - name: Install ansible-core (pipx) and Galaxy collections
      ansible.builtin.include_tasks:
        file: ansible.yml
        apply:
          tags: [ansible, ansible_dev]
      when: ansible_dev_ansible_enabled
      tags: [ansible, ansible_dev]

    - name: Install Docker CE
      ansible.builtin.include_tasks:
        file: docker.yml
        apply:
          tags: [docker, ansible_dev]
      when: ansible_dev_docker_enabled
      tags: [docker, ansible_dev]

    - name: Install act (run GitHub Actions locally)
      ansible.builtin.include_tasks:
        file: act.yml
        apply:
          tags: [act, ansible_dev]
      when: ansible_dev_act_enabled
      tags: [act, ansible_dev]
  rescue:
    - name: Report the failed ansible_dev component
      ansible.builtin.fail:
        msg: "A ansible_dev component failed ({{ ansible_failed_task.name | default('unknown task') }}): {{ ansible_failed_result.msg | default('see the preceding error') }}"
      # `always` so a tag-filtered run cannot skip this and swallow the failure.
      tags: [always]
  always:
    - name: Remove private download directory
      ansible.builtin.file:
        path: "{{ ansible_dev_dl_tmp.path }}"
        state: absent
      become: false
      check_mode: false
      changed_when: false
      when: ansible_dev_dl_tmp.path is defined
      tags: [always]
