---
collections:
  # Required by the molecule docker driver
  # renovate: datasource=ansible-galaxy depName=community.docker
  - name: community.docker
    version: "5.2.2"
  # Required by molecule-plugins[docker]'s own create.yml (ansible.posix.synchronize)
  # when a scenario sets override_command: false (e.g. systemd-capable images) —
  # not needed by every scenario, but installed for all since it's cheap and this
  # file is shared across the whole matrix.
  # renovate: datasource=ansible-galaxy depName=ansible.posix
  - name: ansible.posix
    version: "2.2.2"
