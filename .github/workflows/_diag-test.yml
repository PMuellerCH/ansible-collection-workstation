---
name: Diagnostic Test

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test composite action cross-repo
        uses: PMuellerCH/shared-actions/.github/actions/ansible-setup@v1
        with:
          python-version: "3.14"
          requirements-file: ".github/requirements.txt"
