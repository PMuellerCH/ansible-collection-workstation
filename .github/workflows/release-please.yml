---
name: Release Please

"on":
  push:
    branches: [main]

jobs:
  release:
    uses: swisstopo/infra-github-shared-actions/.github/workflows/ansible_release_collection.yml@main
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}  # pragma: allowlist secret
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}  # pragma: allowlist secret
