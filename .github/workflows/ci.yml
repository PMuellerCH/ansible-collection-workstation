---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Python tools
        run: pip install -r .github/requirements.txt

      - name: Cache Ansible collections and roles
        id: ansible-cache
        uses: actions/cache@v5
        with:
          path: ~/.ansible
          key: ansible-${{ hashFiles('requirements.yml') }}

      - name: Install this collection
        run: ansible-galaxy collection install . --force

      - name: Install collection dependencies
        if: steps.ansible-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v5
        with:
          path: .github/node_modules
          key: node-modules-${{ hashFiles('.github/package-lock.json') }}

      - name: Install Node.js tools
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix .github

      - name: yamllint
        run: yamllint --config-file .yamllint.yml .

      - name: ansible-lint
        run: ansible-lint
        env:
          ANSIBLE_PYTHON_INTERPRETER: auto_silent

      - name: markdownlint
        run: npx --prefix .github markdownlint --config .markdownlint.yml '**/*.md'

      - name: checkov
        run: checkov --framework ansible --directory . --quiet
