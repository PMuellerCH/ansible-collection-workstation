---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: yamllint
        uses: frenck/action-yamllint@v1.5.0
        with:
          config: .yamllint.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache Ansible collections and roles
        id: ansible-cache
        uses: actions/cache@v5
        with:
          path: ~/.ansible
          key: ansible-${{ hashFiles('requirements.yml') }}

      - name: Install this collection
        run: ansible-galaxy collection install . --force

      - name: Install collection dependencies
        if: steps.ansible-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml
        continue-on-error: true

      - name: ansible-lint
        uses: ansible/ansible-lint@v26.6.0

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

      - name: checkov
        uses: bridgecrewio/checkov-action@v12.3112.0
        with:
          framework: ansible
          directory: .
          quiet: true
