---
name: Molecule

# Auto-discovers any role under roles/ with a molecule/default/ scenario and runs
# `molecule test` for it as a matrix. Fires on the release-please PR and on
# Renovate PRs (so a release is never cut without molecule passing, and so
# Renovate automerge's "tests pass" gate is real rather than vacuous) or manual
# dispatch — not on every ordinary feature PR, since a full molecule run is too
# slow/expensive to gate routine iteration. Those get fast lint-only feedback
# from ci.yml instead.
#
# For Renovate PRs specifically, only test the role(s) whose own files actually
# changed (not the full matrix) — a Renovate PR only ever touches one role's
# defaults/main.yml (or occasionally a shared file). README.md and meta/
# changes within a role don't count either: every role here has an empty
# dependencies: [] (galaxy_info is purely descriptive), so neither affects
# runtime behavior molecule would catch. A change to a shared file
# (requirements-molecule.yml, .github/requirements.txt, galaxy.yml) still runs
# the full matrix, since those affect every role's test environment.
# Release-please and workflow_dispatch always run the full suite regardless:
# release-please's own diff is just CHANGELOG.md/version bumps, but it's the
# last gate before tagging a release that may include role changes merged via
# ordinary feature PRs, which never ran molecule at merge time.

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed roles
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.resolve.outputs.roles }}
    steps:
      # fetch-depth: 0 + token: '' (below) forces dorny/paths-filter to diff via
      # local git instead of the GitHub REST API. The API path needs
      # pull-requests: read, which GitHub silently downgrades to read-only
      # regardless of declared permissions when the PR modifies a workflow file
      # itself (a real case here: Renovate bumping this action's own pin).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List all roles
        id: list-roles
        shell: bash
        run: |
          all=$(for d in roles/*/; do basename "$d"; done | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "all=$all" >> "$GITHUB_OUTPUT"

      - name: Generate per-role and shared path filters
        id: gen-filters
        shell: bash
        run: |
          {
            echo "filters<<FILTERS_EOF"
            echo "shared:"
            echo "  - 'requirements-molecule.yml'"
            echo "  - '.github/requirements.txt'"
            echo "  - 'galaxy.yml'"
            for d in roles/*/; do
              role=$(basename "$d")
              echo "$role:"
              echo "  - 'roles/$role/**'"
              echo "  - '!roles/$role/README.md'"
              echo "  - '!roles/$role/meta/**'"
            done
            echo "FILTERS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ""
          predicate-quantifier: some-with-excludes
          filters: ${{ steps.gen-filters.outputs.filters }}

      - name: Resolve final role list
        id: resolve
        shell: bash
        env:
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          CHANGED_ROLES: ${{ steps.filter.outputs.changes }}
          ALL_ROLES: ${{ steps.list-roles.outputs.all }}
        run: |
          if [ "$SHARED_CHANGED" = "true" ]; then
            echo "A shared file changed — testing every role."
            echo "roles=$ALL_ROLES" >> "$GITHUB_OUTPUT"
          else
            roles=$(echo "$CHANGED_ROLES" | jq -c '[.[] | select(. != "shared")]')
            echo "Role-specific changes detected: $roles"
            echo "roles=$roles" >> "$GITHUB_OUTPUT"
          fi

  molecule:
    needs: [changes]
    # always() is required here: `changes` only runs for renovate/*-branch PRs
    # (see its own if:), so it's skipped for release-please/workflow_dispatch —
    # and a downstream job's default success() gate treats a skipped need as
    # not-satisfied, skipping this job too, unless always() forces evaluation
    # of the condition below regardless of the needed job's outcome.
    if: |
      always() && (
        startsWith(github.head_ref, 'release-please--') ||
        github.event_name == 'workflow_dispatch' ||
        (startsWith(github.head_ref, 'renovate/') && needs.changes.outputs.roles != '[]')
      )
    uses: PMuellerCH/shared-actions/.github/workflows/ansible_molecule.yml@v1
    with:
      python-version: "3.14"
      install-self-collection: "true"
      roles: ${{ startsWith(github.head_ref, 'renovate/') && needs.changes.outputs.roles || '' }}
