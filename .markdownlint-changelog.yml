---
# Config for CHANGELOG.md only (auto-generated by release-please).
# Identical to .markdownlint-standard.yml but relaxes the rules that
# release-please output breaks in the generated file (it copies commit text
# verbatim and overwrites any manual edits, so these cannot be fixed here):
# - MD013: commit-hash URLs and breaking-change footers are emitted as single
#   long lines (a joined footer can reach well past 700 chars).
# - MD037: literal identifier globs such as kiro_cli_* are flagged as emphasis
#   with a space inside the markers. Avoid bare *_* globs in commit footers
#   (use backticks or a placeholder) to keep new entries clean at the source.
default: true
MD012:
  maximum: 2
MD013: false
MD024:
  siblings_only: true
MD033: false
MD037: false
MD041: false
