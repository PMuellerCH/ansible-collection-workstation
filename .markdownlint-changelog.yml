---
# Config for CHANGELOG.md only (auto-generated by release-please).
# Identical to .markdownlint-standard.yml but allows longer lines because
# release-please emits commit-hash URLs that reach ~300 chars.
default: true
MD012:
  maximum: 2
MD013:
  line_length: 350
  tables: false
  code_blocks: false
MD024:
  siblings_only: true
MD033: false
MD041: false
